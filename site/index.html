<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCS Load Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="Load Check">
<meta name="application-name" content="FCS Load Check">
<meta name="theme-color" content="#393564">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* Layout: one column, phone first. Version 17: Tube & Fitting in First Choice colours. Navy bar with a tube under it, white cards with navy outlines on tube-silver ground, square corners, one font in three sizes. */
:root{
  /* First Choice colours, all from the logo: navy, green and tube silver. Amber and red only ever mean waiting and a problem */
  --bg:#EEEEEC; --card:#FFFFFF; --ink:#26223F; --ink2:#57546F; --ink3:#64617D; --line:#CECECC; --field:#FFFFFF; --ol:#393564; --bw:2px; --fw:400;
  --bar:#393564; --brand:#393564; --brand2:#4A4580; --on-brand:#FFFFFF; --brand-soft:#E6E5EF; --brand-ink:#393564; --edge:#1C1934; --dis:#D9D9D6; --on-dis:#57546F;
  --go:#67BC51; --on-go:#26223F; --go-soft:#E3F2DE; --go-ink:#2F6B22;
  --amber:#F5B82E; --on-amber:#26223F; --warn:#855400; --warn-soft:#FCEFD0; --bad:#C8102E; --bad-soft:#FBE7EA; --on-bad:#FFFFFF;
  --plate:#FFFFFF; --plate-ink:#26223F; --coach:#DCDCE6; --coach-ink:#26223F;
  --c-job:#393564; --c-insp:#0F766E; --c-off:#8E3B8F; --c-wk:#5A5A58; --on-mk:#FFFFFF; --av:#FFFFFF; --av-ink:#393564; --glass:rgba(255,255,255,.14);
  --photo-ink:#FFFFFF; --photo-mark:#7BFF6A; --photo-fill:rgba(123,255,106,.2); --photo-shade:rgba(12,12,28,.76); --photo-ground:#1B2230;
  --lb:#0A0A14; --scrim:rgba(10,10,25,.5); --toast:#26223F; --on-toast:#FFFFFF; --splash:#393564; --splash-ink:#67BC51; --lift:rgba(0,0,0,.14); --ring:rgba(57,53,100,.28);
  --shadow:none;
  --t1:.8125rem; --t2:1rem; --t3:1.625rem;
  --r:3px; --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-look]){
  --bg:#131126; --card:#1D1A36; --ink:#F3F2F8; --ink2:#B9B6D2; --ink3:#A3A0BF; --line:#34305A; --field:#16142C; --ol:#4C477E;
  --bar:#393564; --brand:#E8E6F5; --brand2:#8F8BB5; --on-brand:#26223F; --brand-soft:#2A2650; --brand-ink:#DAD8EE; --edge:#8F8BB5; --dis:#2E2A4E; --on-dis:#A3A0BF;
  --go:#67BC51; --on-go:#14240F; --go-soft:#1B3317; --go-ink:#9AD88A;
  --amber:#F5B82E; --on-amber:#1E1A08; --warn:#F5B82E; --warn-soft:#3A2D0E; --bad:#FF6B6B; --bad-soft:#3D1719; --on-bad:#1A0507;
  --plate:#FFFFFF; --plate-ink:#1A1A1A; --coach:#34305A; --coach-ink:#F3F2F8;
  --c-job:#B7B2F0; --c-insp:#2DD4BF; --c-off:#E08BE3; --c-wk:#B5B5B2; --on-mk:#12121F;
  --toast:#F3F2F8; --on-toast:#26223F; --lift:rgba(0,0,0,.5); --ring:rgba(232,230,245,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]:not([data-look]),:root[data-look="dark"]{
  --bg:#131126; --card:#1D1A36; --ink:#F3F2F8; --ink2:#B9B6D2; --ink3:#A3A0BF; --line:#34305A; --field:#16142C; --ol:#4C477E;
  --bar:#393564; --brand:#E8E6F5; --brand2:#8F8BB5; --on-brand:#26223F; --brand-soft:#2A2650; --brand-ink:#DAD8EE; --edge:#8F8BB5; --dis:#2E2A4E; --on-dis:#A3A0BF;
  --go:#67BC51; --on-go:#14240F; --go-soft:#1B3317; --go-ink:#9AD88A;
  --amber:#F5B82E; --on-amber:#1E1A08; --warn:#F5B82E; --warn-soft:#3A2D0E; --bad:#FF6B6B; --bad-soft:#3D1719; --on-bad:#1A0507;
  --plate:#FFFFFF; --plate-ink:#1A1A1A; --coach:#34305A; --coach-ink:#F3F2F8;
  --c-job:#B7B2F0; --c-insp:#2DD4BF; --c-off:#E08BE3; --c-wk:#B5B5B2; --on-mk:#12121F;
  --toast:#F3F2F8; --on-toast:#26223F; --lift:rgba(0,0,0,.5); --ring:rgba(232,230,245,.3);
  color-scheme:dark;
}
:root[data-look="sun"]{ /* bright sun: black on white, heavier writing, thicker outlines, no pale tints */
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --ink2:#1F1F1F; --ink3:#333333; --line:#000000; --field:#FFFFFF; --ol:#000000; --bw:3px; --fw:500;
  --bar:#26223F; --brand:#26223F; --brand2:#000000; --on-brand:#FFFFFF; --brand-soft:#E6E6E6; --brand-ink:#000000; --edge:#000000; --dis:#BDBDBD; --on-dis:#000000;
  --go:#67BC51; --on-go:#000000; --go-soft:#D3EDCA; --go-ink:#1D4A13;
  --amber:#FFC21A; --on-amber:#000000; --warn:#5C3B00; --warn-soft:#FFEDB8; --bad:#B00020; --bad-soft:#FFDCE2; --on-bad:#FFFFFF;
  --plate:#FFFFFF; --plate-ink:#000000; --coach:#E6E6E6; --coach-ink:#000000;
  --c-job:#26223F; --c-insp:#00585F; --c-off:#6A0F6E; --c-wk:#333333; --on-mk:#FFFFFF;
  --toast:#000000; --on-toast:#FFFFFF; --ring:rgba(0,0,0,.3);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fw) 16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:-400px;height:calc(400px + env(safe-area-inset-top,0px));z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,label,summary,select,.sat{touch-action:manipulation}
button,summary,.act,.btn,.lab,.pill,.tab{-webkit-user-select:none;user-select:none}
h1,h2,h3,p,dl{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

/* frame */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--on-brand)}
.bar-in{max-width:600px;margin:0 auto;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.bar-logo{width:36px;height:36px;border-radius:9px;flex:none;display:block}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.bar-t small{font-size:var(--t1);font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t b{font-size:var(--t2);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-back{appearance:none;border:0;background:var(--glass);color:inherit;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.who{appearance:none;border:0;background:var(--glass);color:inherit;height:40px;padding:0 10px 0 5px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--t2);flex:none;max-width:46%}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.plain{background:none;padding:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--av);color:var(--av-ink);display:grid;place-items:center;font-size:var(--t1);font-weight:700;flex:none;letter-spacing:.02em}
.coach{background:var(--plate);color:var(--plate-ink)}
.coach-in{max-width:600px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.coach-t{display:flex;flex-direction:column;line-height:1.3}
.coach-t small{font-size:var(--t1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.coach-t b{font-size:var(--t2)}
.coach-t span{font-size:var(--t2)}
.coach-b{display:flex;align-items:center;gap:14px}
.coach .btn{background:var(--plate-ink);color:var(--plate);min-height:40px}
.coach .link{color:var(--plate-ink)}
.coach.look .coach-in{gap:6px;padding-top:8px;padding-bottom:6px}
.coach-r{display:flex;flex-wrap:wrap;align-items:center;gap:2px 20px}
.coach.look .coach-b{gap:20px}
.coach.look .coach-b .link{padding:9px 0}
.coach-w{display:flex;flex-wrap:wrap;gap:6px}
.coach-c{min-height:38px;padding:0 13px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:var(--plate-ink);font:inherit;font-weight:600;font-size:var(--t1);cursor:pointer}
.coach-c[aria-pressed="true"]{background:var(--plate-ink);border-color:var(--plate-ink);color:var(--plate)}
.upd{appearance:none;border:0;display:block;width:100%;background:var(--go);color:var(--on-go);font-weight:700;padding:11px 16px;text-align:center}
main{max-width:600px;margin:0 auto;padding-top:18px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:pagein .2s ease both}
main.has-foot{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:flex;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{appearance:none;border:0;background:none;flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:var(--t1);font-weight:600;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:36px;height:3px;margin-left:-18px;border-radius:0 0 3px 3px;background:var(--go)}
.badge{position:absolute;top:8px;left:50%;margin-left:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:var(--t1);font-weight:700;display:grid;place-items:center}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot-in{max-width:568px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:var(--t1);color:var(--ink2);text-align:center}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sheetin{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* type */
.h1{font-size:var(--t3);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--ink2);font-size:var(--t2)}
.lab{font-size:var(--t1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.small{font-size:var(--t1)}

/* cards and rows */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px}
.li:first-child{border-top:0}
button.li{appearance:none;border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left}
.li-t{flex:1;min-width:0;display:flex;flex-direction:column}
.li-t b{font-weight:600}
.li-t small{color:var(--ink2);font-size:var(--t1)}
.li-t .li-w{color:var(--ink);font-size:var(--t1);line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.empty{text-align:center;padding:34px 20px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty svg{width:40px;height:40px;color:var(--ink3);margin-bottom:4px}
.empty b{color:var(--ink);font-size:var(--t2)}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;min-height:52px;padding:0 18px;font-weight:700;font-size:var(--t2);display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--brand);color:var(--on-brand);width:100%;transition:transform .08s ease,opacity .15s ease;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;flex:none}
.btn.go{background:var(--go);color:var(--on-go)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:var(--t2);padding:0 14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.btns.fit{flex-wrap:wrap}
.btns.fit .btn{flex:1 1 auto;white-space:nowrap}
.card-h > .btn{flex:none;white-space:nowrap}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.bad{color:var(--bad)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.acts.one{grid-template-columns:minmax(0,1fr)}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:64px;padding:8px 4px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:var(--t1);text-decoration:none;text-align:center;transition:transform .08s ease}
.act:active{transform:scale(.97)}
.act svg{width:22px;height:22px}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:var(--t1);font-weight:700;white-space:nowrap;flex:none}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-toload{background:var(--warn-soft);color:var(--warn)}
.p-loaded{background:var(--brand-soft);color:var(--brand-ink)}
.p-checked{background:var(--go-soft);color:var(--go-ink)}
.p-out{background:var(--brand);color:var(--on-brand)}
.p-done{background:var(--go);color:var(--on-go)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-weight:700;font-size:var(--t1);letter-spacing:.06em;padding:3px 8px;border-radius:5px;line-height:1.2;white-space:nowrap}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:7px;background:var(--bg);color:var(--ink2);font-size:var(--t1);font-weight:600}

/* job cards */
.job{appearance:none;border:0;text-align:left;width:100%;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .08s ease}
.job:active{transform:scale(.992)}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job-a{font-weight:700;font-size:var(--t2);line-height:1.3;letter-spacing:-.01em}
.job-w{font-size:var(--t2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.job-m{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;color:var(--ink2);font-size:var(--t2)}
.job-s{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--t1);color:var(--ink2)}
.job-s b{font-weight:600;color:var(--ink)}
.job-s .bad{color:var(--bad);font-weight:600}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s ease}
.steps i.on{background:var(--go)}
.steps i.bad{background:var(--bad)}
.need{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--warn);text-align:left}
.need.bad{border-left-color:var(--bad)}
.need.pay{border-left-color:var(--go)}
.need.insp{border-left-color:var(--c-insp)}
.need.wk{border-left-color:var(--c-wk)}
.wk-r{display:flex;align-items:center;gap:10px;justify-content:space-between}
.wk-r .btn{flex:none}
button.need{appearance:none;border-top:0;border-right:0;border-bottom:0;width:100%}
.need b{font-weight:700}
.run{display:flex;flex-direction:column;gap:8px;padding:2px 0 2px 12px;border-left:3px solid var(--brand2)}
.run-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.run-h b{font-weight:700}
.run-add{margin-left:auto;padding:4px 0}
.ty,.seq{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:var(--t1);font-weight:700;white-space:nowrap}
.ty.erect{background:var(--go-soft);color:var(--go-ink)}
.ty.alter{background:var(--warn-soft);color:var(--warn)}
.ty.strike{background:var(--bad-soft);color:var(--bad)}
.seq{background:var(--brand-soft);color:var(--brand-ink)}
.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seq-n{margin-left:auto;display:flex;gap:6px}
.seq-b{appearance:none;border:0;background:var(--bg);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink);padding:0}
.seq-b svg{width:16px;height:16px}
.seq-b[disabled]{opacity:.35;pointer-events:none}
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--ink3);pointer-events:none}
.srch .in{padding-left:44px}

/* job page */
.hero-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.hero-a{font-size:var(--t3);font-weight:700;line-height:1.25;letter-spacing:-.015em;text-wrap:balance}
.what{display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--brand);padding:2px 0 2px 12px}
.what p{margin:0;font-size:var(--t2);line-height:1.4;overflow-wrap:anywhere}
.what.none{border-left-color:var(--line)}
.what.none p{font-size:var(--t2);color:var(--ink2)}
.card.eg{gap:10px;border:1.5px dashed var(--line);box-shadow:none}
.card.eg > div:first-child{display:flex;flex-direction:column;gap:2px}
.card.eg b{font-size:var(--t2)}
.card.eg .btn{align-self:flex-start}
.chips.qw{gap:6px}
.chips.qw .chip{min-height:38px;padding:0 12px;font-size:var(--t1)}
.hint.kit{display:block;margin-top:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;font-size:var(--t2);align-items:baseline}
.kv dt{color:var(--ink3);font-size:var(--t1);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kv dd{margin:0}
.kv dd small{display:block;color:var(--ink2);font-size:var(--t1)}
.track{display:flex;flex-direction:column;gap:0}
.tr{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tr:last-child{padding-bottom:0}
.tr::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tr:last-child::before{display:none}
.tr-d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;color:transparent;z-index:1;transition:background .2s ease,border-color .2s ease}
.tr-d svg{width:14px;height:14px}
.tr.on .tr-d{background:var(--go);border-color:var(--go);color:var(--on-go)}
.tr.bad .tr-d{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.tr.on::before{background:var(--go)}
.tr-t{display:flex;flex-direction:column;line-height:1.3;padding-top:1px;min-width:0;flex:1}
.tr-t b{font-weight:600}
.tr-t small{color:var(--ink2);font-size:var(--t1)}
.tr-t .miss{color:var(--bad);font-weight:600}
.tr-big{font-size:var(--t3);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.note{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:var(--t2);overflow-wrap:anywhere}
.note b{display:block;font-size:var(--t1);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:3px}
.note.know{background:var(--warn-soft)}
.note.know b{color:var(--warn)}
.note.bad{background:var(--bad-soft)}
.note.bad b{color:var(--bad)}
.size{display:flex;flex-direction:column;gap:2px;background:var(--go-soft);border-radius:12px;padding:11px 14px}
.size b{font-weight:700;color:var(--go-ink)}
.size span{font-size:var(--t1);color:var(--ink2)}

/* aerial picture */
.sat{position:relative;height:0;padding-top:75%;overflow:hidden;background:var(--photo-ground);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card:not(.flush) > .sat{border-radius:12px}
.sat.tap{cursor:crosshair}
.sat-t{position:absolute;display:block;max-width:none;pointer-events:none}
.sat svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sat-b{fill:rgba(255,255,255,.08);stroke:var(--photo-ink);stroke-opacity:.8;stroke-width:1.2;stroke-linejoin:round}
.sat-sel{fill:var(--photo-fill);stroke:var(--photo-mark);stroke-width:3;stroke-linejoin:round}
.sat-lb{fill:var(--photo-shade)}
.sat-lt{fill:var(--photo-ink);font:700 11px var(--f)}
.sat-n{fill:var(--photo-ink);font:700 10px var(--f);paint-order:stroke;stroke:var(--photo-shade);stroke-width:3px}
.sat-pr{fill:none;stroke:var(--photo-ink);stroke-width:2.5}
.sat-pd{fill:var(--photo-mark);stroke:var(--photo-shade);stroke-width:1.5}
.sat-c{position:absolute;left:7px;bottom:5px;font-size:var(--t1);color:var(--photo-ink);opacity:.9;text-shadow:0 1px 2px var(--photo-shade);pointer-events:none}
.sat-m{position:absolute;right:8px;bottom:8px;background:var(--photo-shade);color:var(--photo-ink);font-size:var(--t1);font-weight:600;padding:4px 9px;border-radius:8px;pointer-events:none}
.sat-z{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.sat-z button{appearance:none;border:0;width:38px;height:38px;border-radius:10px;background:var(--photo-shade);color:var(--photo-ink);font-size:var(--t3);font-weight:600;line-height:1;display:grid;place-items:center;padding:0}
.sat-z button[disabled]{opacity:.4;pointer-events:none}

/* load sheet */
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.sh-h b.t{font-size:var(--t2)}
.sh-g{padding:10px 16px 6px;font-size:var(--t1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
.sh-g:first-of-type{border-top:0}
.ck{appearance:none;border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:11px 16px;min-height:54px;border-top:1px solid var(--line)}
.sh-g + .ck{border-top:0}
.ck-b{width:28px;height:28px;border-radius:9px;border:2px solid var(--ink3);flex:none;display:grid;place-items:center;color:transparent;transition:background .15s ease,border-color .15s ease}
.ck-b svg{width:17px;height:17px}
.ck-n{flex:1;min-width:0;font-weight:500}
.ck-n small{display:block;font-size:var(--t1);font-weight:400;color:var(--ink2);line-height:1.3}
.ck-q{font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:3px 9px;font-size:var(--t2)}
.ck.ok{background:var(--go-soft)}
.ck.no{background:var(--bad-soft)}
.ck.ok .ck-b{background:var(--go);border-color:var(--go);color:var(--on-go)}
.ck.no .ck-b{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.ck.no .ck-n{color:var(--bad)}
.ck-s{font-size:var(--t1);font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.ck.ro{pointer-events:none}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--go);border-radius:3px;transition:width .25s ease}
.tip{font-size:var(--t1);color:var(--ink2);padding:0 16px 12px}

/* on site: extra work and photos */
.xr{display:flex;flex-direction:column;gap:8px;padding:13px 16px;border-top:1px solid var(--line)}
.xr-t{font-weight:600;overflow-wrap:anywhere}
.xr-m{font-size:var(--t1);color:var(--ink2)}
.xr-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 16px 16px}
.gal.in-row{padding:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.th{appearance:none;border:0;padding:0;background:var(--bg);border-radius:10px;overflow:hidden;position:relative;height:0;padding-top:100%;display:block;width:100%}
.th img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.lbx{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;background:var(--lb);color:var(--photo-ink);display:flex;flex-direction:column;animation:fadein .18s ease both}
.lbx-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-weight:600}
.lbx-x{appearance:none;border:0;background:var(--glass);color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.lbx-x svg{width:20px;height:20px}
.lbx-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
.lbx-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;display:block}
.lbx-bot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.lbx-cap{font-size:var(--t2);opacity:.85;text-align:center}
.lbx .btn{background:var(--glass);color:var(--photo-ink);box-shadow:none}

/* forms */
.fld{display:flex;flex-direction:column;gap:7px}
.fld > label,.fld > .fl{font-size:var(--t2);font-weight:600}
.in{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);padding:0 14px;font-size:var(--t2)}
textarea.in{padding:12px 14px;min-height:84px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.in:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
.in.pc{text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.in.pc::placeholder{text-transform:none;font-weight:400;letter-spacing:0}
.rowf{display:flex;gap:10px}
.rowf .in{flex:1;min-width:0}
.rowf .btn{width:auto;flex:none;min-height:50px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;flex:1;min-height:42px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:var(--t2);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:0 1px 3px var(--lift)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:var(--t2);display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip .x{opacity:.6;font-size:var(--t2);line-height:1}
.hint{font-size:var(--t1);color:var(--ink2)}
.err{font-size:var(--t2);color:var(--bad);font-weight:600}
.addr-list{border:1.5px solid var(--line);border-radius:12px;max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--field)}
.addr-list button{appearance:none;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:12px 14px;min-height:48px;font-weight:500}
.addr-list button:first-child{border-top:0}
.addr-list button:active{background:var(--brand-soft)}
.grp{border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.chips.mx{padding:2px 16px 16px}
.chips.mx + .grp,.ld + .grp{border-top:1px solid var(--line)}
.ld{padding:2px 16px 14px;display:flex;flex-direction:column;gap:12px}
.grp > summary,.fold > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:600;cursor:pointer;min-height:54px}
.grp > summary::-webkit-details-marker,.fold > summary::-webkit-details-marker{display:none}
.grp > summary::after,.fold > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin-right:4px;flex:none;transition:transform .15s ease}
.grp[open] > summary::after,.fold[open] > summary::after{transform:rotate(-135deg)}
.fold > summary > span{flex:1;min-width:0;display:flex;flex-direction:column}
.fold > summary small{font-weight:400;color:var(--ink2);font-size:var(--t1)}
.fold[open] > summary{border-bottom:1px solid var(--line)}
.grp-n{margin-left:auto;background:var(--brand);color:var(--on-brand);border-radius:999px;min-width:24px;height:24px;padding:0 8px;display:grid;place-items:center;font-size:var(--t1);font-weight:700}
.st{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:52px}
.st-n{flex:1;min-width:0;font-weight:500}
.st-c{display:flex;align-items:center;gap:6px}
.st-c button{appearance:none;border:1.5px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:11px;font-size:var(--t3);font-weight:600;line-height:1;display:grid;place-items:center;padding:0}
.st-c input{width:52px;height:40px;text-align:center;border:1.5px solid var(--line);border-radius:11px;background:var(--field);font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0}
.st-c input::-webkit-outer-spin-button,.st-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.st.has{background:var(--brand-soft)}
.st.has .st-n{font-weight:700}
.st.has .st-c input{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-size:var(--t2);font-weight:700}
.cal-nav{appearance:none;border:0;background:var(--bg);width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.cal-nav svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-d{font-size:var(--t1);font-weight:700;color:var(--ink3);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.day{appearance:none;border:0;background:none;min-height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:5px 0 3px;font-weight:600;font-size:var(--t2);color:var(--ink);min-width:0}
.day.out{color:var(--ink3);opacity:.45}
.mks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:46px}
.mk{min-width:19px;height:17px;padding:0 5px;border-radius:9px;font-size:var(--t1);font-weight:700;display:grid;place-items:center;line-height:1;color:var(--on-mk)}
.mk.jobs{background:var(--c-job)}
.mk.jobs.fin{background:var(--go);color:var(--on-go)}
.mk.insp{background:var(--c-insp);border-radius:3px}
.mk.off{background:var(--c-off)}
.mk.wk{background:var(--c-wk);border-radius:3px}
.mk.bad{background:var(--bad);color:var(--on-bad)}
.mk.plan{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.mk.insp.plan{color:var(--c-insp)}
.mk.off.plan{color:var(--c-off)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:38px;padding:0 13px;font-weight:600;font-size:var(--t1);display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.key[aria-pressed="true"]{border-color:var(--brand2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand2)}
.kd{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.kd.jobs{background:var(--c-job);width:16px;border-radius:6px}
.kd.insp{background:var(--c-insp);border-radius:3px}
.kd.off{background:var(--c-off)}
.kd.wk{background:var(--c-wk);border-radius:3px}
.sh-g .kd{margin-right:7px;vertical-align:-1px}
.kd.bad{background:var(--bad);border-radius:4px}
.kd.fin{background:var(--go);width:16px;border-radius:6px}
.kd.plan{background:none;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.cal-k{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--t1);color:var(--ink2)}
.cal-k span{display:inline-flex;align-items:center;gap:6px}
.sh-g + .li{border-top:0}
.day.today{background:var(--brand-soft);color:var(--brand-ink)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brand2)}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.day .dot{font-size:var(--t1);font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;background:var(--go);color:var(--on-go)}
.day .dot.pend{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.day .jn{min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:var(--t1);font-weight:700;display:grid;place-items:center;line-height:1}
.day .jn.ok{background:var(--go);color:var(--on-go)}
.day .jn.bad{background:var(--bad);color:var(--on-bad)}
.who-row .av{background:var(--brand);color:var(--on-brand)}
.dayx{padding:12px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:var(--t2);color:var(--ink2)}
.dayx b{color:var(--ink);font-weight:600}
.av.soft{background:var(--brand-soft);color:var(--brand-ink)}

/* sheets and toast */
.scrim{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s ease both}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px var(--lift);animation:sheetin .22s ease both}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet > .btn.go:last-child{position:sticky;bottom:0;flex:none;box-shadow:0 0 0 12px var(--card),0 44px 0 12px var(--card)}   /* the main button of a long sheet stays in view */
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h b{font-size:var(--t2);font-weight:700}
.pick{appearance:none;border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 4px;min-height:56px;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.pick .av{width:38px;height:38px;font-size:var(--t1);background:var(--brand-soft);color:var(--brand-ink)}
.pick[aria-pressed="true"] .av{background:var(--brand);color:var(--on-brand)}
.pick-t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.pick-t b{font-weight:600}
.pick-t small{color:var(--ink2);font-size:var(--t1)}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);z-index:80;background:var(--toast);color:var(--on-toast);padding:11px 16px;border-radius:12px;font-weight:600;font-size:var(--t2);max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;box-shadow:0 8px 24px var(--lift);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.low{top:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#splash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:var(--splash);display:grid;place-items:center;transition:opacity .35s ease,visibility 0s linear .35s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:150px;height:150px;display:block}
#splash div{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--photo-ink);font-family:var(--f)}
#splash b{font-size:var(--t3);font-weight:700;letter-spacing:-.01em}
#splash small{font-size:var(--t1);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--splash-ink)}
.at{display:flex;flex-direction:column;gap:6px}
.at p{padding:8px 12px;border-radius:9px;font-size:var(--t1);display:flex;flex-direction:column}
.at p span{color:var(--ink2);overflow-wrap:anywhere}
.at .y{background:var(--go-soft)}
.at .n{background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* the guide */
.gd + .gd{border-top:1px solid var(--line)}
.gd ol,.gd ul{margin:0;padding:12px 18px 16px 40px;display:flex;flex-direction:column;gap:9px;font-size:var(--t2)}
.gd li::marker{color:var(--ink3);font-weight:700}
.gd-h{font-size:var(--t3)}

/* alerts */
.al{align-items:flex-start}
.al-d{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--c-job)}
.al-d.load{background:var(--plate)}
.al-d.time{background:var(--go)}
.al-d.x{background:var(--warn)}
.al-d.wk{background:var(--c-wk)}
.al-d.insp{background:var(--c-insp)}
.al-d.off{background:var(--c-off)}
.al.new{background:var(--brand-soft)}
.al-f{text-align:center;padding:0 12px}
.al .li-t small.al-t{color:var(--ink3);font-size:var(--t1);margin-top:2px}
.hint > svg{width:15px;height:15px;vertical-align:-2px;margin-right:2px}

/* week planner: men down the side, days across the top */
.plan{overflow-x:auto}
.pl-r{display:grid;grid-template-columns:132px repeat(7,minmax(116px,1fr));border-top:1px solid var(--line);min-width:960px}
.pl-r:first-child{border-top:0}
.pl-n{padding:10px 12px;display:flex;align-items:center;gap:9px;min-width:0;background:var(--card);position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line);font-size:var(--t1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.pl-nm{min-width:0;display:flex;flex-direction:column;letter-spacing:0;text-transform:none;font-weight:400}
.pl-nm b{font-weight:600;font-size:var(--t2);color:var(--ink);line-height:1.2}
.pl-nm small{color:var(--ink2);font-size:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-d{padding:9px 6px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.pl-d b{font-weight:700}

.pl-c.today{background:var(--brand-soft)}

.pj-m{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;font-size:var(--t1);color:var(--ink2);white-space:nowrap}

.pj-s.toload{color:var(--warn)}
.pj-s.checked,.pj-s.out,.pj-s.done{color:var(--go-ink)}
.pj-s.bad{color:var(--bad)}
.kd.erect{background:var(--go);border-radius:3px}
.kd.alter{background:var(--warn);border-radius:3px}
.kd.strike{background:var(--bad);border-radius:3px}
.pl-k{border-top:0;padding-top:0}
.calv{background:var(--card);box-shadow:var(--shadow)}
.calv button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none}

/* columns: on a phone the wrappers vanish and everything stacks in one column, as before */
.col{display:contents}
.nav.sub,.wide{display:none}

/* laptop: the tabs become a side menu, and a page with two halves sits in two columns */
@media (min-width:1000px){
  .bar-in,.coach-in{max-width:none;padding-left:24px;padding-right:24px}
  .nav,.nav.sub{display:block;top:var(--bar-h,60px);right:auto;width:216px;border-top:0;border-right:1px solid var(--line);padding:14px 10px}
  .nav-in{max-width:none;margin:0;flex-direction:column;gap:4px;padding:0}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;font-size:var(--t2);text-align:left}
  .tab[aria-current="page"]{background:var(--brand-soft)}
  .tab[aria-current="page"]::before{display:none}
  .tab .badge{position:static;margin-left:auto}
  main{max-width:760px;margin-left:calc(216px + max(0px,(100vw - 216px - 760px)/2));margin-right:0;padding:26px 28px 72px}
  main.two,main.side{max-width:1180px;margin-left:calc(216px + max(0px,(100vw - 216px - 1180px)/2));display:grid;gap:20px;align-items:start}
  main.full{max-width:1560px;margin-left:calc(216px + max(0px,(100vw - 216px - 1560px)/2))}
  main.full .calv{align-self:flex-start;min-width:340px}
  main.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  main.side{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto 1fr}
  main.two > .col,main.side > .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  main.side > .ca{grid-column:1;grid-row:1}
  main.side > .cb{grid-column:1;grid-row:2}
  main.side > .cs{grid-column:2;grid-row:1 / span 2}
  .wide{display:block}
  main.has-foot{padding-bottom:132px}
  .foot{left:216px}
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:520px;border-radius:20px;max-height:86vh;padding-top:18px}
  .sheet::before{display:none}
}

/* ---------- version 12: the every-job items on the job sheet, the yard's load cards, staff roles in Set-up ---------- */
.ev{padding:12px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ev .st{margin:0 -16px}
.ev + .grp{border-top:1px solid var(--line)}
.ld-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ld-a .plate{font-size:var(--t2);padding:4px 10px}
.ld-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ld-h .plate{font-size:var(--t3);padding:6px 14px;border-radius:7px}
.ld-h span:not(.plate){font-size:var(--t2);font-weight:600;color:var(--ink2);letter-spacing:0}
.st-r{flex-wrap:wrap}
.st-b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.st-r .st-b{flex-basis:100%;justify-content:flex-start;padding-left:52px}}

/* ---------- version 13: one load list per lorry ---------- */
.hint.ldsh{display:block;margin:0 16px 4px;padding:10px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink)}
.ldc{display:flex;flex-direction:column;gap:10px}
.ldc .btn{align-self:flex-start}
.ldn{text-align:left;border-left-color:var(--brand2)}
.ldn.pay{border-left-color:var(--go)}
.ldn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ldn-h .pill{margin-left:auto}
/* version 14: jobs not allocated yet, and lorries with no load list sent */
.p-plan{background:var(--line);color:var(--ink2)}
.need.plan{border-left-color:var(--ink3)}
.ld-none{cursor:default}
.ld-none .btn{align-self:flex-start}
.pl-u .pl-c{background:color-mix(in srgb,var(--line) 35%,transparent)}
.pl-u .pl-nm small{color:var(--ink3)}
.pj-s.plan{color:var(--ink3)}

/* version 15: the boss's pages. A day bar, page tabs, the gang list and More */
.seg.pages{background:var(--card);box-shadow:var(--shadow)}
.seg-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:var(--on-bad);font-size:var(--t1);font-weight:700;margin-left:4px}
.dayb{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dayb .cal-h{margin:0}
.dayb-t{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.dayb-t b{font-size:var(--t2)}
.dayb-t small{color:var(--ink2);font-size:var(--t1)}
.dayb-c{justify-content:center}
.need.ahead{cursor:pointer}
.done-f summary{padding:14px 16px}
.ld-need{border-left:4px solid var(--bad)}
.gang .sh-h b.t{display:flex;align-items:center;gap:8px}
.more-l .li:first-child{border-top:0}
.more-r svg:last-child{width:18px;height:18px;color:var(--ink3);flex:none}
.more-i{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.more-i svg{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts > .btn{width:100%}
.sh-h > .btn{white-space:nowrap;flex-shrink:0}

/* ---------- version 16: Today, the bell, Wasn't on, time off that clashes ---------- */
.bell-b{position:relative;flex:none;width:44px;height:44px;border-radius:12px;border:0;background:var(--glass);color:#fff;display:grid;place-items:center;cursor:pointer}
.bell-b svg{width:22px;height:22px}
.bell-b .badge{position:absolute;top:-4px;right:-4px}
.dash{display:flex;flex-direction:column;gap:16px}
.dash-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dash-h b{display:block;font-size:var(--t3);line-height:1.15}
.dash-h span{color:var(--ink2);font-weight:500}
.dash-need{display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:88px;padding:12px 14px;border:0;border-left:5px solid var(--warn);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);color:var(--ink);font:inherit;cursor:pointer}
.tile b{font-size:var(--t3);line-height:1;color:var(--warn)}
.tile span{font-size:var(--t2);font-weight:500;color:var(--ink2);line-height:1.3}
.tile.r{border-left-color:var(--bad)}

.all-ok{display:flex;align-items:center;gap:12px;border-left:5px solid var(--go)}
.all-ok svg{flex:none;width:28px;height:28px;color:var(--go)}
.all-ok b{display:block}
.all-ok span{color:var(--ink2);font-size:var(--t2)}
.dash-cols{display:flex;flex-direction:column;gap:16px}
.dlist{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.drow:first-child{border-top:0}
.drow-t{flex:1;min-width:0;display:flex;flex-direction:column}
.drow-t b{font-weight:600}
.drow-t small{color:var(--ink2);font-size:var(--t2)}
.drow .pill{flex:none}
.bad-t{color:var(--bad);font-weight:600}
small.bad-t{display:block}
.need.bad{border-left-color:var(--bad)}
.unsigned{padding:12px;border-radius:var(--r);background:var(--bad-soft)}
.ckw{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.ckw > .ck{flex:1;min-width:0;border-top:0}
.ck-x{flex:none;min-width:96px;min-height:48px;margin:8px 12px 8px 0;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2);font:600 var(--t2) var(--f);cursor:pointer}
.ck.fix .ck-b{background:var(--warn);border-color:var(--warn)}
.nm-b{border:0;background:none;padding:0;margin:0;font:inherit;font-weight:600;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;min-height:32px}
.days-say{margin:0}
@media (min-width:1000px){
  main.dash{max-width:1180px;margin-left:calc(216px + max(0px,(100vw - 216px - 1180px)/2))}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}

}
.lesson-ring{outline:3px solid var(--plate)!important;outline-offset:3px;box-shadow:0 0 0 8px rgba(247,200,0,.28)!important;animation:ring 1.6s ease-in-out infinite;position:relative;z-index:2}
@keyframes ring{0%,100%{box-shadow:0 0 0 4px rgba(247,200,0,.35)}50%{box-shadow:0 0 0 11px rgba(247,200,0,.12)}}

.coach.lesson .coach-t b{display:flex;align-items:center;gap:6px}
.coach.lesson .coach-t b svg{width:18px;height:18px}
.learn .list{border-top:1px solid var(--line)}
.learn-h{display:block;padding:12px 16px 4px}
.learn-r{width:100%;min-height:56px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}

.learn-k svg{width:16px;height:16px}

/* ---------- version 17: Tube & Fitting in First Choice colours (Ian, 27 Nov). One font in three sizes, square corners, navy outlines, a tube under the top bar.
   Green only ever means done, amber waiting, red a problem. Lorry plates are white, like a front plate ---------- */
:focus-visible{outline-color:var(--brand)}
.tube{height:8px;background:linear-gradient(180deg,#F6F6F4 0%,#CECECC 50%,#9C9C99 100%)}
.bar-logo{border-radius:3px}
.bar-t small{font-size:var(--t1);font-weight:700;opacity:.9}
.bar-t small .w{display:none}
@media (min-width:480px){.bar-t small .w{display:inline}}
.bar-t b,.dash-h b,.sh-h b.t,.sheet-h b,.cal-h b,.dayb-t b,.h1,.gd-h,#splash b{font-size:var(--t3);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:0;line-height:1.1}
.hero-a,.tr-big,.empty b,.card.eg b{font-weight:800;font-stretch:75%;letter-spacing:0;line-height:1.15}
.hero-a,.tr-big{font-size:var(--t3)}
.bar-back,.bell-b{width:44px;height:44px;border-radius:var(--r);background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.who{border-radius:var(--r);height:44px}
.av{border-radius:var(--r);font-size:var(--t1)}
.badge{border-radius:2px;height:20px;min-width:20px;font-size:var(--t1);font-weight:800}
.nav{border-top:var(--bw) solid var(--ol)}
.tab{font-size:var(--t1);color:var(--ink2)}
.tab[aria-current="page"]{color:var(--brand-ink);font-weight:800}
.tab[aria-current="page"]::before{left:0;width:100%;margin-left:0;height:4px;border-radius:0;background:var(--brand-ink)}
.foot{border-top:var(--bw) solid var(--ol)}
.upd{background:var(--brand);color:var(--on-brand)}
/* cards: white with a navy outline, no shadow, no coloured edge bars */
.card,.job,.need,.tile,.calv,.seg.pages{border:var(--bw) solid var(--ol);box-shadow:none;border-radius:var(--r)}
.need,.need.bad,.need.pay,.need.insp,.need.wk,.need.plan,.ldn,.ldn.pay,.all-ok{border-left:var(--bw) solid var(--ol)}
.need.bad,.ldn.bad,.ld-need{border-color:var(--bad)}
button.need{border-top:var(--bw) solid var(--ol);border-right:var(--bw) solid var(--ol);border-bottom:var(--bw) solid var(--ol)}
button.need.bad{border-color:var(--bad)}
.card.eg{border:var(--bw) dashed var(--ol)}
.sheet{border-radius:6px 6px 0 0;border-top:var(--bw) solid var(--ol)}
.note,.size,.hint.ldsh,.unsigned,.at p,.addr-list,.th,.lbx-img img{border-radius:var(--r)}
.size{background:var(--brand-soft)}
.size b{color:var(--brand-ink)}
/* buttons: navy, with a pressed edge. A button that can't be pressed yet is plain grey, never a pale colour */
.btn{border-radius:var(--r);box-shadow:0 3px 0 var(--edge);font-size:var(--t2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--brand);color:var(--on-brand)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 var(--bw) var(--ol)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.btn.danger{background:var(--card);color:var(--bad);box-shadow:inset 0 0 0 var(--bw) var(--bad)}
.btn.sm{min-height:44px;font-size:var(--t2);border-radius:var(--r)}
.btn[disabled]{opacity:1;background:var(--dis);color:var(--on-dis);box-shadow:none}
.link{min-height:44px;display:inline-flex;align-items:center}
.act{border-radius:var(--r)}
.seg{border-radius:var(--r);padding:3px;gap:3px}
.seg button{border-radius:2px;min-height:44px}
.seg button[aria-pressed="true"]{box-shadow:none}
.chip,.key{border-radius:var(--r);border-width:2px;min-height:44px}
.in{border-radius:var(--r);border-width:2px}
.st-c button,.st-c input{border-radius:var(--r);border-width:2px;height:44px}
.st-c button{width:44px}
.seq-b,.cal-nav{width:44px;height:44px;border-radius:var(--r)}
.more-i{border-radius:var(--r)}
.ck-b{border-radius:var(--r)}
.ck-q{border-radius:var(--r)}
.ck-x{border-radius:var(--r);border-width:2px;font-size:var(--t1);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ck.fix .ck-b{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.day{border-radius:var(--r)}
.mk,.day .jn,.day .dot,.seg-n,.grp-n{border-radius:2px}
.mk{height:20px;min-width:20px}
.day .jn{height:20px}
.pl-c.over,.dragging .pl-c[data-drop].over{box-shadow:inset 0 0 0 2px var(--brand-ink);background:var(--brand-soft)}
/* status tags: square, in capitals. Amber waiting, green done, red a problem, navy outline for everything else */
.pill{border-radius:2px;height:28px;padding:0 9px;font-size:var(--t1);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.pill i{display:none}
.p-toload,.p-loaded{background:var(--amber);color:var(--on-amber)}
.p-checked{background:var(--go-soft);color:var(--go-ink);box-shadow:inset 0 0 0 2px var(--go)}
.p-done{background:var(--go);color:var(--on-go)}
.p-out{background:transparent;color:var(--brand-ink);box-shadow:inset 0 0 0 2px var(--brand-ink)}
.p-bad{background:var(--bad);color:var(--on-bad)}
.p-plan{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line)}
.ty,.seq,.tag{border-radius:2px;font-size:var(--t1);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.ty.erect,.ty.alter,.ty.strike{background:transparent;color:var(--brand-ink);box-shadow:inset 0 0 0 2px var(--brand-ink)}
.kd.erect,.kd.alter,.kd.strike{background:var(--brand-ink)}
.pj,.pj.erect,.pj.alter,.pj.strike{border-left:0;box-shadow:inset 0 0 0 1.5px var(--ol);border-radius:var(--r)}
.plate{background:var(--plate);color:var(--plate-ink);box-shadow:inset 0 0 0 2px var(--plate-ink);border-radius:3px;font-weight:800;font-stretch:80%;font-size:var(--t2);padding:2px 8px}
.pl-pl .plate,.pj .plate{font-size:var(--t1);padding:1px 5px;box-shadow:inset 0 0 0 1.5px var(--plate-ink)}
.ld-a .plate{font-size:var(--t2);padding:3px 10px}
.ld-h .plate{font-size:var(--t3);padding:4px 14px}
.al-d{border-radius:2px}
.al-d.load{background:var(--brand-ink)}
.al-d.x{background:var(--amber)}
/* Today: the number in a navy band, and a tag that says what it is */
.tile{padding:0;gap:0;min-height:0;overflow:hidden;align-items:stretch}
.tile.r,.tile.a{border-left:var(--bw) solid var(--ol)}
.tile-n{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 6px 12px;background:var(--brand);color:var(--on-brand)}
.tile-n b{font-size:var(--t3);font-weight:800;font-stretch:75%;line-height:1.1;color:inherit}
.tile-n i{font-style:normal;font-size:var(--t1);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:2px}
.tile.r .tile-n i{background:var(--bad);color:var(--on-bad)}
.tile.a .tile-n i{background:var(--amber);color:var(--on-amber)}
.tile-l{padding:10px 12px 12px;font-size:var(--t2);color:var(--ink);line-height:1.3}
.all-ok svg{color:var(--go-ink)}
/* the demo strip and the lessons */
.coach{background:var(--coach);color:var(--coach-ink);border-bottom:var(--bw) solid var(--ol)}
.coach .btn{background:var(--brand);color:var(--on-brand);min-height:44px}
.coach .link{color:var(--coach-ink)}
.coach-c{border-radius:var(--r);border-width:2px;color:var(--coach-ink);min-height:44px}
.coach-c[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.lesson-ring{outline:3px solid var(--brand-ink)!important;box-shadow:0 0 0 8px var(--ring)!important;animation:ring17 1.6s ease-in-out infinite}
@keyframes ring17{0%,100%{box-shadow:0 0 0 4px var(--ring)}50%{box-shadow:0 0 0 11px transparent}}
@media (prefers-reduced-motion:reduce){.lesson-ring{animation:none}}
.learn-k{border-radius:var(--r);color:var(--on-go)}
/* how the screen looks: follow the phone, light, dark or bright sun */
.look .seg{flex-wrap:wrap}
.look .seg button{flex:1 1 40%}
#splash small{font-size:var(--t1)}
@media (min-width:1000px){
  .nav,.nav.sub{border-right:var(--bw) solid var(--ol)}
  .tab{font-size:var(--t2);border-radius:var(--r)}
  .tab[aria-current="page"]{background:var(--brand-soft)}
  .sheet{border-radius:6px;border:var(--bw) solid var(--ol)}
}
/* counts of things waiting on you are amber, like the rest of "waiting" */
.badge,.seg-n{background:var(--amber);color:var(--on-amber)}
/* on a narrow phone the person button shows just the initials, so the page name has room */
@media (max-width:420px){.who > span:not(.av){display:none}}
/* the top bar is navy in every look, so its writing is always white */
.bar{color:#FFFFFF}
/* CISRS cards next to each name: navy words, amber when it runs out within two months, red once it has */
.qc{display:inline-block;font-size:var(--t1);font-weight:700;color:var(--brand-ink);white-space:normal}
.qc.soon{background:var(--amber);color:var(--on-amber);padding:0 5px;border-radius:2px}
.qc.gone{background:var(--bad);color:var(--on-bad);padding:0 5px;border-radius:2px}
.li-t small .qc,.kv dd small .qc{margin-top:1px}
.kv dd small{display:block}
.st-r .li-t small + small{display:block}
/* the yard board: each lorry, and where its load has got to, with times */
.dash-yb{display:flex;flex-direction:column;gap:8px}
.drow.yb{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px}
.yb-h{display:flex;align-items:center;gap:12px;width:100%}
.yb-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
.yb-s{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:var(--t1);line-height:1.25}
.yb-s i{display:block;height:6px;border-radius:1px;background:var(--dis);margin-bottom:3px}
.yb-s.on i{background:var(--brand-ink)}
.yb-s.ok i{background:var(--go)}
.yb-s.half i{background:linear-gradient(90deg,var(--amber) var(--p,50%),var(--dis) var(--p,50%))}
.yb-s b{font-weight:700}
.yb-s small{font-size:var(--t1);color:var(--ink2)}
/* the Today tiles: beat the version 16 tile colours */
.tile .tile-n{background:var(--bar);color:#FFFFFF}
.tile .tile-n b,.tile.r .tile-n b{color:#FFFFFF;font-size:var(--t3)}
.tile .tile-l{color:var(--ink);font-weight:var(--fw)}
</style>
</head>

/* ---------- small helpers ---------- */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(o){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(o||0));return dstr(d);}
function pdate(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function daysTo(s){return Math.round((pdate(s)-pdate(today(0)))/864e5);}
function addDays(s,n){var d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);}
function tsDay(t){return dstr(new Date(t));}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fshort(s){var d=pdate(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function fday(s){var n=daysTo(s);return n===0?'Today':(n===1?'Tomorrow':(n===-1?'Yesterday':fshort(s)));}
function fwhen(s){return fday(s)+(Math.abs(daysTo(s))<=1?' · '+fshort(s):'');}
function frange(a,b){return a===b?fshort(a):fshort(a)+' to '+fshort(b);}
function clock(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());}
function ftime(t){var ds=dstr(new Date(t));return (ds===today(0)?'':fshort(ds)+', ')+clock(t);}
function plural(n,w){return n+' '+w+(n===1?'':'s');}

function fm(n){return String(r1(n))+' m';}
function fft(n){return Math.round(n*3.28084)+' ft';}

function LocalDb(seed,changed,sync){
  var data=JSON.parse(JSON.stringify(seed)), subs=[], cp=function(v){return JSON.parse(JSON.stringify(v));};
  function snap(c){var o=data[c]||{};return {docs:Object.keys(o).map(function(id){var v=cp(o[id]);return {id:id,data:function(){return v;}};})};}
  function emit(c){subs.forEach(function(s){if(s.c===c)s.cb(snap(c));});if(changed)changed();}
  function merge(a,b){Object.keys(b).forEach(function(k){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k];});}
  function doc(path){var p=path.split('/'),c=p[0],id=p[1];return {id:id,
    set:async function(v){(data[c]=data[c]||{})[id]=cp(v);emit(c);},
    update:async function(v){data[c]=data[c]||{};data[c][id]=data[c][id]||{};merge(data[c][id],cp(v));emit(c);},
    delete:async function(){if(data[c])delete data[c][id];emit(c);}};}
  return {dump:function(){return cp(data);},doc:doc,collection:function(c){return {
    onSnapshot:function(cb){subs.push({c:c,cb:cb});if(sync)cb(snap(c));else setTimeout(function(){cb(snap(c));},0);return function(){};},
    add:async function(v){var id=uid('n');await doc(c+'/'+id).set(v);return {id:id};}};}};
}

/* ---------- address finder ---------- */
function addrKey(){var k='';try{k=(localStorage.getItem('fcs-addr-key')||'').trim();}catch(_){ }return k||ADDR_KEY_BUILT;}
function osKey(){var k='';try{k=(localStorage.getItem('fcs-os-key')||'').trim();}catch(_){ }return k;}   // the firm's Ordnance Survey key, kept on this phone only
function normPc(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fmtPc(n){n=normPc(n);return n.length>3?n.slice(0,-3)+' '+n.slice(-3):n;}
function titleCase(t){return String(t||'').toLowerCase().replace(/(^|[\s\-'])([a-z])/g,function(m,a,b){return a+b.toUpperCase();});}
function cleanArea(v){return v?String(v).replace(/,?\s*unparished area$/i,''):'';}
function ipcUrl(path){return 'https://api.ideal-postcodes.co.uk/v1/'+path+(path.indexOf('?')<0?'?':'&')+'api_key='+encodeURIComponent(addrKey());}
function ipcProblem(p){
  var c=p.js&&p.js.code;
  if(c===4010) return 'The address service doesn’t recognise the key.';
  if(c===4011) return 'The address service key isn’t allowed from this web address.';
  if(c===4020) return 'The address service has run out of lookups.';
  if(c===4021) return 'The address service has hit its daily limit.';
  if(p.status===429) return 'The address service is busy. Try again in a minute.';
  if(!p.status) return 'Couldn’t reach the address service.';
  return 'The address service didn’t answer.';
}
function pafItem(a){
  var lines=[a.line_1,a.line_2,a.line_3].filter(function(x){return x&&String(x).trim();}), lat=parseFloat(a.latitude), lon=parseFloat(a.longitude);
  return {line:lines.join(', '),tail:[titleCase(a.post_town),a.postcode].filter(Boolean).join(' '),lat:isNaN(lat)?null:lat,lon:isNaN(lon)?null:lon};
}
function fullAddr(f){return [String(f.line||'').trim(),String(f.tail||'').trim()].filter(Boolean).join(', ');}
async function findPc(){
  var f=S.form; if(!f) return; var raw=normPc(f.pc);
  if(raw.length<5||raw.length>7){toast('Type the whole postcode, like SS6 7AA');return;}
  f.pcRes={busy:true}; render(true);
  var res=null, note='';
  if(addrKey()){
    var p=await probe(ipcUrl('postcodes/'+raw),12000);
    if(p.ok&&p.js&&Array.isArray(p.js.result)&&p.js.result.length) res={pc:p.js.result[0].postcode||fmtPc(raw),list:p.js.result.map(pafItem)};
    else if(p.status===404) res={nf:true,pc:fmtPc(raw)};
    else note=ipcProblem(p);
  }
  if(!res){
    var q=await probe('https://api.postcodes.io/postcodes/'+raw,10000), r=q.ok&&q.js&&q.js.result;
    if(r&&r.latitude!=null) res={pc:r.postcode,list:[],tail:[cleanArea(r.parish)||r.admin_district||'',r.postcode].filter(Boolean).join(' '),lat:r.latitude,lon:r.longitude,note:note};
    else if(q.status===404) res={nf:true,pc:fmtPc(raw)};

  }
  if(S.form!==f) return;
  f.pcRes=res;
  if(res.tail){f.tail=res.tail;f.lat=res.lat;f.lon=res.lon;newSpot(f);}
