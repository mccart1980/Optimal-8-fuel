<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCS Load Check</title>
<meta name="apple-mobile-web-app-title" content="Load Check">
<meta name="application-name" content="FCS Load Check">
<meta name="theme-color" content="#393564">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a phone-first load sheet in First Choice Scaffolding colours: navy bar, green for go, silver tube. Top bar, section bar at thumb reach, and every job reads like the paper docket it replaces: plate, load, crew, then the sheet */
:root{
  --bg:#EEEEF4; --surface:#FFFFFF; --surface-2:#E3E2EC; --ink:#1B1937; --muted:#5B5876; --line:#CDCBDB;
  --accent:#67BC51; --accent-ink:#13112B; --accent-line:#3B8A28; --accent-soft:#E4F3DE;
  --ok:#2B7A1E; --ok-bg:#E0F1DA; --short:#B3261E; --short-bg:#FAE2DF; --warn:#7A5200; --warn-bg:#F8EBC4;
  --plate:#F7C800; --plate-ink:#0E0E0E; --plate-edge:#7C6400;
  --bar:#393564; --bar-2:#4A4579; --bar-ink:#FFFFFF; --bar-muted:#C4C1DE; --bar-green:#7BCB66;
  --brand:#393564; --brand-ink:#FFFFFF; --brand-soft:#E5E3F1; --brand-txt:#393564;
  --badge:#D93025; --badge-ink:#FFFFFF;
  --lb-bg:#0B0A16; --lb-ink:#EEF0F3;
  --shadow:rgba(27,25,55,.2);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F22; --surface:#1B1933; --surface-2:#252243; --ink:#ECEBF5; --muted:#A3A0C2; --line:#353259;
  --accent:#6CC456; --accent-ink:#0F0D22; --accent-line:#6CC456; --accent-soft:#1D3218;
  --ok:#7DD66A; --ok-bg:#17301A; --short:#FF7D70; --short-bg:#3A1A17; --warn:#F2C44F; --warn-bg:#352B10;
  --plate:#F2C200; --plate-ink:#0E0E0E; --plate-edge:#8A7000;
  --bar:#393564; --bar-2:#4A4579; --bar-ink:#FFFFFF; --bar-muted:#BDB9DC; --bar-green:#7BCB66;
  --brand:#433E7A; --brand-ink:#FFFFFF; --brand-soft:#29264B; --brand-txt:#CFCBF5;
  --badge:#D93025; --badge-ink:#FFFFFF;
  --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#110F22; --surface:#1B1933; --surface-2:#252243; --ink:#ECEBF5; --muted:#A3A0C2; --line:#353259;
  --accent:#6CC456; --accent-ink:#0F0D22; --accent-line:#6CC456; --accent-soft:#1D3218;
  --ok:#7DD66A; --ok-bg:#17301A; --short:#FF7D70; --short-bg:#3A1A17; --warn:#F2C44F; --warn-bg:#352B10;
  --plate:#F2C200; --plate-ink:#0E0E0E; --plate-edge:#8A7000;
  --bar:#393564; --bar-2:#4A4579; --bar-ink:#FFFFFF; --bar-muted:#BDB9DC; --bar-green:#7BCB66;
  --brand:#433E7A; --brand-ink:#FFFFFF; --brand-soft:#29264B; --brand-txt:#CFCBF5;
  --badge:#D93025; --badge-ink:#FFFFFF;
  --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:640px;margin:0 auto;padding-block:10px}
.bar-row{display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:8px;flex:none;display:block;margin-block:-4px}
.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand-firm{font:700 .6rem/1 var(--f-body);letter-spacing:.13em;color:var(--bar-green)}
.brand-app{font:700 1.3rem/1 var(--f-display);letter-spacing:.04em;color:var(--bar-ink)}
.bar-acts{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}
.who{appearance:none;background:var(--bar-2);border:0;color:var(--bar-ink);font:500 .88rem/1.2 var(--f-body);padding:0 11px;height:38px;border-radius:8px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.topbtn{appearance:none;background:var(--bar-2);border:0;color:var(--bar-ink);height:38px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:600 .85rem/1 var(--f-body)}
.topbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbtn[aria-current="page"]{color:var(--accent)}
.back{appearance:none;border:0;background:var(--bar-2);color:var(--bar-ink);font:600 .95rem/1 var(--f-body);padding:11px 14px 11px 10px;border-radius:8px;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.bar-title{font-family:var(--f-display);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.05em;color:var(--bar-muted)}

/* Bottom section bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);border-top:1px solid var(--bar-2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:flex}
.nav-b{flex:1;min-width:0;appearance:none;border:0;background:none;color:var(--bar-muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;font:600 .74rem/1 var(--f-body);cursor:pointer;position:relative;white-space:nowrap}
.nav-b svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-b svg circle.w{fill:var(--bar)}
.nav-b[aria-current="page"]{color:var(--accent)}
.nav-b .n{position:absolute;top:3px;left:calc(50% + 7px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--badge);color:var(--badge-ink);font:600 .72rem/19px var(--f-mono);text-align:center}

/* Page */
.wrap{max-width:672px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 36px;display:flex;flex-direction:column;gap:18px}
.has-nav .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.wrap > *{min-width:0}
.muted{color:var(--muted)}
.center{text-align:center}
.eyebrow{font:600 .75rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt{font-weight:400;color:var(--muted)}
.lead{margin:0;color:var(--muted);max-width:60ch}
.hint{margin:0;font-size:.88rem;color:var(--muted)}
.warn-txt{color:var(--warn);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.row-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:10px}

/* Job cards */
.job{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.job-main{appearance:none;text-align:left;width:100%;border:0;background:none;color:var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;font:inherit}
.job:hover{border-color:var(--muted)}
.job-main > span{display:block;min-width:0}
.job-main > .job-top,.job-main > .meta{display:flex}
.job-main > .track{display:grid}
.job-foot{padding:0 14px 14px;display:flex;gap:8px}
.job-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-family:var(--f-mono);font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.site{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}
.addr{color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.93rem}
.crew-txt{min-width:0;overflow-wrap:anywhere;font-size:.93rem}
.you-ch{font-size:.9rem;font-weight:600;color:var(--warn)}
.warn-line{font-size:.9rem;font-weight:600;color:var(--short);overflow-wrap:anywhere}
.plate{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.2;letter-spacing:.07em;text-transform:uppercase;background:var(--plate);color:var(--plate-ink);padding:2px 9px;border-radius:4px;border:1px solid var(--plate-edge);white-space:nowrap}
.plate-s{font-size:.88rem;padding:1px 6px}
.load{display:inline-flex;align-items:center;gap:7px;font-size:.9rem;font-weight:600;white-space:nowrap}
.lm{display:inline-flex;gap:2px;align-items:center;padding:2px;border:1.5px solid currentColor;border-radius:3px}
.lm i{display:block;width:5px;height:10px;border-radius:1px;background:currentColor;opacity:.18}
.lm i.on{opacity:1}
.jtype{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:4px;padding:2px 6px;color:var(--muted);white-space:nowrap}

/* Status tags (scaff-tag shaped) */
.pill{display:inline-flex;align-items:center;gap:6px;font:700 .74rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;padding:6px 10px 6px 8px;border-radius:4px 12px 12px 4px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px currentColor;flex:none}
.p-toload{background:var(--surface-2);color:var(--muted)}
.p-loading{background:var(--warn-bg);color:var(--warn)}
.p-loaded{background:var(--ok-bg);color:var(--ok)}
.p-ready{background:var(--ok);color:var(--surface)}
.p-short{background:var(--short-bg);color:var(--short)}
.p-done{background:var(--ink);color:var(--surface)}
.p-new{background:var(--brand-soft);color:var(--brand-txt)}
.p-out{background:var(--brand-soft);color:var(--brand-txt)}
.when{font-size:.9rem;color:var(--ink)}
.when b{font-family:var(--f-mono);font-weight:600}
.job-main > .cthumbs{display:flex}
.cthumbs{gap:4px}
.demo-panel{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.demo-tape{height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--brand) 12px 24px)}
.demo-in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.demo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-tag,.demo-chip{background:var(--accent);color:var(--accent-ink);font:700 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:4px}
.demo-chip{margin-left:4px;flex:none}
.brand.is-demo .brand-txt{display:none}
.demo-hint{margin:0;font-size:.93rem;line-height:1.45}
.demo-start{padding-top:0;overflow:hidden}
.demo-start .demo-tape{margin:0 -14px}
.job-main > .card-pic{display:block;margin:-14px -14px 2px;aspect-ratio:16/7;max-width:calc(100% + 28px);overflow:hidden;background:var(--surface-2)}
.card-pic img,.site-pic img{width:100%;height:100%;object-fit:cover;display:block}
.card-pic.broken,.site-pic.broken{display:none!important}
.site-pic{border-radius:var(--r);overflow:hidden;background:var(--surface-2);aspect-ratio:16/9;max-width:100%}
.sdetails{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sd > span:first-child{font:700 .72rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sd b{font-size:1.02rem;overflow-wrap:anywhere}
.sd-code{background:var(--accent-soft);border-color:var(--accent-line)}
.sd-code b{font:600 1.25rem/1.25 var(--f-mono);letter-spacing:.02em}
.sd-phone{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xrow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.xmain{display:flex;flex-direction:column;gap:4px;min-width:0}
.xtext{margin:0;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.xmeta{font-size:.84rem;color:var(--muted);font-weight:400}
.xpic{width:84px;height:84px;flex:none}
.xacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.xform{padding:12px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.xlist{margin:2px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.cthumb{width:52px;height:52px;border-radius:6px;overflow:hidden;background:var(--surface-2);flex:none;display:grid;place-items:center;font:600 .8rem var(--f-mono);color:var(--muted)}
.cthumb img{width:100%;height:100%;object-fit:cover;display:block}
.cthumb.broken img,.thumb.broken img,.lb-img.broken img{display:none}
.cthumb.broken::after{content:"\2013"}
.photos{display:flex;flex-direction:column;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.thumb{appearance:none;aspect-ratio:1/1;max-width:100%;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:pointer;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.broken,.lb-img.broken{display:grid;place-items:center;color:var(--muted);font-size:.78rem;text-align:center;padding:6px}
.thumb.broken::after,.lb-img.broken::after{content:"Photo not available on this login"}
.photo-btns{display:flex;flex-wrap:wrap;gap:8px}
.photo-btns .btn{flex:1 1 150px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vh:focus-visible + .btn{outline:3px solid var(--accent-line);outline-offset:2px}
.panel.times-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.times{display:flex;flex-direction:column;gap:1px;min-width:0}
.times span{font:700 .74rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.times b{font:600 1.6rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.times small{font-size:.82rem;color:var(--muted)}
.span2{grid-column:1/-1}
.todo{padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.todo-chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .88rem/1 var(--f-body);min-height:38px;padding:0 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.todo-chip.hot{background:var(--brand-soft);border-color:var(--brand-txt);color:var(--brand-txt)}
.todo-chip b{font-weight:600;color:var(--muted)}
.done-all{flex-direction:row;align-items:center;color:var(--ok);font-weight:600}
.sub-h.hot{background:var(--brand);color:var(--brand-ink);box-shadow:inset 5px 0 0 var(--accent);padding-left:17px}
.sub-act{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub-h .mini{text-transform:none;letter-spacing:0;min-height:34px}
.tgrid{padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px}
.tk-chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem/1 var(--f-body);min-height:48px;min-width:64px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tk-chip svg{width:16px;height:16px}
.tk-chip small{font-size:.72rem;font-weight:500}
.tk-chip.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tk-chip.off{background:var(--short);border-color:var(--short);color:var(--surface)}
.tk-chip.flash{box-shadow:0 0 0 3px var(--accent)}
.tagx{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap;vertical-align:middle}
.tag-ok{color:var(--ok);border-color:var(--ok)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 12px}
.trow + .trow{border-top:1px solid var(--line)}
.trow-n{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.trow-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.item.flash{box-shadow:inset 0 0 0 3px var(--accent);background:var(--accent-soft)}
#lb[hidden]{display:none}
.lb{position:fixed;inset:0;z-index:30;background:var(--lb-bg);color:var(--lb-ink);display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-top,.lb-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lb-top span{font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}

/* Progress track: yard, charge hand, boss */
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tk{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;font-size:.8rem;font-weight:600;color:var(--muted)}
.tk i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font:700 .72rem/1 var(--f-body);font-style:normal}
.tk i svg{width:12px;height:12px}
.tk-l{min-width:0;display:flex;flex-direction:column}
.tk-l > span,.tk-l small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-l small{font-weight:500;font-size:.76rem;color:var(--muted)}
.tk-doing{color:var(--warn)} .tk-doing i{border-color:var(--warn);background:var(--warn-bg)}
.tk-done{color:var(--ok)} .tk-done i{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.tk-short{color:var(--short)} .tk-short i{border-color:var(--short);background:var(--short);color:var(--surface)}
.track-big{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.track-big .tk{font-size:.92rem;align-items:flex-start}
.track-big .tk i{width:22px;height:22px;margin-top:1px}
.track-big .tk-l > span,.track-big .tk-l small{white-space:normal;overflow-wrap:anywhere}

.prog{display:block;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog > span{display:block;height:100%;background:var(--accent)}
.prog-flat{border-radius:0;height:4px}

/* Buttons */
.btn{appearance:none;font:600 1rem/1.15 var(--f-body);padding:13px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn-danger{color:var(--short);border-color:var(--short)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.btn-big{min-height:54px;font-size:1.06rem}
.btn-left{align-self:flex-start}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:10px}
.mini{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .85rem/1 var(--f-body);padding:0 12px;min-height:40px;border-radius:8px;cursor:pointer;white-space:nowrap}
.mini-danger{color:var(--short)}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--accent-line);text-decoration-thickness:2px;text-underline-offset:3px}

/* Needs-you cards */
.need{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.need-t{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.need-sub{color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
.need-note{margin:0;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.95rem;overflow-wrap:anywhere}
.need-warn{margin:0;color:var(--short);font-weight:600;font-size:.92rem}
.need-acts{display:flex;gap:8px;margin-top:4px}
.need-acts .btn{flex:1}
.strip{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--r);padding:11px 14px;display:flex;flex-direction:column;gap:3px;font:inherit;cursor:pointer}
.strip-go{color:var(--muted);font-size:.85rem}

/* Job sheet */
.head{display:flex;flex-direction:column;gap:9px}
.h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:2.05rem;line-height:1.04;text-wrap:balance;overflow-wrap:anywhere}
.addr-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.addr-acts{display:flex;gap:12px;align-items:center}
.crew{display:flex;flex-wrap:wrap;gap:6px}
.person{background:var(--surface-2);padding:6px 11px;border-radius:999px;font-size:.92rem}
.person.ch{background:var(--accent);color:var(--accent-ink);font-weight:600}
.person.off{background:var(--short-bg);color:var(--short);font-weight:600}
.from{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.from p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.banner{border-radius:var(--r);padding:12px 14px;font-size:.96rem;line-height:1.4;overflow-wrap:anywhere}
.banner ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.with-act{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b-ok{background:var(--ok-bg);border:1px solid var(--ok)}
.b-short{background:var(--short-bg);border:1px solid var(--short)}
.b-warn{background:var(--warn-bg);border:1px solid var(--warn)}
.b-info{background:var(--surface-2);border:1px solid var(--line)}
.modes{display:flex;gap:6px}
.modes .seg{flex:1;justify-content:center}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.list-t{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase}
.sub-h{padding:9px 14px 6px;font:700 .74rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.pad{padding:14px;margin:0}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.sub-h + .item{border-top:0}
.item-main{min-width:0}
.item-name{font-weight:600;font-size:1.03rem;overflow-wrap:anywhere}
.item-need{font-size:.88rem;color:var(--muted)}
.item-need b{color:var(--ink)}
.item-st{font-weight:600}
.yh{color:var(--ink)}
.is-ok .item-st{color:var(--ok)}
.is-short .item-st{color:var(--short)}
.tick{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--line);display:grid;place-items:center;cursor:pointer;padding:0}
.is-ok .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.is-short .tick{background:var(--short);border-color:var(--short);color:var(--surface)}
.miss{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .85rem/1 var(--f-body);min-height:44px;padding:0 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.miss[aria-pressed="true"]{background:var(--short);border-color:var(--short);color:var(--surface)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.stepper button{width:40px;height:44px;border:0;background:var(--surface-2);color:var(--ink);font:600 1.35rem/1 var(--f-body);cursor:pointer;padding:0}
.stepper input{width:52px;height:44px;border:0;border-inline:1px solid var(--line);text-align:center;font:600 1.05rem var(--f-mono);background:var(--surface);color:var(--ink);-moz-appearance:textfield;appearance:textfield;padding:0;border-radius:0}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.item.ro{grid-template-columns:minmax(0,1fr) auto}
.marks{display:flex;gap:6px}
.mk{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:4px 6px;border-radius:6px;background:var(--surface-2);font-size:.7rem;color:var(--muted);line-height:1.2}
.mk b{font:600 1rem/1.2 var(--f-mono);color:var(--ink)}
.mk.is-ok{background:var(--ok-bg)} .mk.is-ok b{color:var(--ok)}
.mk.is-short{background:var(--short-bg)} .mk.is-short b{color:var(--short)}

.actions{position:sticky;bottom:0;z-index:4;background:var(--bg);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools .btn{flex:1 1 auto;min-height:44px;padding:10px 14px;font-size:.95rem}

/* Forms */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-weight:600;font-size:.95rem}
.input{font:500 1rem/1.3 var(--f-body);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:48px;min-width:0}
input[type="date"].input{display:block;-webkit-appearance:none;appearance:none}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.input-date{flex:1;max-width:230px}
select.input{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea.input{min-height:84px;resize:vertical}
.input::placeholder{color:var(--muted);opacity:.8}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
.form-h{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase;border-top:2px solid var(--ink);padding-top:12px}
.seg{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem/1 var(--f-body);padding:0 14px;min-height:44px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg-n{font:600 .78rem var(--f-mono);color:var(--muted)}
.seg[aria-pressed="true"] .seg-n{color:inherit}
.seg-del{color:var(--short);border-color:var(--short)}
.plate-seg{background:var(--plate);color:var(--plate-ink);border-color:var(--plate-edge);font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.07em;text-transform:uppercase}
.plate-seg[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink);border-color:var(--plate-ink);box-shadow:0 0 0 3px var(--ink)}
.tchip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem/1 var(--f-body);min-height:48px;min-width:62px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tchip svg{width:16px;height:16px}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-h{padding:9px 12px 6px;font:700 .74rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.sheet-h:first-child{border-top:0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px 6px 12px;min-height:56px;border-top:1px solid var(--line)}
.sheet-h + .crow{border-top:0}
.crow.has{background:var(--accent-soft)}
.crow.has .crow-n{font-weight:700}
.crow-n{overflow-wrap:anywhere}
.crow-r{display:flex;gap:6px;align-items:center}
.more-btn{appearance:none;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 .95rem/1.2 var(--f-body);padding:14px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px}
.pick + .pick{border-top:1px solid var(--line)}
.pick-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--ink);font:500 1rem/1.25 var(--f-body);text-align:left;cursor:pointer;min-height:44px;padding:0}
.pick-toggle[disabled]{cursor:not-allowed}
.pname{flex:1;min-width:0;overflow-wrap:anywhere}
.avail{display:block;font-size:.84rem;font-weight:600;margin-top:2px}
.a-off{color:var(--short)}
.a-ask{color:var(--warn)}
.a-busy{color:var(--muted);font-weight:500}
.box{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.box svg{width:18px;height:18px}
.on .box{background:var(--accent);border-color:var(--accent-line)}
.is-off .box{border-style:dashed;color:var(--short)}
.is-off .pname{color:var(--muted)}
.on.is-off .box{background:var(--short);border:2px solid var(--short);color:var(--surface)}
.on.is-off .pname{color:var(--ink)}
.ch-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .82rem/1 var(--f-body);padding:0 11px;min-height:38px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ch-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:0;flex:none}
.qgroup{display:flex;flex-direction:column;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.past{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.past-btn{flex:none;width:210px;scroll-snap-align:start;appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;font:inherit}
.past-site{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.1;overflow-wrap:anywhere}
.past-meta{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

/* Totals */
.tot{display:flex;flex-direction:column}
.tot-r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tot-r b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Days off lists */
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 14px}
.req + .req{border-top:1px solid var(--line)}
.req-t{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.req-sub{font-size:.88rem;color:var(--muted)}
.req-note{font-size:.9rem;margin-top:3px;overflow-wrap:anywhere}
.req-acts{grid-column:1/-1;display:flex;gap:8px}

/* Calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-t{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1}
.cal-nav{appearance:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.cal-nav.flip svg{transform:scaleX(-1)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd{font:600 .72rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:4px 0 6px}
.cd{appearance:none;position:relative;min-height:62px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 3px 4px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;font:inherit;text-align:left;overflow:hidden}
.cd.we{background:var(--surface-2)}
.cd.past:not(.sel){opacity:.6}
.cd-n{font:600 .88rem/1.25 var(--f-mono);padding:0 3px;border-radius:4px}
.cd.today .cd-n{background:var(--accent);color:var(--accent-ink)}
.cd.sel{border:2px solid var(--ink);padding:3px 2px 3px 3px}
.cd-off{font:700 .68rem/1.1 var(--f-body);color:var(--short);white-space:nowrap}
.cd-jobs{font:600 .68rem/1.1 var(--f-body);color:var(--muted);white-space:nowrap}
.cd-ask{position:absolute;top:5px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:0}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.d-row{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line)}
.d-k{font:700 .74rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.d-v{overflow-wrap:anywhere}
.d-job{appearance:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:12px 14px;cursor:pointer;min-height:48px}
.d-site{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.d-job .plate,.d-job .pill{flex:none}
.d-foot{padding:12px 14px;border-top:1px solid var(--line)}

/* Empty and misc */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0}
.empty-t{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.35rem}
.example{opacity:.8}
.example .job-main{cursor:default}
.notice{display:flex;flex-direction:column;gap:12px;padding-block:20px}
.notice p{margin:0}
.name-card{background:var(--surface);border:2px solid var(--accent-line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.howto{display:flex;flex-direction:column;gap:8px}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sk{height:118px;border-radius:var(--r);background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:10px;font-weight:500;width:max-content;max-width:calc(100% - 32px);z-index:20;box-shadow:0 8px 24px var(--shadow);text-align:center}
.has-nav .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

@media (max-width:420px){
  .h1{font-size:1.8rem}
  .brand{gap:8px}.brand-logo{width:36px;height:36px}
  .brand-app{font-size:1.15rem}.brand-firm{font-size:.56rem;letter-spacing:.1em}
}
@media (max-width:360px){
  .item:not(.ro){grid-template-columns:44px minmax(0,1fr)}
  .item:not(.ro) .stepper,.item:not(.ro) .miss{grid-column:2;justify-self:start}
  .crow{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .tick,.tchip,.seg,.btn,.job,.cd,.crow{transition:background-color .15s,border-color .15s,color .15s}
  .sk{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
}
/* ---------- Polish layer: headers, tiles, icons, steps, motion ---------- */
:root{--accent-glow:rgba(103,188,81,.24);--press:.97}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{box-shadow:0 1px 0 var(--bar-2)}
.bar-off{padding-block:0 10px}
.in-sheet .toast{bottom:auto;top:calc(74px + env(safe-area-inset-top,0px))}
.when b{font-family:var(--f-mono)}
.page-h{display:flex;flex-direction:column;gap:3px;padding-top:2px}
.page-t{margin:0;font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1;letter-spacing:.01em}
.page-d{font:600 .78rem/1.2 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 9px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font:700 1.85rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font:700 .66rem/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile.hot{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.tile.hot span{color:var(--accent-ink)}
.tile.bad b{color:var(--short)}
.job{transition:border-color .15s,box-shadow .15s}
.job:hover{box-shadow:0 2px 12px var(--shadow)}
.job-main > .crew-txt,.job-main > .when,.job-main > .warn-line{display:flex;align-items:flex-start;gap:7px}
.job-main > .crew-txt{color:var(--muted)}
.crew-txt .ic,.when .ic,.warn-line .ic{margin-top:2px}
.tk{position:relative}
.tk:not(:last-child)::after{content:"";position:absolute;top:8px;left:24px;right:-4px;height:2px;border-radius:1px;background:var(--line)}
.tk-done:not(:last-child)::after{background:var(--ok)}
.track-big .tk:not(:last-child)::after{top:10px;left:30px}
.tk i{background:var(--surface);position:relative;z-index:1}
.tk-done i{background:var(--ok)}.tk-short i{background:var(--short)}.tk-doing i{background:var(--warn-bg)}
.nav-ic{display:grid;place-items:center;width:54px;height:30px;border-radius:15px}
.nav-b[aria-current="page"] .nav-ic{background:var(--accent-glow)}
.nav-b .n{top:1px;left:calc(50% + 12px)}
.actions{box-shadow:0 -10px 20px -14px var(--shadow)}
@supports ((-webkit-backdrop-filter:blur(8px)) or (backdrop-filter:blur(8px))) and (background:color-mix(in srgb,red 50%,blue)){
  .actions{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
}
.toast{display:flex;align-items:center;gap:14px;text-align:left;border-radius:12px;padding:12px 12px 12px 16px}
.toast-btn{appearance:none;border:0;background:transparent;color:var(--accent);font:700 .9rem/1 var(--f-body);padding:8px 6px;cursor:pointer;flex:none;text-transform:uppercase;letter-spacing:.08em}
.wrap{counter-reset:fstep}
.form-h{counter-increment:fstep;display:flex;align-items:center;gap:10px}
.form-h::before{content:counter(fstep);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 .95rem/1 var(--f-body);flex:none}
.send-sum{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.88rem;color:var(--muted)}
.send-sum b{color:var(--ink)}
.fbox{appearance:none;width:48px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;padding:0;margin-right:2px}
.fbox[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-line)}
.fbox svg{width:22px;height:22px}
.sum-row{appearance:none;width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink);font:inherit;cursor:pointer}
.sum-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok-bg);color:var(--ok)}
.sum-ic.bad{background:var(--short-bg);color:var(--short)}
.sum-ic svg{width:20px;height:20px}
.sum-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sum-t{font-weight:700}
.sum-s{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.sum-row > .ic{color:var(--muted)}
.fold-btn{align-self:flex-start}
.offline{background:var(--warn);color:var(--surface);font:600 .85rem/1.35 var(--f-body);padding:8px 12px;border-radius:8px}
.skc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.skl{height:12px;border-radius:6px;background:var(--surface-2)}
.skl.w60{width:60%}.skl.w40{width:40%}.skl.big{height:22px;width:75%}
.btn .ic{width:20px;height:20px}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){
  .wrap.enter{animation:enter .22s cubic-bezier(.2,.7,.2,1)}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .toast.show{animation:toastin .24s cubic-bezier(.2,.7,.2,1)}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  .item.pop .tick,.tk-chip.pop{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
  .skl{background:linear-gradient(90deg,var(--surface-2) 0%,var(--line) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  .nav-ic{transition:background-color .2s}
  .btn,.seg,.tchip,.tk-chip,.tick,.mini,.past-btn,.chip,.todo-chip,.ch-btn,.sum-row,.cd,.thumb,.nav-b,.miss{transition:transform .08s ease,background-color .15s,border-color .15s,color .15s}
  .btn:active:not([disabled]),.seg:active,.tchip:active,.tk-chip:active,.tick:active,.mini:active,.past-btn:active,.chip:active,.todo-chip:active,.ch-btn:active,.sum-row:active,.cd:active,.thumb:active,.nav-b:active,.miss:active{transform:scale(var(--press))}
  .job:active{transform:scale(.99)}
}
/* Address finder, gang picker, vehicles */
.pc-row .pc-in{text-transform:uppercase;font-family:var(--f-mono);font-weight:600;letter-spacing:.04em}
.pc-row .pc-in::placeholder{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500}
.pc-row .btn{flex:none;min-width:84px}
.addr-list{display:flex;flex-direction:column;max-height:292px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.addr-pick{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:500 1rem/1.3 var(--f-body);color:var(--ink);padding:12px 14px;min-height:48px;cursor:pointer}
.addr-pick:last-child{border-bottom:0}
.addr-pick:active{background:var(--accent-soft)}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:0 6px 18px -10px var(--shadow)}
.sugg:empty{display:none}
.sugg-i{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:10px 14px;min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;color:var(--ink);font:500 1rem/1.3 var(--f-body)}
.sugg-i:last-child{border-bottom:0}
.sugg-i:active{background:var(--accent-soft)}
.sugg-i small{font-size:.85rem;color:var(--muted)}
.sugg-note{margin:0;padding:10px 14px;font-size:.88rem;color:var(--muted)}
.gang-chip{gap:8px}
.gang-chip span{font-size:1.15rem;line-height:1;color:var(--muted)}
.gang-chip.is-off{border-color:var(--short);color:var(--short)}
.warns{display:flex;flex-direction:column;gap:2px}
.van-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
@media (max-width:420px){.van-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.van-add .btn{grid-column:1/-1}}
.van-n{font:600 .92rem/1.2 var(--f-body);color:var(--muted)}
.trow-n .van-n{margin-left:4px}
/* Property check */
.prop-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prop{gap:12px}
.plan-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.plan{display:block;width:100%;height:auto;aspect-ratio:1/0.95}
.plan-cap{margin:0;padding:7px 12px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}
.pl-road{fill:none;stroke:var(--surface-2);stroke-linecap:round;stroke-linejoin:round}
.pl-path{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.pl-nb{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.pl-sm{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
.pl-house{fill:var(--brand-soft);stroke:var(--brand-txt);stroke-width:2;stroke-linejoin:round}
.pl-pick{fill:var(--brand-soft);stroke:var(--brand-txt);stroke-width:1.5;stroke-linejoin:round;cursor:pointer}
.pl-pick:active,.pl-pick:focus-visible{fill:var(--accent);outline:none}
.pl-num{pointer-events:none}
.plan-pick{touch-action:manipulation;aspect-ratio:1/1.05}
.pl-tree{fill:var(--ok-bg);stroke:var(--ok);stroke-width:1.2}
.pl-power{fill:none;stroke:var(--short);stroke-width:2;stroke-dasharray:6 4}
.pl-gap{stroke:var(--warn);stroke-width:2}
.pl-t{fill:var(--ink);font-family:var(--f-body);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.pl-gt{fill:var(--warn)}
.pl-r{fill:var(--muted);font-family:var(--f-body);font-weight:600;letter-spacing:.02em}
.pl-scale line,.pl-north line{stroke:var(--ink);stroke-width:1.5}
.pl-north circle{fill:var(--surface);stroke:var(--line);stroke-width:1}
.pl-na{fill:var(--ink)}
.pl-north .pl-nl{display:none}
.pl-scale text,.pl-north text{fill:var(--ink);font-family:var(--f-body);font-weight:700}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:.95rem}
.facts dt{font:700 .72rem/1.5 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts dd{margin:0}
.pflags{display:flex;flex-direction:column;gap:6px}
.pflag{margin:0;padding:9px 12px;border-radius:8px;font-size:.92rem;line-height:1.4;border-left:4px solid}
.pf-warn{background:var(--warn-bg);border-color:var(--warn)}
.pf-short{background:var(--short-bg);border-color:var(--short)}
.pf-info{background:var(--surface-2);border-color:var(--brand-txt)}
.papps{display:flex;flex-direction:column;gap:6px}
.papp{margin:0;display:flex;flex-direction:column;gap:1px;font-size:.93rem}
.papp span{font-size:.82rem;color:var(--muted)}
.plinks{display:flex;flex-wrap:wrap;gap:8px 16px}
.mk-bm[aria-pressed="true"],.mk-ro .mk-bm{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mk-ro{gap:6px}
.prop-fold > summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px;position:relative}
.prop-fold > summary::-webkit-details-marker{display:none}
.prop-fold > summary::after{content:"Show";position:absolute;right:14px;top:13px;font:700 .75rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prop-fold[open] > summary::after{content:"Hide"}
.pf-sum{font-size:.9rem;color:var(--muted);padding-right:44px}
.prop-fold .prop{display:flex;flex-direction:column;padding-top:0}
/* Opening screen: the firm's logo while the loads come in */
#splash{position:fixed;inset:0;z-index:100;background:#393564;display:grid;place-items:center;padding:24px;transition:opacity .4s ease,visibility 0s linear .4s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.sp-in img{width:176px;height:176px;display:block;margin-bottom:10px}
.sp-firm{font:700 .82rem/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#7BCB66}
.sp-app{font:700 2.3rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:#FFFFFF}
.sp-bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:22px}
.sp-bar i{display:block;width:40%;height:100%;border-radius:2px;background:#67BC51}
@media (prefers-reduced-motion:no-preference){
  .sp-bar i{animation:spbar 1.1s ease-in-out infinite}
  @keyframes spbar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
html,body{margin:0}
[hidden]{display:none!important}
[data-act="demoexit"],.bar-off{display:none!important}
</style>
</head>

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rid(){return 'i'+Math.random().toString(36).slice(2,9);}
function pad2(n){return String(n).padStart(2,'0');}
function dayKey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}

function parseD(s){var p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1,12);}

function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function fmtShort(s){var d=parseD(s);if(!s||isNaN(d))return s||'';return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function fmtDate(s){
  if(!s) return 'No date';
  if(s===todayStr(0)) return 'Today';
  if(s===todayStr(1)) return 'Tomorrow';
  if(s===todayStr(-1)) return 'Yesterday';
  return fmtShort(s);
}
function fmtRange(a,b){
  if(!b||a===b) return fmtShort(a);
  var da=parseD(a), db=parseD(b);
  if(da.getFullYear()===db.getFullYear()&&da.getMonth()===db.getMonth()) return da.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})+' – '+fmtShort(b);
  return fmtShort(a)+' – '+fmtShort(b);
}
function fmtClock(ms){if(!ms)return '';return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtTime(ms){if(!ms)return '';var d=new Date(ms);return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+(dayKey(d)===todayStr(0)?'':' '+d.toLocaleDateString('en-GB',{weekday:'short'}));}
function fmtWhen(ms){
  if(!ms) return '';
  var d=new Date(ms), t=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return dayKey(d)===todayStr(0) ? t+' today' : t+' on '+d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function pct(a,b){return b?Math.round(100*a/b):0;}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function byDate(a,b){return (a.date||'9999-99-99').localeCompare(b.date||'9999-99-99')||(a.site||'').localeCompare(b.site||'');}

/* ---------- items ---------- */
function normItems(job){
  var out=(job.items||[]).map(function(it){var o=Object.assign({kind:'count'},it);if(o.kind==='tick')o.qty=null;return o;}), have={};
  out.forEach(function(it){have[it.id]=1;});
  FIXED.forEach(function(x){if(!have[x[0]])out.push({id:x[0],kind:'tick',name:x[1],qty:null});});
  return out;
}
function splitItems(items,keepIds){
  var ticks={},counts={},extra=[];
  (items||[]).forEach(function(it){
    var c=CAT[it.id];
    if(c&&c.kind==='tick') ticks[it.id]=true;
    else if(c&&c.kind==='count'&&it.kind!=='tick') counts[it.id]=String(it.qty||'');
    else extra.push({id:keepIds?it.id:rid(),name:it.name,qty:it.qty==null?'':String(it.qty)});
  });
  return {ticks:ticks,counts:counts,extra:extra};
}
function buildItems(f){
  var items=[];
  TICKS.forEach(function(g){g.items.forEach(function(x){if(f.ticks[x[0]])items.push({id:x[0],kind:'tick',name:x[2],qty:null});});});
  COUNTS.concat([MORE]).forEach(function(g){g.items.forEach(function(x){if(CAT[x[0]].kind==='tick'){if(f.ticks[x[0]])items.push({id:x[0],kind:'tick',name:x[1],qty:null});return;}var q=parseInt(f.counts[x[0]],10);if(q>0)items.push({id:x[0],kind:'count',name:x[1],qty:q});});});
  f.extra.forEach(function(e){var n=String(e.name||'').trim(),q=parseInt(e.qty,10);if(n&&q>0)items.push({id:e.id,kind:'count',name:n,qty:q});});

}

function chkOf(stage,jobId){
  var base=stageStore(stage).get(jobId)||{}, k=ckey(stage,jobId);
  var out=Object.assign({},base,{items:Object.assign({},base.items||{}),safety:Object.assign({},base.safety||{})});

    if(!l) return; Object.assign(out.items,l.items); Object.assign(out.safety,l.safety); Object.assign(out,l.fields);
  });
  return out;
}
function valOf(c,it){
  var v=c.items?c.items[it.id]:undefined;
  if(v===undefined||v===null||v==='') return null;
  if(it.kind==='tick') return v===true?true:(v===false?false:null);
  return Number(v);
}
function isShort(it,v){return v!=null&&(it.kind==='tick'?v===false:v<it.qty);}
function itemState(it,v){
  if(v==null) return {cls:'',txt:'Not checked'};
  if(it.kind==='tick') return v?{cls:'is-ok',txt:'On'}:{cls:'is-short',txt:'Not on'};
  if(v<it.qty) return {cls:'is-short',txt:(it.qty-v)+' short'};
  if(v>it.qty) return {cls:'is-ok',txt:'All on, '+(v-it.qty)+' spare'};
  return {cls:'is-ok',txt:'All on'};
}
function stageTally(job,stage,items){
  var c=chkOf(stage,job.__id), checked=0, short=0;
  items.forEach(function(it){var v=valOf(c,it);if(v!=null){checked++;if(isShort(it,v))short++;}});
  var safe=stage==='crew'?SAFETY.filter(function(s){return c.safety&&c.safety[s[0]];}).length:0;
  return {c:c,items:items,checked:checked,short:short,total:items.length,confirmed:!!c.confirmed,safe:safe};
}
function photoList(jobId){
  var d=S.photos.get(jobId); if(!d||!d.photos) return [];
  return Object.keys(d.photos).map(function(k){return Object.assign({id:k},d.photos[k]);}).filter(function(p){return !p.removed;}).sort(function(a,b){return (a.at||0)-(b.at||0);});
}
function photoSrc(id){return DEMO_URLS[id]||('/_blob/'+id);}
function tally(job){
  var items=normItems(job), y=stageTally(job,'yard',items), c=stageTally(job,'crew',items), st;
  var ph=photoList(job.__id).length, leftAt=c.c.leftAt||null, finAt=c.c.finishedAt||null;
  if(job.status==='done') st='done';
  else if(finAt) st='finished';
  else if(leftAt) st='out';
  else if(c.confirmed) st=c.short?'short':'ready';
  else if(c.checked||c.safe) st='checking';
  else if(y.confirmed) st=y.short?'yshort':'loaded';
  else if(y.checked) st='loading';
  else st='toload';
  return {y:y,c:c,st:st,items:items,photos:ph,leftAt:leftAt,finAt:finAt};
}
function shortList(st){
  return st.items.filter(function(it){return isShort(it,valOf(st.c,it));}).map(function(it){
    return it.kind==='tick'?it.name+' not on':(it.qty-valOf(st.c,it))+' × '+it.name;
  });
}
function pillHtml(t){
  var m={toload:['p-toload','To load'],loading:['p-loading','Loading '+t.y.checked+'/'+t.y.total],loaded:['p-loaded','Loaded'],yshort:['p-short','Loaded, '+t.y.short+' short'],
    checking:['p-loading','Checking '+t.c.checked+'/'+t.c.total],ready:['p-ready','Ready to go'],short:['p-short',t.c.short+' short'],
    out:['p-out','Left yard '+fmtClock(t.leftAt)],finished:['p-ready','Finished'],done:['p-done','Done']}[t.st];
  return '<span class="pill '+m[0]+'">'+esc(m[1])+'</span>';
}
function trackHtml(job,t,big){
  var y=t.y,c=t.c;
  var ys=y.confirmed?(y.short?'short':'done'):(y.checked?'doing':'todo');
  var cs=c.confirmed?(c.short?'short':'done'):((c.checked||c.safe)?'doing':'todo');
  var ps=t.finAt?'done':(t.photos?'doing':'todo');
  var bs=job.status==='done'?'done':'todo';
  var steps=[['Yard',ys,y.confirmed?nameOf(y.c.confirmedBy)+' '+fmtTime(y.c.confirmedAt):(y.checked?'Loading':'')],
             ['Checked',cs,c.confirmed?nameOf(c.c.confirmedBy)+' '+fmtTime(c.c.confirmedAt)+(t.leftAt?', left '+fmtClock(t.leftAt):''):((c.checked||c.safe)?'Checking':'')],
             ['Photos',ps,t.photos?plural(t.photos,'photo'):''],
             [bossCrew()?BN():'Boss',bs,bs==='done'?nameOf(job.doneBy)+' '+fmtTime(job.doneAt):'']];
  var lab={todo:'not started',doing:'in progress',done:'done',short:'done, items short'};
  return '<span class="track'+(big?' track-big':'')+'" role="img" aria-label="'+esc(steps.map(function(s){return s[0]+' '+lab[s[1]];}).join(', '))+'">'+steps.map(function(s){
    return '<span class="tk tk-'+s[1]+'"><i aria-hidden="true">'+(s[1]==='done'?TICK:(s[1]==='short'?'!':''))+'</i><span class="tk-l"><span>'+s[0]+'</span>'+(big&&s[2]?'<small>'+esc(s[2])+'</small>':'')+'</span></span>';
  }).join('')+'</span>';
}
function needs(){
  var t=todayStr(0), pend=[], notes=[], clash=[], ready=[], ysh=[];
  S.daysoff.forEach(function(r){
    if(r.status==='pending'){ if(r.to>=t) pend.push(r); }
    else if(r.seen===false&&(r.status==='approved'||r.status==='cancelled')) notes.push(r);
  });
  S.jobs.forEach(function(j){
    var tt=tally(j);
    if(tt.st==='finished') ready.push(j);
    if(j.status!=='done'&&tt.y.confirmed&&tt.y.short&&!tt.c.confirmed&&j.yshortSeen!==(tt.y.c.confirmedAt||1)) ysh.push(j);
    if(j.status!=='done'&&j.date&&j.date>=t) jobClashes(j).forEach(function(p){clash.push({job:j,person:p});});
  });
  pend.sort(byFrom); ysh.sort(byDate);
  notes.sort(function(a,b){return (b.requestedAt||b.cancelledAt||0)-(a.requestedAt||a.cancelledAt||0);});
  clash.sort(function(a,b){return byDate(a.job,b.job);});
  ready.sort(byDate);
  var xtra=[];
  S.jobs.forEach(function(j){var u=extraList(j.__id).filter(function(x){return !x.billed;});if(u.length)xtra.push({job:j,items:u});});
  xtra.sort(function(a,b){return byDate(a.job,b.job);});
  var acts=pend.length+notes.length+clash.length+ysh.length+xtra.length;
  return {pend:pend,notes:notes,clash:clash,ready:ready,ysh:ysh,xtra:xtra,acts:acts,count:acts+ready.length};
}

/* ---------- writes ---------- */
function queueCheck(stage,jobId,patch){
  var k=ckey(stage,jobId), p=S.pending.get(k)||{items:{},safety:{},fields:{}};
  if(patch.items) Object.assign(p.items,patch.items);
  if(patch.safety) Object.assign(p.safety,patch.safety);
  if(patch.fields) Object.assign(p.fields,patch.fields);
  S.pending.set(k,p);
  clearTimeout(S.timers[k]);
  S.timers[k]=setTimeout(function(){flushCheck(k);},700);
}
async function flushCheck(k){
  clearTimeout(S.timers[k]);
  if(S.writing[k]) return;
  var p=S.pending.get(k); if(!p||!S.db) return;
  var parts=k.split('|'), stage=parts[0], jobId=parts[1];
  S.pending.delete(k); S.inflight.set(k,p); S.writing[k]=true;
  var ref=S.db.doc(cpath(stage,jobId)), failed=null;
  var body=Object.assign({},p.fields,{updatedBy:S.me,updatedAt:Date.now()});
  if(Object.keys(p.items).length) body.items=p.items;
  if(Object.keys(p.safety).length) body.safety=p.safety;
  try{
    var snap=await ref.get();
    if(snap.exists) await ref.update(body);
    else await ref.set(Object.assign({items:{},safety:{},confirmed:false,note:''},body,{items:Object.assign({},p.items),safety:Object.assign({},p.safety)}));
    S.retries[k]=0;
  }catch(e){failed=e;}
  S.writing[k]=false; S.inflight.delete(k);
  if(failed){
    if(failed.code==='invalid_argument'){
      S.readOnly=true; toast("You can't tick this load. Ask whoever set up the app to give you edit access.");
    }else{
      var newer=S.pending.get(k)||{items:{},safety:{},fields:{}};
      S.pending.set(k,{items:Object.assign({},p.items,newer.items),safety:Object.assign({},p.safety,newer.safety),fields:Object.assign({},p.fields,newer.fields)});
      var n=(S.retries[k]||0)+1; S.retries[k]=n;
      if(navigator.onLine===false){ S.offline=true; S.retries[k]=0; }
      else if(failed.code==='unavailable'&&n<=3){ S.timers[k]=setTimeout(function(){flushCheck(k);},2000*n); }
      else toast('Not saved yet. Check your signal, then tap the item again.');
    }
  }else if(S.pending.has(k)){ flushCheck(k); }
  render();
}
function flushAll(){S.pending.forEach(function(_,k){flushCheck(k);});}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden') flushAll();});
window.addEventListener('offline',function(){S.offline=true;render();});
window.addEventListener('online',function(){S.offline=false;flushAll();render();});
S.offline=navigator.onLine===false;

function setVal(stage,itemId,v,full){
  var o={}; o[itemId]=v;
  queueCheck(stage,S.jobId,{items:o});
  if(full){S.pop='row-'+stage+'-'+itemId;render(true);} else updateRow(stage,itemId);
}
function updateRow(stage,itemId){
  var job=S.jobs.get(S.jobId); if(!job) return;
  var t=tally(job), st=stage==='yard'?t.y:t.c;
  var it=t.items.filter(function(x){return x.id===itemId;})[0]; if(!it) return;
  var s=itemState(it,valOf(st.c,it));
  var row=document.getElementById('row-'+stage+'-'+itemId);
  if(row){
    row.className='item '+s.cls;
    var e=row.querySelector('.item-st'); if(e) e.textContent=s.txt;
    var tk=row.querySelector('.tick'); if(tk) tk.innerHTML=s.cls==='is-short'?MINUS:TICK;
  }
  var cc=document.getElementById('chk-count'); if(cc) cc.textContent=st.checked+' of '+st.total+' checked';
  var bar=document.getElementById('chk-bar'); if(bar) bar.style.width=pct(st.checked,st.total)+'%';
  S.deferred=true;
}
async function upd(path,patch,msg,undoPatch){
  if(S.busy||!S.db) return; S.busy=true; var db=S.db;
  try{
    await db.doc(path).update(patch);
    if(msg) toast(msg,undoPatch?function(){db.doc(path).update(undoPatch).then(function(){toast('Undone');render(true);},function(e){toast(errMsg(e));});}:null);
  }catch(e){toast(errMsg(e));}
  S.busy=false; render(true);
}

function chCta(t){

function byDay(jobs){
  var t=todayStr(0), tm=todayStr(1), g={earlier:[],today:[],tomorrow:[],later:[]};
  jobs.slice().sort(byDate).forEach(function(j){
    if(!j.date||j.date>tm) g.later.push(j); else if(j.date===tm) g.tomorrow.push(j); else if(j.date===t) g.today.push(j); else g.earlier.push(j);
  });
  return g;
}
function daySecs(jobs,opts){
  var g=byDay(jobs);
  var tl=g.today.filter(function(j){return tally(j).leftAt;}).length;
  var th=g.today.length?tl+' of '+plural(g.today.length,'van')+' left the yard.':'';
  return sec('Earlier, not finished',g.earlier,'',opts)+sec('Today',g.today,th,opts)+sec('Tomorrow',g.tomorrow,'',opts)+sec('Later',g.later,'',opts);
}
