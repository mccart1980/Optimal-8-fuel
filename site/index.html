<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCS Load Check</title>
<meta name="apple-mobile-web-app-title" content="Load Check">
<meta name="application-name" content="FCS Load Check">
<meta name="theme-color" content="#2E2A5A">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --card:#FFFFFF; --ink:#17172B; --ink2:#575B70; --ink3:#868BA0; --line:#E2E4EC; --field:#FFFFFF;
  --bar:#2E2A5A; --brand:#2E2A5A; --brand2:#413C7A; --on-brand:#FFFFFF; --brand-soft:#ECEBF7; --brand-ink:#2E2A5A;
  --go:#2E8B2B; --on-go:#FFFFFF; --go-soft:#E5F4E3; --go-ink:#1F6B1D;
  --warn:#9A5B00; --warn-soft:#FFF2D9; --bad:#C0271F; --bad-soft:#FDE9E7; --on-bad:#FFFFFF;
  --plate:#F7C800; --plate-ink:#111;
  --shadow:0 1px 2px rgba(23,23,43,.06),0 4px 14px rgba(23,23,43,.06);
  --r:14px; --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E1A; --card:#191929; --ink:#F2F2F7; --ink2:#B5B7C9; --ink3:#8789A0; --line:#2A2A42; --field:#12121F;
  --bar:#1F1D40; --brand:#514BB0; --brand2:#6F69D0; --on-brand:#FFFFFF; --brand-soft:#252447; --brand-ink:#CFCBF7;
  --go:#4FB847; --on-go:#0B1F0A; --go-soft:#16301A; --go-ink:#8BDD84;
  --warn:#F0BE55; --warn-soft:#33290F; --bad:#FF7B70; --bad-soft:#3A1917; --on-bad:#1F0907;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0E1A; --card:#191929; --ink:#F2F2F7; --ink2:#B5B7C9; --ink3:#8789A0; --line:#2A2A42; --field:#12121F;
  --bar:#1F1D40; --brand:#514BB0; --brand2:#6F69D0; --on-brand:#FFFFFF; --brand-soft:#252447; --brand-ink:#CFCBF7;
  --go:#4FB847; --on-go:#0B1F0A; --go-soft:#16301A; --go-ink:#8BDD84;
  --warn:#F0BE55; --warn-soft:#33290F; --bad:#FF7B70; --bad-soft:#3A1917; --on-bad:#1F0907;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}

/* frame */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--on-brand);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:600px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.bar-logo{width:36px;height:36px;border-radius:9px;flex:none;display:block}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.bar-t small{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t b{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-back{appearance:none;border:0;background:rgba(255,255,255,.12);color:inherit;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.who{appearance:none;border:0;background:rgba(255,255,255,.12);color:inherit;height:40px;padding:0 10px 0 5px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;flex:none;max-width:46%}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.plain{background:none;padding:0}
.av{width:30px;height:30px;border-radius:50%;background:#fff;color:#2E2A5A;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none;letter-spacing:.02em}
.upd{appearance:none;border:0;display:block;width:100%;background:var(--go);color:var(--on-go);font-weight:700;padding:11px 16px;text-align:center}
main{max-width:600px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
main.has-foot{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:flex}
.tab{appearance:none;border:0;background:none;flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:.72rem;font-weight:600;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:36px;height:3px;margin-left:-18px;border-radius:0 0 3px 3px;background:var(--go)}
.badge{position:absolute;top:8px;left:50%;margin-left:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:.68rem;font-weight:700;display:grid;place-items:center}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot-in{max-width:568px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:.84rem;color:var(--ink2);text-align:center}

/* type */
.h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--ink2);font-size:.95rem}
.lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* cards and rows */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px}
.li:first-child{border-top:0}
.li-t{flex:1;min-width:0;display:flex;flex-direction:column}
.li-t b{font-weight:600}
.li-t small{color:var(--ink2);font-size:.84rem}
.empty{text-align:center;padding:34px 20px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty svg{width:40px;height:40px;color:var(--ink3);margin-bottom:4px}
.empty b{color:var(--ink);font-size:1.05rem}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;min-height:52px;padding:0 18px;font-weight:700;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--brand);color:var(--on-brand);width:100%;transition:transform .08s ease,opacity .15s ease}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;flex:none}
.btn.go{background:var(--go);color:var(--on-go)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:.92rem;padding:0 14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.bad{color:var(--bad)}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-toload{background:var(--warn-soft);color:var(--warn)}
.p-loaded{background:var(--brand-soft);color:var(--brand-ink)}
.p-checked{background:var(--go-soft);color:var(--go-ink)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-weight:700;font-size:.86rem;letter-spacing:.06em;padding:3px 8px;border-radius:5px;line-height:1.2}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;background:var(--bg);color:var(--ink2);font-size:.78rem;font-weight:600}

/* job cards */
.job{appearance:none;border:0;text-align:left;width:100%;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.job:active{transform:scale(.992)}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job-a{font-weight:700;font-size:1.05rem;line-height:1.3;letter-spacing:-.01em}
.job-m{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;color:var(--ink2);font-size:.9rem}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--go)}
.steps i.bad{background:var(--bad)}
.need{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--warn)}
.need.bad{border-left-color:var(--bad)}
.need b{font-weight:700}

/* job page */
.hero{display:flex;flex-direction:column;gap:12px}
.hero-a{font-size:1.35rem;font-weight:700;line-height:1.25;letter-spacing:-.015em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:.95rem;align-items:center}
.kv dt{color:var(--ink3);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kv dd{margin:0}
.track{display:flex;flex-direction:column;gap:0}
.tr{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tr:last-child{padding-bottom:0}
.tr::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tr:last-child::before{display:none}
.tr-d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;color:transparent;z-index:1}
.tr-d svg{width:14px;height:14px}
.tr.on .tr-d{background:var(--go);border-color:var(--go);color:var(--on-go)}
.tr.bad .tr-d{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.tr.on::before{background:var(--go)}
.tr-t{display:flex;flex-direction:column;line-height:1.3;padding-top:1px}
.tr-t b{font-weight:600}
.tr-t small{color:var(--ink2);font-size:.86rem}
.note{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.note b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:3px}
.warnbox{background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.warnbox b{color:var(--bad)}

/* load sheet */
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.sh-g{padding:10px 16px 6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-g:first-of-type{border-top:0}
.ck{appearance:none;border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:11px 16px;min-height:54px;border-top:1px solid var(--line)}
.sh-g + .ck{border-top:0}
.ck-b{width:28px;height:28px;border-radius:9px;border:2px solid var(--ink3);flex:none;display:grid;place-items:center;color:transparent}
.ck-b svg{width:17px;height:17px}
.ck-n{flex:1;min-width:0;font-weight:500}
.ck-q{font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:3px 9px;font-size:.95rem}
.ck.ok .ck-b{background:var(--go);border-color:var(--go);color:var(--on-go)}
.ck.no .ck-b{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.ck.no .ck-n{color:var(--bad)}
.ck-s{font-size:.74rem;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.ck.ro{pointer-events:none}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--go);border-radius:3px;transition:width .2s ease}
.tip{font-size:.84rem;color:var(--ink2);padding:0 16px 12px}

/* forms */
.fld{display:flex;flex-direction:column;gap:7px}
.fld > label,.fld > .fl{font-size:.9rem;font-weight:600}
.in{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);padding:0 14px;font-size:1rem}
textarea.in{padding:12px 14px;min-height:84px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.in:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
.in.pc{text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.in.pc::placeholder{text-transform:none;font-weight:400;letter-spacing:0}
.rowf{display:flex;gap:10px}
.rowf .in{flex:1;min-width:0}
.rowf .btn{width:auto;flex:none;min-height:50px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;flex:1;min-height:42px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:.95rem;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip .x{opacity:.6;font-size:1.1rem;line-height:1}
.hint{font-size:.86rem;color:var(--ink2)}
.err{font-size:.9rem;color:var(--bad);font-weight:600}
.addr-list{border:1.5px solid var(--line);border-radius:12px;max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--field)}
.addr-list button{appearance:none;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:12px 14px;min-height:48px;font-weight:500}
.addr-list button:first-child{border-top:0}
.addr-list button:active{background:var(--brand-soft)}
.grp{border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.grp > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:600;cursor:pointer;min-height:54px}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin-right:4px;flex:none;transition:transform .15s ease}
.grp[open] > summary::after{transform:rotate(-135deg)}
.grp-n{margin-left:auto;background:var(--brand);color:var(--on-brand);border-radius:999px;min-width:24px;height:24px;padding:0 8px;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.st{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:52px}
.st-n{flex:1;min-width:0;font-weight:500}
.st-c{display:flex;align-items:center;gap:6px}
.st-c button{appearance:none;border:1.5px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:11px;font-size:1.25rem;font-weight:600;line-height:1;display:grid;place-items:center}
.st-c input{width:52px;height:40px;text-align:center;border:1.5px solid var(--line);border-radius:11px;background:var(--field);font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.st-c input::-webkit-outer-spin-button,.st-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.st.has .st-c input{border-color:var(--brand2);background:var(--brand-soft)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-size:1.08rem;font-weight:700}
.cal-nav{appearance:none;border:0;background:var(--bg);width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.cal-nav svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-d{font-size:.68rem;font-weight:700;color:var(--ink3);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.day{appearance:none;border:0;background:none;aspect-ratio:1/1.12;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 0 3px;font-weight:600;font-size:.95rem;color:var(--ink);min-width:0}
.day.out{color:var(--ink3);opacity:.45}
.day.today{background:var(--brand-soft);color:var(--brand-ink)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brand2)}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.day .dot{font-size:.56rem;font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;background:var(--go);color:var(--on-go)}
.day .dot.pend{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.who-row .av{background:var(--brand);color:var(--on-brand)}

/* sheets and toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,10,25,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h b{font-size:1.15rem;font-weight:700}
.pick{appearance:none;border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 4px;min-height:56px;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.pick .av{width:38px;height:38px;font-size:.82rem;background:var(--brand-soft);color:var(--brand-ink)}
.pick[aria-pressed="true"] .av{background:var(--brand);color:var(--on-brand)}
.pick-t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.pick-t b{font-weight:600}
.pick-t small{color:var(--ink2);font-size:.84rem}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-12px);z-index:60;background:#17172B;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:.94rem;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:100;background:#393564;display:grid;place-items:center;transition:opacity .35s ease,visibility 0s linear .35s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:150px;height:150px;display:block}
#splash div{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-family:var(--f)}
#splash b{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
#splash small{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8FD483}
.at{display:flex;flex-direction:column;gap:6px}
.at p{padding:8px 12px;border-radius:9px;font-size:.88rem;display:flex;flex-direction:column}
.at p span{color:var(--ink2);overflow-wrap:anywhere}
.at .y{background:var(--go-soft)}
.at .n{background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a.btn{text-decoration:none}
</style>

function pdate(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(s,n){var d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);}

function ticksOf(stage,id){var src=(stage==='yard'?S.ychk:S.cchk).get(id), t=Object.assign({},(src&&src.ticks)||{}), p=S.pend[stage+'|'+id];if(p)Object.keys(p).forEach(function(k){if(p[k]===null)delete t[k];else t[k]=p[k];});return t;}

function setTick(stage,id,item,val){
  var k=stage+'|'+id; (S.pend[k]=S.pend[k]||{})[item]=val;

function flushTicks(stage,id){
  var k=stage+'|'+id; clearTimeout(saveT[k]);
  if(!S.pend[k]||saving[k]) return Promise.resolve();
  var full=ticksOf(stage,id), sent=S.pend[k]; saving[k]=true;
  return S.db.doc((stage==='yard'?'yardchecks/':'checks/')+id).set({ticks:full,at:Date.now(),by:myCrew()||''}).then(function(){
    if(S.pend[k]===sent) delete S.pend[k]; else Object.keys(sent).forEach(function(i){if(S.pend[k]&&S.pend[k][i]===sent[i])delete S.pend[k][i];});
    saving[k]=false; if(S.pend[k]&&Object.keys(S.pend[k]).length) return flushTicks(stage,id); delete S.pend[k];
  },function(e){saving[k]=false;fail(e);});
}

var KEY={jobs:'jobs',crew:'crew',people:'people',vehicles:'vans',daysoff:'off',yardchecks:'ychk',checks:'cchk'};
function subscribe(db){
  Object.keys(KEY).concat(['settings']).forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      var m=new Map(); snap.docs.forEach(function(d){m.set(d.id,Object.assign({},d.data(),{id:d.id}));});
      if(c==='settings'){var r=m.get('roles');S.bosses=(r&&r.bosses)||[];} else S[KEY[c]]=m;
      S.got[c]=true; render();
    },function(){});
  });
}
function LocalDb(seed,changed){
  var data=JSON.parse(JSON.stringify(seed)), subs=[], cp=function(v){return JSON.parse(JSON.stringify(v));};
  function snap(c){var o=data[c]||{};return {docs:Object.keys(o).map(function(id){var v=cp(o[id]);return {id:id,data:function(){return v;}};})};}
  function emit(c){subs.forEach(function(s){if(s.c===c)s.cb(snap(c));});if(changed)changed();}
  function merge(a,b){Object.keys(b).forEach(function(k){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k];});}
  function doc(path){var p=path.split('/'),c=p[0],id=p[1];return {id:id,
    set:async function(v){(data[c]=data[c]||{})[id]=cp(v);emit(c);},
    update:async function(v){data[c]=data[c]||{};data[c][id]=data[c][id]||{};merge(data[c][id],cp(v));emit(c);},
    delete:async function(){if(data[c])delete data[c][id];emit(c);}};}
  return {dump:function(){return cp(data);},doc:doc,collection:function(c){return {
    onSnapshot:function(cb){subs.push({c:c,cb:cb});setTimeout(function(){cb(snap(c));},0);return function(){};},
    add:async function(v){var id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await doc(c+'/'+id).set(v);return {id:id};}};}};
}

/* ---------- address finder ---------- */
function addrKey(){var k='';try{k=(localStorage.getItem('fcs-addr-key')||'').trim();}catch(_){ }return k||ADDR_KEY_BUILT;}
function normPc(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fmtPc(n){n=normPc(n);return n.length>3?n.slice(0,-3)+' '+n.slice(-3):n;}
function titleCase(t){return String(t||'').toLowerCase().replace(/(^|[\s\-'])([a-z])/g,function(m,a,b){return a+b.toUpperCase();});}
function cleanArea(v){return v?String(v).replace(/,?\s*unparished area$/i,''):'';}
async function probe(url,ms){
  var t=Date.now(), ctl=typeof AbortController!=='undefined'?new AbortController():null, tm=setTimeout(function(){if(ctl)ctl.abort();},ms||12000);
  try{var r=await fetch(url,ctl?{signal:ctl.signal}:{}), txt=await r.text(), js=null; clearTimeout(tm); try{js=JSON.parse(txt);}catch(_){ }
    return {ok:r.ok,status:r.status,ms:Date.now()-t,js:js};
  }catch(e){clearTimeout(tm);return {ok:false,status:0,ms:Date.now()-t,err:e&&e.name==='AbortError'?'no answer in time':'blocked or no connection'};}
}
function ipcUrl(path){return 'https://api.ideal-postcodes.co.uk/v1/'+path+(path.indexOf('?')<0?'?':'&')+'api_key='+encodeURIComponent(addrKey());}
function ipcProblem(p){
  var c=p.js&&p.js.code;
  if(c===4010) return 'The address service doesn’t recognise the key.';
  if(c===4011) return 'The address service key isn’t allowed from this web address.';
  if(c===4020) return 'The address service has run out of lookups.';
  if(c===4021) return 'The address service has hit its daily limit.';
  if(p.status===429) return 'The address service is busy. Try again in a minute.';
  if(!p.status) return 'Couldn’t reach the address service.';
  return 'The address service didn’t answer.';
}
function pafItem(a){
  var lines=[a.line_1,a.line_2,a.line_3].filter(function(x){return x&&String(x).trim();}), lat=parseFloat(a.latitude), lon=parseFloat(a.longitude);
  return {line:lines.join(', '),tail:[titleCase(a.post_town),a.postcode].filter(Boolean).join(' '),lat:isNaN(lat)?null:lat,lon:isNaN(lon)?null:lon};
}
function fullAddr(f){return [String(f.line||'').trim(),String(f.tail||'').trim()].filter(Boolean).join(', ');}
async function findPc(){
  var f=S.form; if(!f) return; var raw=normPc(f.pc);
  if(raw.length<5||raw.length>7){toast('Type the whole postcode, like SS6 7AA');return;}
  f.pcRes={busy:true}; render(true);
  var res=null, note='';
  if(addrKey()){
    var p=await probe(ipcUrl('postcodes/'+raw),12000);
    if(p.ok&&p.js&&Array.isArray(p.js.result)&&p.js.result.length) res={pc:p.js.result[0].postcode||fmtPc(raw),list:p.js.result.map(pafItem)};
    else if(p.status===404) res={nf:true,pc:fmtPc(raw)};
    else note=ipcProblem(p);
  }
  if(!res){
    var q=await probe('https://api.postcodes.io/postcodes/'+raw,10000), r=q.ok&&q.js&&q.js.result;
    if(r&&r.latitude!=null) res={pc:r.postcode,list:[],tail:[cleanArea(r.parish)||r.admin_district||'',r.postcode].filter(Boolean).join(' '),lat:r.latitude,lon:r.longitude,note:note};
    else if(q.status===404) res={nf:true,pc:fmtPc(raw)};
    else res={err:true,pc:fmtPc(raw)};
  }
  if(S.form!==f) return;
  f.pcRes=res;
  if(res.tail){f.tail=res.tail;f.lat=res.lat;f.lon=res.lon;}
  render(true);
  if(!res.list||!res.list.length){var el=document.getElementById('f-line');if(el)el.focus();}
}
var SUG={t:null,seq:0,items:[]};
function suggest(q){
  clearTimeout(SUG.t); var box=document.getElementById('sugg'); q=String(q||'').trim();
  if(!box||!addrKey()||q.length<4){SUG.items=[];SUG.seq++;if(box){box.innerHTML='';box.hidden=true;}return;}
  SUG.t=setTimeout(function(){
    var my=++SUG.seq;
    probe(ipcUrl('autocomplete/addresses?query='+encodeURIComponent(q)+'&limit=7&bias_lonlat=0.604,51.586,50000'),8000).then(function(p){
      if(my!==SUG.seq) return;

  month:function(b){var m=S.month||today(0).slice(0,7),d=new Date(+m.slice(0,4),+m.slice(5,7)-1+(+b.dataset.d),1,12);S.month=dstr(d).slice(0,7);render(true);},
  day:function(b){S.day=b.dataset.v;render(true);},
  offnew:function(){var d=S.day&&S.day>=today(0)?S.day:today(7);S.sheet={k:'off',person:myCrew()||(crewList()[0]||{}).id,from:d,to:d,reason:'Holiday',note:'',err:''};render(true);},
  oreason:function(b){S.sheet.reason=b.dataset.v;render(true);},
  offsave:function(){saveOff();},
  offyes:async function(b){var o=S.off.get(b.dataset.id);if(!o)return;try{await S.db.doc('daysoff/'+o.id).update({status:'approved',decidedAt:Date.now()});var clash=jobList().filter(function(j){return j.date>=o.from&&j.date<=o.to&&(j.crew||[]).indexOf(o.person)>=0;});toast(clash.length?'Approved. '+firstOf(o.person)+' is on a job then: change that crew.':'Approved. It’s on the calendar.');}catch(e){fail(e);}},
  offno:async function(b){try{await S.db.doc('daysoff/'+b.dataset.id).update({status:'declined',decidedAt:Date.now()});toast('Declined');}catch(e){fail(e);}},
  offdel:async function(b){var id=b.dataset.id;if(!two('off'+id))return;try{await S.db.doc('daysoff/'+id).update({status:'cancelled'});toast('Time off cancelled');}catch(e){fail(e);}},
  closesheet:function(b,e){if(e&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-a="closesheet"]'))return;S.sheet=null;render(true);},
  who:function(){S.sheet={k:'who'};render(true);},
  be:function(b){S.viewAs=b.dataset.id;S.sheet=null;S.page=null;S.form=null;S.tab='jobs';window.scrollTo(0,0);render(true);toast('Now seeing what '+firstOf(S.viewAs)+' sees');},
  link:async function(b){try{await S.db.doc('people/'+S.me).set({crewId:b.dataset.id,linkedAt:Date.now()});toast('Thanks, '+firstOf(b.dataset.id));}catch(e){fail(e);}},
  yard:async function(b){var c=S.crew.get(b.dataset.id);if(!c)return;try{await S.db.doc('crew/'+c.id).update({yard:!c.yard});}catch(e){fail(e);}},
  boss:async function(b){var id=b.dataset.id,l=S.bosses.slice(),i=l.indexOf(id);if(i>=0)l.splice(i,1);else l.push(id);try{await S.db.doc('settings/roles').set({bosses:l});}catch(e){fail(e);}},
  staffdel:async function(b){var id=b.dataset.id;if(!two('st'+id))return;try{await S.db.doc('crew/'+id).update({removed:true});toast('Removed');}catch(e){fail(e);}},
  vandel:async function(b){var id=b.dataset.id;if(!two('vn'+id))return;try{await S.db.doc('vehicles/'+id).update({removed:true});toast('Removed');}catch(e){fail(e);}},
  keydel:function(){if(!two('key'))return;try{localStorage.removeItem('fcs-addr-key');}catch(_){ }toast('Key removed');render(true);},
  addrtest:function(){addrTest();},
  checkupdate:function(){checkUpdate(true);},
  doupdate:function(){doUpdate();},
  reset:function(){if(!two('reset'))return;S.jobs=new Map();S.page=null;S.form=null;S.sheet=null;S.tab='jobs';startLocal(true);toast('Wiped. Back to the start.');render(true);}
};
var FORMS={
  addstaff:async function(){var el=document.getElementById('s-name'),n=(el?el.value:'').trim().replace(/\s+/g,' ');if(!n){toast('Type a name first');return;}if(crewList().some(function(c){return c.name.toLowerCase()===n.toLowerCase();})){toast(n+' is already on the list');return;}try{await S.db.collection('crew').add({name:n,yard:false,at:Date.now()});toast(n+' added');}catch(e){fail(e);}render(true);var e2=document.getElementById('s-name');if(e2)e2.value='';},
  addvan:async function(){var r=document.getElementById('v-reg'),m=document.getElementById('v-name'),reg=(r?r.value:'').trim().toUpperCase().replace(/\s+/g,' '),nm=(m?m.value:'').trim();if(!reg){toast('Type the reg first');return;}if(fleet().some(function(v){return String(v.reg).toUpperCase()===reg;})){toast(reg+' is already on the list');return;}try{await S.db.collection('vehicles').add({reg:reg,name:nm,at:Date.now()});toast(reg+' added');}catch(e){fail(e);}render(true);},
  addrkey:function(){var el=document.getElementById('k-in'),v=(el?el.value:'').trim();if(!/^ak_[A-Za-z0-9_]{6,}$/.test(v)){toast('That doesn’t look like a key. It starts ak_');return;}try{localStorage.setItem('fcs-addr-key',v);}catch(_){toast('Couldn’t save it on this phone');return;}toast('Key saved. Tap Test.');render(true);}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  if(/^(INPUT|TEXTAREA|SELECT|OPTION|LABEL)$/.test(e.target.tagName)) return;
  var ae=document.activeElement; if(ae&&ae!==b&&typing()){try{ae.blur();}catch(_){ }}
  var fn=ACT[b.dataset.a]; if(fn){if(b.tagName!=='A')e.preventDefault();fn(b,e);}
});
document.addEventListener('input',function(e){
  var t=e.target, d=t.dataset||{};
  if(d.f&&S.form){S.form[d.f]=t.value;if(d.f==='line')suggest(t.value);return;}
  if(d.x&&S.form){var q=Math.max(0,Math.min(999,parseInt(t.value,10)||0));if(q)S.form.extra[d.x]=q;else delete S.form.extra[d.x];S.deferred=true;return;}
  if(d.o&&S.sheet&&t.tagName==='INPUT'&&t.type!=='date'){S.sheet[d.o]=t.value;}
});
document.addEventListener('change',function(e){
  var t=e.target, d=t.dataset||{}, f=S.form;
  if(d.c&&f){
    if(d.c==='date'){if(t.value)f.date=t.value;}
    else if(d.c==='vehicle') f.vehicle=t.value;
    else if(d.c==='ch'){f.ch=t.value;var i=f.gang.indexOf(t.value);if(i>=0)f.gang.splice(i,1);}
    else if(d.c==='gang'&&t.value){if(f.gang.indexOf(t.value)<0)f.gang.push(t.value);}
    if(d.c==='date'){[f.ch].concat(f.gang).forEach(function(id){if(id&&offOn(id,f.date)){toast(nameOf(id)+' is off that day');}});}
    t.blur(); render(true); return;
  }
  if(d.o&&S.sheet){S.sheet[d.o]=t.value;if(d.o==='from'&&(!S.sheet.to||S.sheet.to<t.value))S.sheet.to=t.value;if(t.type==='date'||t.tagName==='SELECT'){t.blur();render(true);}}
});
document.addEventListener('submit',function(e){var k=e.target&&e.target.dataset&&e.target.dataset.form;if(k&&FORMS[k]){e.preventDefault();var ae=document.activeElement;if(ae&&ae.blur)ae.blur();FORMS[k]();}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='f-pc'){e.preventDefault();e.target.blur();findPc();}});
document.addEventListener('toggle',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('grp')&&S.form)S.form.open[t.dataset.g]=t.open;},true);
document.addEventListener('focusout',function(){setTimeout(function(){if(S.deferred&&!typing())render();},350);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkUpdate(false);});
boot();
})();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
