function pillOf(j){ // where a job has got to, in one word
  var st=statusOf(j), m=st==='plan'||st==='noload'?0:missingOf(j).length;
  if(st==='done') return '<span class="pill p-done">Signed off</span>';
  if(st==='out') return '<span class="pill p-out">Left '+clock(j.left.at)+'</span>';
  if(st==='plan') return '<span class="pill p-plan">Not allocated</span>';
  if(st==='noload') return '<span class="pill p-bad"><i></i>No load list</span>';
  if(m) return '<span class="pill p-bad"><i></i>'+m+' missing</span>';
  return st==='checked'?'<span class="pill p-checked"><i></i>Checked</span>':(st==='loaded'?'<span class="pill p-loaded"><i></i>Loaded</span>':'<span class="pill p-toload"><i></i>To load</span>');
}
function ldLeft(L){if(L.left&&L.left.at)return L.left;var o=L.jobs.filter(function(x){return x.left&&x.left.at;})[0];return o?o.left:null;}
function ldPill(L){ // where a lorry's load list has got to
  var st=ldStatus(L), m=missingOf(L).length;
  if(st==='none') return '<span class="pill p-plan">Not sent</span>';
  if(st==='out') return '<span class="pill p-out">Left '+clock(ldLeft(L).at)+'</span>';
  if(m) return '<span class="pill p-bad"><i></i>'+m+' missing</span>';
  return st==='checked'?'<span class="pill p-checked"><i></i>Checked</span>':(st==='loaded'?'<span class="pill p-loaded"><i></i>Loaded</span>':'<span class="pill p-toload"><i></i>To load</span>');
}
function ldGangs(L){ // who takes the lorry out: "Ian's gang, 2 jobs", or nobody yet
  var chs=[]; L.jobs.forEach(function(o){if(o.ch&&chs.indexOf(o.ch)<0)chs.push(o.ch);});
  return chs.length?andList(chs.map(firstOf))+'’s gang'+(chs.length>1?'s':'')+(L.jobs.length>1?', '+plural(L.jobs.length,'job'):''):'No gang allocated yet';
}
function crewLine(j){var ids=(j.crew||[]).slice().sort(function(a,b){return (b===j.ch)-(a===j.ch);});return ids.map(firstOf).join(', ');}
function kindTag(j){return j.kind&&KINDNAME[j.kind]?'<span class="ty '+j.kind+'">'+KINDNAME[j.kind]+'</span>':'';}
function loadCard(L){ // one lorry's load list for one day, as a card: the lorry, the load in a line, and where it has got to. The yard sees nothing about the jobs
  var rows=rowsOf(L), m=missingOf(L), yv=isYard()&&!isBoss();
  return '<button class="job" data-a="ldk" data-k="'+esc(L.key)+'"><div class="job-top"><span class="job-a ld-a"><span class="plate">'+esc(L.vehicle)+'</span></span>'+ldPill(L)+'</div>'+
    '<div class="job-m"><span>'+esc(sheetSum(L,rows))+'</span>'+(yv?'':'<span>'+esc(ldGangs(L))+'</span>')+'</div>'+(m.length?'<div class="job-s"><span class="bad">Missing: '+esc(m.map(itemName).join(', '))+'</span></div>':'')+(L.notes&&yv?'<div class="job-w">'+esc(L.notes)+'</div>':'')+'</button>';
}
function jobCard(j,pos){
  pos=pos||runPos(j);
  var L=ldOfJob(j), st=statusOf(j), al=allocated(j), y=L&&L.yard&&L.yard.at, c=L&&L.chk&&L.chk.at, l=j.left&&j.left.at, d=j.done&&j.done.at, ex=extrasOf(j.id).length, ph=photosOf(j.id,'finish').length, m=L?missingOf(L):[], bits=[];
  if(l) bits.push('<span>Left <b>'+clock(j.left.at)+'</b></span>');
  if(d) bits.push('<span>Signed off <b>'+clock(j.done.at)+'</b></span>');
  if(m.length&&l) bits.push('<span class="bad">'+m.length+' missing</span>');
  if(ex) bits.push('<span>'+plural(ex,'extra')+'</span>');
  if(ph) bits.push('<span>'+plural(ph,'photo')+'</span>');
  var oc=isBoss()&&!d?offClash(j):[]; if(oc.length) bits.push('<span class="bad">'+esc(andList(oc.map(firstOf)))+' booked off that day</span>');
  var fx=c&&L.chk.fixed?L.chk.fixed.length:0; if(fx&&isBoss()) bits.push('<span class="bad">'+fx+' wasn’t on</span>');
  if(l&&j.left.noList) bits.push('<span class="bad">No load list</span>');
  return '<button class="job" data-a="open" data-id="'+esc(j.id)+'"><div class="job-top"><span class="job-a">'+esc(j.address)+'</span>'+pillOf(j)+'</div>'+
    (j.what?'<div class="job-w">'+esc(j.what)+'</div>':'')+
    '<div class="job-m">'+(j.vehicle?'<span class="plate">'+esc(vehOf(j))+'</span>':'')+kindTag(j)+(pos.n>1?'<span class="seq">'+(pos.i+1)+' of '+pos.n+'</span>':'')+(al?'<span>'+esc(crewLine(j))+'</span>':'<span>No lorry or gang yet</span>')+'</div>'+
    (bits.length?'<div class="job-s">'+bits.join('')+'</div>':'')+
    '<div class="steps" aria-hidden="true"><i class="on"></i><i class="'+(al?'on':'')+'"></i><i class="'+(y?'on':'')+'"></i><i class="'+(c?'on':'')+'"></i><i class="'+(l?'on':'')+'"></i><i class="'+(d?'on':'')+'"></i></div></button>';
}
function offAsk(o){return '<div class="need"><div><b>'+esc(nameOf(o.person))+'</b> wants '+esc(frange(o.from,o.to))+' off</div><span class="small muted">'+esc(o.reason||'Time off')+(o.note?' · '+esc(o.note):'')+'. '+(o.why==='job'?'Already on a job then.':'Less than a week’s notice.')+'</span><div class="btns"><button class="btn go sm" data-a="offyes" data-id="'+esc(o.id)+'">Approve</button><button class="btn line sm" data-a="offno" data-id="'+esc(o.id)+'">Say no</button></div></div>';}
function scafsNeed(){return inspDue().length;}   // the scaffolds whose inspection is due or overdue. One count for the card list, the More row and the tab
function inspCards(){ // inspections that are due, for the boss and for whoever is down to inspect
  var h='';
  var btns=function(s){return '<div class="btns fit"><button class="btn go sm" data-a="inspnew" data-id="'+esc(s.id)+'">Record inspection</button><button class="btn line sm" data-a="scaf" data-id="'+esc(s.id)+'">Open record</button></div>';};
  inspDue().forEach(function(s){var late=daysTo(dueOf(s))<0;h+='<div class="need '+(late?'bad':'insp')+'"><div><b>Inspection '+(late?'overdue':'due today')+'</b> at '+esc(s.address)+'</div><span class="small muted">'+esc(dueWords(s))+(s.inspector?' · '+esc(firstOf(s.inspector))+' to inspect':'')+'</span>'+btns(s)+'</div>';});
  return h;
}
function wkRow(w){
  var m=wkMine(w.date);
  return '<div class="wk-r"><div class="li-t"><b>'+esc(fshort(w.date))+'</b><small>'+(m?(m.picked?'You’re working. '+esc(bossFirst())+' picked you.':'Your name is down. Waiting for '+esc(bossFirst())+'.'):'Voluntary')+'</small></div><button class="btn sm '+(m?'line':'go')+'" data-a="wkname" data-v="'+w.date+'">'+(m?'Take my name off':'Put my name down')+'</button></div>';
}
function wkCard(){ // tells staff that weekend work is going
  var hide=wkHidden(), days=wkOpenDays().filter(function(w){return hide.indexOf(w.date)<0||wkMine(w.date);}), off=wkOffDays(); if((!days.length&&!off.length)||!myCrew()) return '';
  var note=days.map(function(w){return w.note;}).filter(Boolean)[0];
  return '<div class="need wk"><div><b>'+(days.length?'Weekend work is going':'Weekend work is off')+'</b></div><span class="small muted">'+(days.length?esc(bossFirst())+' is asking who wants it.'+(note?' '+esc(note):''):esc(bossFirst())+' has called it off.')+'</span>'+days.map(wkRow).join('')+
    off.map(function(w){return '<div class="wk-r"><div class="li-t"><b>'+esc(fshort(w.date))+'</b><small>Called off. No work that day.</small></div><span class="pill p-bad">Off</span></div>';}).join('')+
    (days.some(function(w){return !wkMine(w.date);})?'<button class="link small" data-a="wkhide" style="align-self:flex-start;padding:0">Not for me</button>':'')+'</div>';
}
function yardLds(){return allLds(today(0)).filter(function(L){return inWin(L.date);});}   // the load lists the yard sees: today's and the next working day's
function yardListHtml(){ // the yard's list: each day, and one load list for each lorry
  var days=[], h='';
  yardLds().forEach(function(L){if(!days.length||days[days.length-1].d!==L.date)days.push({d:L.date,l:[]});days[days.length-1].l.push(L);});
  days.forEach(function(g){
    var n=g.l.length, lo=g.l.filter(function(L){return ldStatus(L)!=='toload';}).length;
    h+='<div class="sec"><div class="sec-h"><span class="lab">'+esc(fwhen(g.d))+'</span><span class="small muted">'+lo+' of '+plural(n,'lorry').replace('lorrys','lorries')+' loaded</span></div>'+g.l.map(loadCard).join('')+'</div>';
  });
  return h;
}
function jobListHtml(){
  var boss=isBoss(), yard=isYard(), t0=today(0), h='', q=String(S.q||'').trim().toLowerCase();
  if(yard&&!boss){var yh=yardListHtml();return (yh||'<div class="card empty">'+IC.box+'<b>Nothing to load</b><span>When '+esc(bossFirst())+' sends a lorry’s load list for today or the next working day, it shows here.</span>'+(canDemo()?'<button class="btn soft sm" data-a="demo" style="margin-top:8px">'+IC.play+'Show example jobs</button>':'')+'</div>')+(yh&&canDemo()?egCard():'');}
  var all=visJobs();
  if(q){
    var words=q.split(/\s+/), hits=all.filter(function(j){var hay=(j.address+' '+(j.vehicle||'')+' '+(j.crew||[]).map(nameOf).join(' ')+' '+(j.what||'')).toLowerCase();return words.every(function(w){return hay.indexOf(w)>=0;});}).sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,40);
    if(!hits.length) return '<div class="card empty">'+IC.search+'<b>Nothing found</b><span>Try part of the road name or the postcode.</span></div>';
    return '<div class="sec"><span class="lab">'+plural(hits.length,'job')+' found</span>'+hits.map(function(j){return '<span class="lab">'+esc(fwhen(j.date))+'</span>'+jobCard(j);}).join('')+'</div>';
  }
  var up=all.filter(function(j){return j.date>=t0;}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));});
  var late=boss?[]:all.filter(function(j){return j.date<t0;}).sort(function(a,b){return a.date<b.date?-1:1;});   // a job of theirs from an earlier day that was never signed off
  if(late.length) h+='<div class="sec"><div class="sec-h"><span class="lab">Still to sign off</span><span class="small muted">From an earlier day</span></div>'+late.map(function(j){return '<span class="lab">'+esc(fshort(j.date))+'</span>'+jobCard(j);}).join('')+'</div>';
  if(!up.length){
    if(!late.length) h+='<div class="card empty">'+IC.box+'<b>'+(boss?'No jobs yet':'No jobs for you yet')+'</b><span>'+(boss?'Tap New job to put a job on. Put the lorry and gang on it when you allocate, the night before or in the morning. Tap Load lists to send the yard what goes on each lorry.':'When '+esc(bossFirst())+' puts you on a job for today or the next working day, it shows here.')+'</span>'+(canDemo()?'<button class="btn soft sm" data-a="demo" style="margin-top:8px">'+IC.play+'Show example jobs</button>':'')+'</div>';
  }else{
    var days=[]; up.forEach(function(j){if(!days.length||days[days.length-1].d!==j.date)days.push({d:j.date,l:[]});days[days.length-1].l.push(j);});
    days.forEach(function(g){
      var sum=[];
      if(boss){var Ls=ldList(g.d), out=Ls.filter(function(L){return ldStatus(L)==='out';}).length, lo=Ls.filter(function(L){return ldStatus(L)!=='toload';}).length, na=g.l.filter(function(j){return !allocated(j)&&!(j.done&&j.done.at);}).length, lw=function(n){return plural(n,'lorry').replace('lorrys','lorries');};
        if(Ls.length) sum.push(g.d===t0?out+' of '+lw(Ls.length)+' left':lo+' of '+lw(Ls.length)+' loaded');
        if(na) sum.push(na+' not allocated');}
      var runs=[], at={}; g.l.forEach(function(j){var k=runKey(j);if(at[k]==null){at[k]=runs.length;runs.push([]);}runs[at[k]].push(j);});
      h+='<div class="sec"><div class="sec-h"><span class="lab">'+esc(fwhen(g.d))+'</span>'+(sum.length?'<span class="small muted">'+esc(sum.join(' · '))+'</span>':'')+'</div>'+runs.map(function(r){
        var full=runOf(r[0]).length, f=r.sort(bySeq)[0];
        if(full<2) return jobCard(f);
        return '<div class="run"><div class="run-h">'+(f.vehicle?'<span class="plate">'+esc(vehOf(f))+'</span>':'')+'<b>'+esc(f.ch?firstOf(f.ch)+'’s gang':'Gang')+'</b><span class="small muted">'+full+' jobs that day</span>'+(boss&&!walking()?'<button class="link small run-add" data-a="another" data-id="'+esc(r[r.length-1].id)+'">Add a job</button>':'')+'</div>'+r.map(function(j){return jobCard(j);}).join('')+'</div>';
      }).join('')+'</div>';
    });
  }
  var past=boss?all.filter(function(j){return j.date<t0;}).sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,30):[];
  if(past.length) h+='<div class="sec"><button class="link" data-a="earlier">'+(S.earlier?'Hide earlier jobs':'Show earlier jobs ('+past.length+')')+'</button>'+(S.earlier?past.map(function(j){return '<span class="lab">'+esc(fshort(j.date))+'</span>'+jobCard(j);}).join(''):'')+'</div>';
  if(canDemo()&&all.length) h+=egCard();   // with no jobs at all, the empty card above already has the button
  return h;
}
function myLoads(){ // the charge hand's load lists to check: one for each lorry and day he takes out
  var me=myCrew(), seen={}, h='';
  if(!me||isYard()) return '';
  visJobs().filter(function(j){return j.ch===me&&j.date>=today(0)&&!(j.left&&j.left.at)&&!(j.done&&j.done.at);}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:bySeq(a,b));}).forEach(function(j){
    var k=ldKey(j); if(seen[k]) return; seen[k]=1;
    var L=ldOfJob(j);
    if(!L){h+='<div class="need ldn"><div class="ldn-h"><b>Load list</b><span class="plate">'+esc(vehOf(j))+'</span><span class="small muted">'+esc(fwhen(j.date))+'</span><span class="pill p-plan">Not sent</span></div><span class="small muted">'+esc(bossFirst())+' hasn’t sent the load list for this lorry yet. It shows here when he does.</span></div>';return;}
    var rows=rowsOf(L), st=ldStatus(L), m=missingOf(L);
    h+='<button class="need ldn'+(m.length?' bad':(st==='checked'?' pay':''))+'" data-a="ldk" data-k="'+esc(L.key)+'"><div class="ldn-h"><b>Load list</b><span class="plate">'+esc(L.vehicle)+'</span><span class="small muted">'+esc(fwhen(j.date))+'</span>'+ldPill(L)+'</div><span class="small muted">'+esc(sheetSum(L,rows))+(L.jobs.length>1?' · for all '+L.jobs.length+' jobs':'')+'. '+(st==='checked'?'Checked.':(st==='loaded'?'Loaded by the yard. Tap to check it.':'Not loaded yet. Tap to see it.'))+(m.length?' Missing: '+esc(m.map(itemName).join(', '))+'.':'')+'</span></button>';
  });
  return h;
}
function egCard(){return '<section class="card eg"><div><b>Example jobs</b><span class="small muted">A made-up week of jobs, to see every screen with something on it. Nothing in it is saved.</span></div><button class="btn soft sm" data-a="demo">'+IC.play+'Show example jobs</button></section>';}
function jobsTab(){
  if(isBoss()) return bossJobs();
  var side=myLoads()+inspCards()+wkCard(), list='<div id="joblist" class="sec" style="gap:16px">'+jobListHtml()+'</div>';
  S.q=''; if(side) LAY='side';
  return (side?'<div class="col cs"><span class="lab wide">For you</span>'+side+'</div>':'')+'<div class="col ca">'+list+'</div>';
}

/* ---------- the boss's pages, version 15: one thing on each. Jobs for a day, load lists for a day, the staff, then More for the rest ---------- */
function bdayDef(){var t=today(0);return new Date().getHours()<12&&(!isWkend(t)||wkDay(t)||jobList().some(function(j){return j.date===t;}))?t:nextWork();}   // the morning is for today; from noon, or on a weekend with no work on, he is getting the next working day ready
function bday(){if(!S.bday){S.bday=bdayDef();S.bdayAuto=S.bday;}return S.bday;}   // bdayAuto: the day the app chose itself, so it can move on at midnight and 12 noon
function dayWord(d){return d===today(0)?'Today':(d===today(1)?'Tomorrow':(d===today(-1)?'Yesterday':DAYL[pdate(d).getDay()]));}
function dayBar(){ // the day the boss is looking at: the same day on Jobs, Load lists and Gangs
  var d=bday(), t0=today(0), nw=nextWork();
  var chip=function(v,t){return '<button type="button" class="chip" data-a="bday" data-v="'+v+'" aria-pressed="'+(d===v)+'">'+esc(t)+'</button>';};
  return '<section class="card dayb"><div class="cal-h"><button class="cal-nav" data-a="bday" data-d="-1" aria-label="The day before">'+IC.prev+'</button><div class="dayb-t"><b>'+esc(dayWord(d))+'</b><small>'+esc(fshort(d))+'</small></div><button class="cal-nav" data-a="bday" data-d="1" aria-label="The day after">'+IC.next+'</button></div>'+
    '<div class="chips dayb-c">'+chip(t0,'Today')+chip(nw,nw===today(1)?'Tomorrow':DAYL[pdate(nw).getDay()])+'</div></section>';
}
function segBar(a,opts,cur){return '<div class="seg pages" role="group">'+opts.map(function(o){return '<button type="button" data-a="'+a+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+(o[2]?' <span class="seg-n">'+o[2]+'</span>':'')+'</button>';}).join('')+'</div>';}
function aheadNote(d){ // looking at today: anything the next working day still needs, in one line
  if(d!==today(0)) return '';
  var nw=nextWork(), na=notAlloc(nw,nw).length, nl=noLoadList(nw,nw).map(vehOf), bits=[];
  if(na) bits.push(plural(na,'job')+' not allocated');
  if(nl.length) bits.push('no load list for '+andList(nl));
  return bits.length?'<button class="need plan ahead" data-a="bday" data-v="'+nw+'"><div><b>'+esc(nw===today(1)?'Tomorrow':DAYL[pdate(nw).getDay()])+':</b> '+esc(bits.join(', '))+'</div><span class="small muted">Tap to go to '+esc(fshort(nw))+'.</span></button>':'';
}
function bossJobs(){
  var view=S.jview==='done'?'done':'day', h='';
  h+=segBar('jview',[['day','Jobs for the day'],['done','Signed off']],view);
  if(view==='done'){
    h+='<div class="srch">'+IC.search+'<input id="q" class="in" type="text" inputmode="search" placeholder="Find any job by address, lorry or name" value="'+esc(S.q)+'" autocomplete="off" enterkeyhint="search" aria-label="Find a job"></div>';
    return '<div class="col">'+h+'<div id="joblist" class="sec" style="gap:12px">'+doneListHtml()+'</div></div>';
  }
  S.q='';
  var d=bday(), js=jobList().filter(function(j){return j.date===d;}), open=js.filter(function(j){return !(j.done&&j.done.at);}), done=js.filter(function(j){return j.done&&j.done.at;}), na=open.filter(function(j){return !allocated(j);}), al=open.filter(allocated);
  h+=dayBar()+(walking()?'':'<button class="btn" data-a="new">'+IC.plus+'New job</button>');
  var sum=[plural(js.length,'job')]; if(na.length) sum.push(na.length+' not allocated'); if(done.length) sum.push(done.length+' signed off');
  var L='<div class="col">'+h+aheadNote(d)+'</div><div class="col"><div id="joblist" class="sec" style="gap:14px">', un=unsignedJobs();
  if(un.length) L+='<div class="sec unsigned"><span class="lab bad-t">Not signed off from earlier days</span><p class="hint">These stay here until they are signed off, moved to another day or deleted. Open one to do it.</p>'+un.slice(0,12).map(function(j){return '<span class="lab">'+esc(fwhen(j.date))+'</span>'+jobCard(j);}).join('')+(un.length>12?'<p class="hint">And '+(un.length-12)+' more.</p>':'')+'</div>';
  if(!js.length){
    L+='<div class="card empty">'+IC.box+'<b>No jobs on '+esc(fshort(d))+'</b><span>Tap New job to put one on. Put the lorry and gang on it when you allocate, the night before or in the morning.</span>'+(canDemo()&&!jobList().length?'<button class="btn soft sm" data-a="demo" style="margin-top:8px">'+IC.play+'Show example jobs</button>':'')+'</div>';
  }else{
    L+='<div class="sec-h"><span class="lab">'+esc(fwhen(d))+'</span><span class="small muted">'+esc(sum.join(' · '))+'</span></div>';
    if(na.length) L+='<div class="sec"><span class="lab">Not allocated</span>'+na.sort(bySeq).map(function(j){return '<div class="need plan"><div><b>'+esc(j.line||j.address)+'</b></div><span class="small muted">'+esc([KINDNAME[j.kind]||'',String(j.what||'').replace(/[.\s]+$/,'')].filter(Boolean).join(' · '))+(j.what||j.kind?'. ':'')+'No lorry or gang on it yet, so only you can see it.</span><div class="btns fit"><button class="btn go sm" data-a="alloc" data-id="'+esc(j.id)+'">Allocate</button><button class="btn line sm" data-a="open" data-id="'+esc(j.id)+'">Open job</button></div></div>';}).join('')+'</div>';
    var runs=[], at={}; al.sort(function(a,b){return byLorry(a,b);}).forEach(function(j){var k=runKey(j);if(at[k]==null){at[k]=runs.length;runs.push([]);}runs[at[k]].push(j);});
    if(runs.length) L+='<div class="sec"><span class="lab">Gangs out</span>'+runs.map(function(r){
      var full=runOf(r[0]).length, f=r.sort(bySeq)[0];
      if(full<2) return jobCard(f);
      return '<div class="run"><div class="run-h"><span class="plate">'+esc(vehOf(f))+'</span><b>'+esc(firstOf(f.ch)+'’s gang')+'</b><span class="small muted">'+full+' jobs that day</span>'+(walking()?'':'<button class="link small run-add" data-a="another" data-id="'+esc(r[r.length-1].id)+'">Add a job</button>')+'</div>'+r.map(function(j){return jobCard(j);}).join('')+'</div>';
    }).join('')+'</div>';
    if(done.length) L+='<details class="fold card flush done-f"'+(open.length?'':' open')+'><summary><span><b>Signed off</b><small>'+plural(done.length,'job')+' done that day</small></span></summary><div class="sec" style="padding:0 12px 12px;gap:10px">'+done.sort(bySeq).map(function(j){return jobCard(j);}).join('')+'</div></details>';
  }

function demoGo(n){
  var d=S.demo, L=d.ld&&ldByKey(d.ld), j=d.job&&S.jobs.get(d.job);
  if(!L){demoWalk();return;}
  if(n>=4&&!j) n=3;
  d.gang=j?((j.crew||[]).filter(function(x){return x!==j.ch;})[0]||null):null;
  if(n===5&&!d.gang) n=6;
  d.step=n; S.viewAs=n===2?d.yard:(n===4||n===6?j.ch:(n===5?d.gang:d.boss));
  S.sheet=null; S.lb=null; S.self=null; S.jf=null;
  if(n===3){var f=blankForm();f.date=L.date;f.dmode=dmodeOf(L.date);f.vehicle=L.vehicle;S.form=f;S.page={k:'form'};}
  else{S.form=null;S.page=n===2?{k:'load',key:L.key}:(n===4?{k:'load',key:L.key,from:j.id}:{k:'job',id:j.id});}   // the yard and the charge hand work on the lorry's load list
  S.nav=true; window.scrollTo(0,0); render(true);
}
async function demoAuto(){ // "Do it for me": carry out the step exactly as that person would
  var d=S.demo; if(!d||S.busy) return; var n=d.step, j=d.job&&S.jobs.get(d.job), L=d.ld&&ldByKey(d.ld), now=Date.now(), all={};

    if(n===1){
      var reg=String(fleet()[0].reg).toUpperCase(), key=ldKey({date:today(0),vehicle:reg}), doc={date:today(0),vehicle:reg,load:'full',extra:Object.assign({},KIT,{bm4:2,rpw:1}),notes:'Load the beams last, they come off first.',sentAt:now,sentBy:d.boss,yard:null,chk:null,left:null};
      await S.db.doc('loads/'+key).set(doc); tell(ldAlerts(null,Object.assign({list:true,key:key,std:[],jobs:[]},doc)));

      var body={v:2,kind:'erect',seq:1,date:L.date,address:addr,line:addr,tail:'',lat:null,lon:null,exact:false,pk:placeKey(addr),prop:Object.assign(blankProp(),{type:'Semi',storeys:'2',note:'Side gate on the left.'}),vehicle:L.vehicle,what:'Front and back, 2 lifts, for the roof.',crew:staff.slice(0,3).map(function(c){return c.id;}),ch:staff[0].id,notes:'Scaffold the front for new windows.',createdAt:now,createdBy:d.boss,allocAt:now,allocBy:d.boss,left:null,done:null};
      var ref=await S.db.collection('jobs').add(body); tell(jobAlerts(null,Object.assign({id:ref.id},body)));
      d.job=ref.id; S.busy=''; demoGo(4); return;
    }
    if(!j){S.busy='';return;}
    if(n===4){
      if(!(L.chk&&L.chk.at)){await S.db.doc('checks/'+L.key).set({ticks:all,at:now,by:j.ch});await ldSet(L,'chk',{at:now,by:j.ch,n:rowsOf(L).length,missing:[]});}
      if(!(j.left&&j.left.at)){await S.db.doc('jobs/'+j.id).update({left:{at:now,by:j.ch,typed:false}});await ldSet(L,'left',{at:now,by:j.ch,typed:false});tell(leftAlerts(j,now,1));}
      S.busy=''; demoGo(5); return;
    }
    if(n===5){S.busy='';demoGo(6);return;}
    if(n===6){
      if(!photosOf(j.id,'finish').length){var pic=demoPicture(), pid=uid('p');await keepPhoto(pid,pic.th,pic.full);await S.db.doc('photos/'+pid).set({job:j.id,kind:'finish',by:j.ch,at:now});}

      S.busy=''; demoGo(7); return;
    }
  }catch(e){fail(e);}

}

/* ---------- alerts: who gets told what.
   Each alert is saved for one person and shows under their Alerts tab. They are written the moment something happens,
   so once the phones share storage the same alerts can be pushed to each phone. ---------- */
function andList(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function bossIds(){return S.bosses.filter(function(b){return S.crew.has(b)&&!S.crew.get(b).removed;});}
function yardIds(){return crewList().filter(function(c){return c.yard;}).map(function(c){return c.id;});}
function siteIds(){return crewList().filter(function(c){return S.bosses.indexOf(c.id)<0;}).map(function(c){return c.id;});}   // everyone but the boss
function vehOf(j){return String(j.vehicle||'').toUpperCase();}
function toAll(ids,a){return ids.map(function(id){return Object.assign({to:id},a);});}
function leadIds(){return bossIds().concat((S.supers||[]).filter(function(b){return isSup(b)&&S.crew.has(b)&&!S.crew.get(b).removed;}));}   // the boss and any supervisor: a supervisor is told what the boss is told
function toBosses(a){return toAll(leadIds(),a);}
function tell(list){ // never tells the person doing it, and never says the same thing twice
  var me=myCrew(), now=Date.now(), seen={}, out=[];
  (list||[]).forEach(function(a){
    if(!a||!a.to||a.to===me||!S.crew.has(a.to)||S.crew.get(a.to).removed) return;
    var k=a.to+'|'+a.t+'|'+a.m; if(seen[k]) return; seen[k]=1; out.push(a);
  });
  out.forEach(function(a,i){S.db.doc('alerts/'+uid('a')).set(Object.assign({at:now+i,by:me||'',read:false},a)).catch(function(){});});
  if(out.length){pruneAlerts();notifyLocal(out);}
  return out;
}
function toldWords(out){var ids=[];(out||[]).forEach(function(a){if(ids.indexOf(a.to)<0)ids.push(a.to);});return andList(ids.map(firstOf));}
function pruneAlerts(){ // keep the store small: read alerts over a month old go, and so does anything beyond the newest 400
  var all=Array.from(S.alerts.values()), cut=Date.now()-31*864e5, old=all.filter(function(a){return a.read&&a.at<cut;});
  if(all.length>400) old=old.concat(all.sort(function(a,b){return (b.at||0)-(a.at||0);}).slice(400));
  old.slice(0,40).forEach(function(a){S.db.doc('alerts/'+a.id).delete().catch(function(){});});
}
function jobAlerts(old,nw){ // a job put on (no old), changed, or taken off (no nw): who needs telling, and what
  // The yard and the site staff only see today and the next working day, so that is all they are told about. A job further ahead is first heard of at four o'clock the day before.
  var oin=!!old&&inWin(old.date), nin=!!nw&&inWin(nw.date);
  if(old&&nw&&!oin&&nin) old=null;                       // moved into their days: to them it is a new job
  else if(old&&nw&&oin&&!nin) return movedAlerts(old);    // moved out of their days: to them it has gone
  else if(!oin&&!nin) return [];
  var out=[], yard=yardIds(), when=function(j){return fshort(j.date);};
  var what=function(j){return j.what?' '+String(j.what).replace(/[.\s]+$/,'')+'.':'';};
  var chMsg=function(j){var g=(j.crew||[]).filter(function(x){return x!==j.ch;}).map(firstOf);return when(j)+': '+j.address+'. Lorry '+vehOf(j)+(g.length?', with '+andList(g):'')+'.'+what(j);};
  var gangMsg=function(j){return when(j)+': '+j.address+'. '+firstOf(j.ch)+' is charge hand, lorry '+vehOf(j)+'.'+what(j);};
  if(!old&&nw){
    if(nw.ch) out.push({to:nw.ch,k:'job',t:'You’re charge hand',m:chMsg(nw),job:nw.id});
    (nw.crew||[]).forEach(function(c){if(c!==nw.ch)out.push({to:c,k:'job',t:'You’re on a job',m:gangMsg(nw),job:nw.id});});
  }else if(old&&!nw){
    if(!(old.done&&old.done.at)){
      (old.crew||[]).forEach(function(c){out.push({to:c,k:'job',t:'Job cancelled',m:when(old)+': '+old.address+'.'});});
    }
  }else if(old&&nw){
    var oc=old.crew||[], nc=nw.crew||[], ch=[];
    if(old.date!==nw.date) ch.push('now on '+when(nw)+' (was '+when(old)+')');
    if(vehOf(old)!==vehOf(nw)) ch.push('lorry is now '+vehOf(nw));
    if(old.address!==nw.address) ch.push('address is now '+nw.address);
    if((old.kind||'')!==(nw.kind||'')&&KINDNAME[nw.kind]) ch.push('now '+(nw.kind==='strike'?'a strike':(nw.kind==='alter'?'an alter':'an erect')));
    if(String(old.what||'')!==String(nw.what||'')&&nw.what) ch.push('the job is now: '+String(nw.what).replace(/[.\s]+$/,''));
    nc.forEach(function(c){
      var was=oc.indexOf(c)>=0, isCh=c===nw.ch, wasCh=c===old.ch;
      if(!was) out.push(isCh?{to:c,k:'job',t:'You’re charge hand',m:chMsg(nw),job:nw.id}:{to:c,k:'job',t:'You’re on a job',m:gangMsg(nw),job:nw.id});
      else if(isCh&&!wasCh) out.push({to:c,k:'job',t:'You’re now charge hand',m:chMsg(nw),job:nw.id});
      else if(ch.length) out.push({to:c,k:'job',t:'Job changed',m:old.address+': '+ch.join('; ')+'.'+(nw.ch!==old.ch?' '+firstOf(nw.ch)+' is charge hand now.':''),job:nw.id});
      else if(nw.ch!==old.ch) out.push({to:c,k:'job',t:'Charge hand changed',m:when(nw)+': '+nw.address+'. '+firstOf(nw.ch)+' is charge hand now.',job:nw.id});
    });
    oc.forEach(function(c){if(nc.indexOf(c)<0)out.push({to:c,k:'job',t:'You’re off a job',m:when(old)+': '+old.address+'.'});});
  }
  return out;
}
function movedAlerts(old){ // a job put back beyond the days the yard and the site staff see
  return (old.crew||[]).map(function(c){return {to:c,k:'job',t:'Job moved',m:fshort(old.date)+': '+old.address+' is not on that day now.'};});
}
function ldAlerts(a,b,changed,noted,again){ // a lorry's load list sent (no a), changed, or called off (no b): the yard hears, and so does the charge hand who checks it. Only for today and the next working day
  var L=b||a, out=[]; if(!L||!inWin(L.date)||(a&&ldStatus(a)==='out')) return out;
  var head=L.vehicle+' for '+fshort(L.date)+': ', yard=yardIds(), chs=[]; (L.jobs||[]).forEach(function(o){if(o.ch&&chs.indexOf(o.ch)<0)chs.push(o.ch);});
  if(!a&&b) return toAll(yard,{k:'load',t:'New load list',m:head+loadWords(b)+'.'+(b.notes?' '+b.notes.replace(/[.\s]+$/,'')+'.':''),ld:b.key});
  if(a&&!b) return toAll(yard.concat(chs),{k:'load',t:'Load list cancelled',m:head+'nothing to load now.'});
  if(changed) return toAll(yard,{k:'load',t:'Load list changed',m:head+loadWords(b)+'.'+(again?' It needs loading again.':''),ld:b.key}).concat(toAll(chs,{k:'load',t:'Load list changed',m:head+loadWords(b)+'.'+(again?' The yard loads it again, then you check it.':''),ld:b.key}));
  if(noted) return toAll(yard.concat(chs),{k:'load',t:'Note on a load list',m:head+(b.notes?b.notes.replace(/[.\s]+$/,''):'note taken off')+'.',ld:b.key});
  return out;
}
function ldWho(L){var j=L.jobs[0]||{};return L.jobs.length>1?', for '+plural(L.jobs.length,'job'):(j.address?': '+j.address:'');}
function loadedAlerts(x){ // the yard has confirmed a lorry's load list: to the charge hand and the boss, with who confirmed it
  var L=listOf(x), chs=[]; L.jobs.forEach(function(o){if(o.ch&&chs.indexOf(o.ch)<0)chs.push(o.ch);});

function doneAlerts(j,at,ph,ex){if(ph==null)ph=photosOf(j.id,'finish').length;if(ex==null)ex=extrasOf(j.id).length;return toBosses({k:'job',t:'Job signed off',m:j.address+'. '+firstOf(j.ch)+'’s gang, '+clock(at)+(ph?', '+plural(ph,'photo'):'')+(ex?', '+plural(ex,'extra'):'')+'.',job:j.id});}
function myAlerts(){var me=myCrew();return !me?[]:Array.from(S.alerts.values()).filter(function(a){return a.to===me&&a.t;}).sort(function(a,b){return (b.at||0)-(a.at||0);});}

function lessonGo(id){ // start a lesson: in the example week, as the right person, on that person's first screen

  if(S.demo.step){demoLook();}

  S.viewAs=who; S.sheet=null; S.lb=null; S.page=null; S.form=null; S.self=null; S.q=''; S.confirm=null; S.fresh=null;
  S.lesson={id:id,i:0,seen:-1,rung:-1,done:false};

function lessonAdvance(){ // before every draw: move past every step that is already done

var FORMS={
  addstaff:async function(){var el=document.getElementById('s-name'),n=(el?el.value:'').trim().replace(/\s+/g,' ');if(!n){toast('Type a name first');return;}if(crewList().some(function(c){return c.name.toLowerCase()===n.toLowerCase();})){toast(n+' is already on the list');return;}try{await S.db.collection('crew').add({name:n,yard:false,at:Date.now()});toast(n+' added');}catch(e){fail(e);}render(true);var e2=document.getElementById('s-name');if(e2)e2.value='';},
  addvan:async function(){var r=document.getElementById('v-reg'),m=document.getElementById('v-name'),reg=(r?r.value:'').trim().toUpperCase().replace(/\s+/g,' '),nm=(m?m.value:'').trim();if(!reg){toast('Type the reg first');return;}if(fleet().some(function(v){return String(v.reg).toUpperCase()===reg;})){toast(reg+' is already on the list');return;}try{await S.db.collection('vehicles').add({reg:reg,name:nm,at:Date.now()});toast(reg+' added');}catch(e){fail(e);}render(true);var r2=document.getElementById('v-reg'),m2=document.getElementById('v-name');if(r2)r2.value='';if(m2)m2.value='';},
  addrkey:function(){var el=document.getElementById('k-in'),v=(el?el.value:'').trim();if(!/^ak_[A-Za-z0-9_]{6,}$/.test(v)){toast('That doesn’t look like a key. It starts ak_');return;}try{localStorage.setItem('fcs-addr-key',v);}catch(_){toast('Couldn’t save it on this phone');return;}toast('Key saved. Tap Test.');render(true);},
  oskey:function(){var el=document.getElementById('ok-in'),v=(el?el.value:'').trim();if(!/^[A-Za-z0-9_\-]{16,80}$/.test(v)){toast('That doesn’t look like an Ordnance Survey key');return;}try{localStorage.setItem('fcs-os-key',v);}catch(_){toast('Couldn’t save it on this phone');return;}toast('Key saved. Tap Test.');render(true);}
};
document.addEventListener('click',function(e){
  var sm=e.target.closest('summary'); if(sm){var dt=sm.parentNode;if(dt.classList.contains('fold'))S.open[dt.dataset.o]=!dt.open;return;}
  if(e.target.closest('label,input,textarea,select')) return;
  var b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  var ae=document.activeElement; if(ae&&ae!==b&&typing()){try{ae.blur();}catch(_){ }}
  var fn=ACT[b.dataset.a]; if(fn){if(b.tagName!=='A')e.preventDefault();fn(b,e);}
});
document.addEventListener('input',function(e){
  var t=e.target, d=t.dataset||{};
  if(t.id==='q'){S.q=t.value;var el=document.getElementById('joblist');if(el){el.innerHTML=isBoss()?doneListHtml():jobListHtml();fillThumbs();}return;}
  if(d.f&&S.form){S.form[d.f]=t.value;S.form.err='';S.deferred=true;if(d.f==='line')suggest(t.value);return;}
  if(d.p&&S.form){S.form.prop[d.p]=t.value;return;}
  if(d.x&&S.form){var q=Math.max(0,Math.min(999,parseInt(t.value,10)||0));if(q)S.form.extra[d.x]=q;else delete S.form.extra[d.x];S.deferred=true;return;}
  if(d.o&&S.sheet&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='date'))){
    S.sheet[d.o]=t.value;
    if(S.sheet.err){S.sheet.err='';var er=document.querySelector('.sheet .err');if(er)er.parentNode.removeChild(er);}
  }
});
document.addEventListener('change',function(e){
  var t=e.target, d=t.dataset||{}, f=S.form;
  if(t.type==='file'){
    var files=Array.prototype.slice.call(t.files||[]).filter(function(x){return !x.type||/^image\//.test(x.type);}); try{t.value='';t.blur();}catch(_){ }
    if(!files.length) return;
    if(d.pick&&S.sheet&&S.sheet.files){files.slice(0,6).forEach(function(x){S.sheet.files.push({f:x,u:URL.createObjectURL(x)});});render(true);}
    else if(d.phAdd&&d.id) savePhotos(files.slice(0,12),{job:d.id,kind:d.phAdd});
    return;
  }
  if(d.wkadd){if(t.value){var wp=t.value;S.db.doc('wknames/'+d.wkadd+'_'+wp).set({date:d.wkadd,person:wp,at:Date.now(),picked:true,byBoss:true,pickedAt:Date.now()}).then(function(){tell([{to:wp,k:'wk',t:'You’re working the weekend',m:bossFirst()+' put you down for '+fshort(d.wkadd)+'.',cal:'wk',day:d.wkadd}]);},fail);}t.blur();return;}
  if(d.sc&&d.id){var v={};v[d.sc]=String(t.value||'').trim();var scd=S.scafs.get(d.id);S.db.doc('scaffolds/'+d.id).update(v).then(function(){toast('Saved');},fail);if(t.tagName==='SELECT')t.blur();return;}
  if(d.ldday){if(t.value)S.bday=t.value;t.blur();render(true);return;}
  if(d.c&&f){
    if(d.c==='date'){if(t.value)f.date=t.value;}
    else if(d.c==='vehicle') f.vehicle=t.value;
    else if(d.c==='ch'){f.ch=t.value;var i=f.gang.indexOf(t.value);if(i>=0)f.gang.splice(i,1);}
    else if(d.c==='gang'&&t.value){if(f.gang.indexOf(t.value)<0)f.gang.push(t.value);}
    if(d.c==='date'){[f.ch].concat(f.gang).forEach(function(id){if(id&&offOn(id,f.date)){toast(nameOf(id)+' is off that day');}});}
    f.err=''; t.blur(); render(true); return;
  }
  if(d.o&&S.sheet){S.sheet[d.o]=t.value;if(d.o==='from'&&(!S.sheet.toSet||!S.sheet.to||S.sheet.to<t.value))S.sheet.to=t.value;if(d.o==='to')S.sheet.toSet=true;if(t.type==='date'||t.tagName==='SELECT'){t.blur();render(true);}}
});
document.addEventListener('submit',function(e){var k=e.target&&e.target.dataset&&e.target.dataset.form;if(k&&FORMS[k]){e.preventDefault();var ae=document.activeElement;if(ae&&ae.blur)ae.blur();FORMS[k]();}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='f-pc'){e.preventDefault();e.target.blur();findPc();}

document.addEventListener('toggle',function(e){var t=e.target;if(!t||!t.classList)return;if(t.classList.contains('grp')&&S.form)S.form.open[t.dataset.g]=t.open;},true);
document.addEventListener('error',function(e){ // a picture tile didn't load: step back a zoom, or give up quietly
  var t=e.target; if(!t||!t.classList||!t.classList.contains('sat-t')) return;
  var z=+t.getAttribute('data-z'); if(z>SAT.ZMIN&&SAT.ZMAX>=z) SAT.ZMAX=z-1; else if(z<=SAT.ZMIN) S.satFail=true; else return;
  render();
},true);
document.addEventListener('focusout',function(e){
  var t=e.target, f=S.form;
  if(t&&t.id==='f-line'&&f){
    if(useRecord(f)) S.deferred=true;
    else if(f.map&&f.map.status==='ok'&&!f.exact){var b=byNumber(f,f.map);if(b){setBuilding(f,b,f.map);S.deferred=true;}}
  }
  setTimeout(function(){if(S.deferred&&!typing())render();},350);
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){checkUpdate(false);clockSoon();dayTick();}});
var dayAt=today(0)+(new Date().getHours()<12?'a':'p');   // the day, and which half of it, the screens were last drawn for
function dayTick(){ // a phone or laptop left open overnight, or over 12 noon, moves on to the right day. A day the boss picked himself is left alone until it has gone
  var now=today(0)+(new Date().getHours()<12?'a':'p'); if(now===dayAt) return;
  var newDay=now.slice(0,10)!==dayAt.slice(0,10); dayAt=now;
  if(S.bday&&(S.bday===S.bdayAuto||(newDay&&S.bday<today(0)))) S.bday=null;
  if(newDay&&S.day&&S.day<today(0)) S.day=null;
  render();
}
setInterval(dayTick,30000);
function backStep(){ // what the phone's Back button does: one step back inside the app. False at the first screen, where Back leaves the app
  if(S.lb){S.lb=null;render(true);return true;}
  if(S.sheet){if(!S.busy){dropSheet();render(true);}return true;}
  if(S.page||moreSub()||(isBoss()&&S.tab==="alerts")){ACT.back();return true;}
  if(S.tab!==homeTab()){S.jview='day';S.lview='day';S.sview='gangs';goTab(homeTab());return true;}
  return false;
}
