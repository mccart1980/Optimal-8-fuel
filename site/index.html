function myNoticeCard(r){
  var rng=esc(fmtRange(r.from,r.to)), t, kind='ok';
  if(r.status==='approved') t=r.bookedByBoss?''+BNc()+' booked you off: '+rng+'.':''+BNc()+' OK’d your days off: '+rng+'.';
  else if(r.status==='declined'){t=''+BNc()+' said no to '+rng+' off. Talk to them if you need it.';kind='short';}
  else{t=''+BNc()+' cancelled your days off: '+rng+'.';kind='warn';}
  return '<div class="banner b-'+kind+' with-act" role="status"><span>'+t+'</span><button class="mini" type="button" data-act="myseen" data-id="'+esc(r.__id)+'">OK</button></div>';
}
function offStrip(){
  var a=offOn(todayStr(0)), b=offOn(todayStr(1));
  if(!a.length&&!b.length) return '';
  var parts=[];
  if(a.length) parts.push('<span><b>Off today:</b> '+esc(listNames(a))+'</span>');
  if(b.length) parts.push('<span><b>Off tomorrow:</b> '+esc(listNames(b))+'</span>');
  return '<button class="strip" type="button" data-act="tab" data-v="cal">'+parts.join('')+'<span class="strip-go">Open the calendar ›</span></button>';
}

/* ---------- views ---------- */
function boardHtml(){
  var n=needs(), h=nameCard()+pageHead('Jobs')+bossTiles(n);
  h+='<button class="btn btn-primary btn-block btn-big" type="button" data-act="new">'+PLUS+'New job</button>';
  if(S.got.crew&&!crewIds().length) h+='<div class="empty"><h2 class="empty-t">Add your crew first</h2><p>Put in everyone’s name once. You’ll pick from them on every job and when booking days off. Everyone has the app, but only the charge hand on each job needs to log on and tick it off.</p><button class="btn btn-primary btn-left" type="button" data-act="tab" data-v="team">Add your crew</button></div>';
  h+=offStrip();
  if(n.acts){
    h+='<section class="sec"><div class="sec-h"><h2>Needs you</h2><span class="count">'+n.acts+'</span></div><div class="cards">'+
      n.pend.map(reqCard).join('')+n.ysh.map(yshortCard).join('')+n.clash.map(clashCard).join('')+n.xtra.map(xtraCard).join('')+n.notes.map(noticeCard).join('')+'</div>'+
      (n.notes.length>1?'<button class="btn btn-ghost" type="button" data-act="seenall">Mark all as seen</button>':'')+'</section>';
  }
  if(n.ready.length){
    var full=n.ready.filter(function(j){return !tally(j).c.short;});
    h+='<section class="sec"><div class="sec-h"><h2>Ready to sign off</h2><span class="count">'+n.ready.length+'</span></div><p class="hint">Finished by the charge hand, with photos. Tap a job to see them.</p>'+
      (full.length>1?'<button class="btn btn-ok btn-block" type="button" data-act="signall"'+(S.busy?' disabled':'')+'>Sign off all '+full.length+' with nothing short</button>':'')+
      '<div class="cards">'+n.ready.map(function(j){return cardHtml(j,{sign:true});}).join('')+'</div></section>';
  }
  var wait=[],done=[];
  S.jobs.forEach(function(j){var st=tally(j).st;if(st==='done')done.push(j);else if(st!=='finished')wait.push(j);});
  done.sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  h+=daySecs(wait,{});
  if(!S.jobs.size){
    h+='<div class="empty"><h2 class="empty-t">No jobs yet</h2><p>Tap <b>New job</b>. Pick the date, van, load and crew, then put numbers against what needs to go on. The yard ticks it off when it’s loaded, the charge hand checks it in the morning, logs the time they leave the yard and takes photos when the job’s done. You sign it off here.</p>'+
      '<span class="eyebrow">Example</span><div class="job example" aria-hidden="true"><div class="job-main"><span class="job-top"><span class="date">Tomorrow</span><span class="pill p-loaded">Loaded</span></span><span class="site">Example site, front elevation</span><span class="meta"><span class="plate">AB12 CDE</span><span class="load">'+meter(4)+'Full load</span><span class="jtype">Erect</span></span><span class="crew-txt">Charge hand + 2</span><span class="track"><span class="tk tk-done"><i>'+TICK+'</i><span class="tk-l"><span>Yard</span></span></span><span class="tk tk-todo"><i></i><span class="tk-l"><span>Checked</span></span></span><span class="tk tk-todo"><i></i><span class="tk-l"><span>Photos</span></span></span><span class="tk tk-todo"><i></i><span class="tk-l"><span>Boss</span></span></span></span></div></div></div>';
  }else if(!wait.length&&!n.ready.length){
    h+='<p class="muted">No open jobs. Everything is signed off.</p>';
  }
  if(done.length) h+=doneSec(done,'board');
  return h;
}

function totalsHtml(){
  var t=todayStr(0), tm=todayStr(1), open=openJobs();
  var d=S.totDay||(open.some(function(j){return j.date===tm;})?tm:t);
  var js=open.filter(function(j){return j.date===d;});
  var sums={}, keys=[], ticks={};
  js.forEach(function(j){normItems(j).forEach(function(it){
    if(isFixed(it)) return;
    if(it.kind==='tick'){ticks[it.id]=1;return;}
    var k=CAT[it.id]?it.id:'x:'+String(it.name).toLowerCase();
    if(!sums[k]){sums[k]={name:it.name,q:0};keys.push(k);}
    sums[k].q+=it.qty||0;
  });});
  keys.sort(function(a,b){return (ORDER[a]!=null?ORDER[a]:999)-(ORDER[b]!=null?ORDER[b]:999)||sums[a].name.localeCompare(sums[b].name);});
  var h='<section class="panel"><div class="sec-h"><h2 class="list-t">Totals</h2><div class="chips">'+
    [[t,'Today'],[tm,'Tomorrow']].map(function(x){return '<button type="button" class="seg" data-act="totday" data-d="'+x[0]+'" aria-pressed="'+(d===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  if(!js.length) return h+'<p class="hint">No loads going out '+(d===t?'today':'tomorrow')+'.</p></section>';
  h+='<p class="hint">'+plural(js.length,'load')+' going out '+(d===t?'today':'tomorrow')+'. Use this to check you’ve got enough in the yard.</p>';
  if(keys.length) h+='<div class="tot">'+keys.map(function(k){return '<div class="tot-r"><span>'+esc(sums[k].name)+'</span><b>'+sums[k].q+'</b></div>';}).join('')+'</div>';
  TICKS.forEach(function(g){var on=g.items.filter(function(x){return ticks[x[0]];}).map(function(x){return x[1];});if(on.length)h+='<p class="hint"><b>'+g.g+':</b> '+esc(on.join(', '))+'</p>';});
  var fv=Object.keys(ticks).filter(function(id){return CAT[id]&&CAT[id].forgot;}).sort(function(a,b){return ORDER[a]-ORDER[b];}).map(function(id){return CAT[id].name;});
  if(fv.length) h+='<p class="hint"><b>Also going out:</b> '+esc(fv.join(', '))+'</p>';
  return h+'</section>';
}
function yardHtml(){
  var h=nameCard()+pageHead('Yard'), open=openJobs(), todo=[], loaded=[];
  open.forEach(function(j){(tally(j).y.confirmed?loaded:todo).push(j);});
  if(!open.length) return h+'<div class="empty"><h2 class="empty-t">Nothing to load</h2><p>When '+BN()+' sends out a job it shows up here with the van, the load and the list to put on.</p></div>';
  h+=totalsHtml();
  if(todo.length) h+=daySecs(todo,{mode:'yard'});
  else h+='<p class="muted">Everything sent out has been loaded.</p>';
  if(loaded.length){
    loaded.sort(byDate);
    h+='<section class="sec"><div class="sec-h"><h2>Loaded</h2><span class="count">'+loaded.length+'</span></div>'+
      (S.showLoaded?'<div class="cards">'+loaded.map(function(j){return cardHtml(j,{mode:'yard'});}).join('')+'</div>':'')+
      '<button class="btn btn-ghost" type="button" data-act="toggleloaded">'+(S.showLoaded?'Hide loaded vans':'Show loaded vans')+'</button></section>';
  }
  return h;
}

function mineHtml(){
  var h=nameCard(), mc=myCrew();
  if(!S.me) return h+notice('Sign in to see your loads','Open the app link while you are signed in to Claude, so it knows who you are.');
  if(!mc) return h+(h?'':'<p class="muted">You’re not on the crew list, so no loads are assigned to you.</p>');
  h+=pageHead('My jobs');
  h+=myNotices().map(myNoticeCard).join('');
  if(offFor(mc,todayStr(0))) h+=banner('info','You’re booked off today.');
  if(S.canData===false) h+=banner('info',"You can see your loads but can’t tick them off yet. Ask whoever set up the app to share it with you with edit access.");
  var mine=Array.from(S.jobs.values()).filter(function(j){return (j.crew||[]).indexOf(mc)>=0;});
  var open=mine.filter(function(j){return j.status!=='done';});
  var done=mine.filter(function(j){return j.status==='done';}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  if(!mine.length) return h+'<div class="empty"><h2 class="empty-t">Nothing assigned to you yet</h2><p>When '+BN()+' puts you on a job it shows up here: the site, the van, who’s with you and the load sheet. If you’re charge hand, you do the morning check from here.</p><p>Need time off? Tap <b>Days off</b> below.</p></div>';
  if(open.length) h+=daySecs(open,{mine:true,mode:'crew'});
  else h+='<p class="muted">No open loads. You’re all done.</p>';
  if(done.length) h+=doneSec(done,'mine');
  return h;
}

/* ---------- job page ---------- */
function rowEdit(it,stage,c,yc){
  var v=valOf(c,it), s=itemState(it,v), n=esc(it.name), id=esc(it.id), sd=' data-s="'+stage+'" data-id="'+id+'"';
  var yh='';
  if(stage==='crew'){var yv=valOf(yc,it);yh='<span class="yh">Yard: '+(yv==null?'not ticked':(it.kind==='tick'?(yv?'on':'not on'):yv))+'</span> · ';}
  if(it.kind==='tick'){
    return '<div class="item '+s.cls+'" id="row-'+stage+'-'+id+'">'+
      '<button type="button" class="tick" data-act="ck"'+sd+' aria-pressed="'+(v===true)+'" aria-label="'+n+' on board">'+(v===false?CROSS:TICK)+'</button>'+
      '<div class="item-main"><div class="item-name">'+n+'</div><div class="item-need">'+yh+'<span class="item-st">'+s.txt+'</span></div></div>'+
      '<button type="button" class="miss" data-act="cmiss"'+sd+' aria-pressed="'+(v===false)+'">Not on</button></div>';
  }
  return '<div class="item '+s.cls+'" id="row-'+stage+'-'+id+'">'+
    '<button type="button" class="tick" data-act="ck"'+sd+' aria-label="'+(v==null?'All '+it.qty+' '+n+' on board':'Untick '+n)+'">'+(s.cls==='is-short'?MINUS:TICK)+'</button>'+
    '<div class="item-main"><div class="item-name">'+n+'</div><div class="item-need">Need <b class="num">'+it.qty+'</b> · '+yh+'<span class="item-st">'+s.txt+'</span></div></div>'+
    '<div class="stepper" role="group" aria-label="How many '+n+' on board">'+
      '<button type="button" data-act="cdec"'+sd+' aria-label="One less">−</button>'+
      '<input id="have-'+stage+'-'+id+'" data-have="'+id+'" data-s="'+stage+'" type="number" inputmode="numeric" min="0" value="'+(v==null?'':v)+'" placeholder="–" aria-label="'+n+' on board">'+
      '<button type="button" data-act="cinc"'+sd+' aria-label="One more">+</button>'+
    '</div></div>';
}
function tickChip(it,stage,c,yc){
  var v=valOf(c,it), lab=CAT[it.id]?CAT[it.id].short:it.name, yv=stage==='crew'?valOf(yc,it):null;
  var st=v===true?' on':(v===false?' off':'');
  return '<button type="button" class="tk-chip'+st+'" id="row-'+stage+'-'+esc(it.id)+'" data-act="tcycle" data-s="'+stage+'" data-id="'+esc(it.id)+'" aria-label="'+esc(it.name)+': '+(v===true?'on':(v===false?'not on':'not checked'))+(yv===false?', yard said not on':'')+'">'+(v===true?TICK:(v===false?CROSS:''))+esc(lab)+(yv===false?' <small>yard: not on</small>':'')+'</button>';
}
function mark(lab,it,v){
  var s=itemState(it,v), txt=v==null?'–':(it.kind==='tick'?(v?'✓':'✗'):String(v));
  return '<span class="mk '+s.cls+'"><span>'+lab+'</span><b>'+txt+'</b></span>';
}
function rowRO(it,yc,cc){
  return '<div class="item ro"><div class="item-main"><div class="item-name">'+esc(it.name)+'</div><div class="item-need">'+(it.kind==='tick'?'Needed':'Need <b class="num">'+it.qty+'</b>')+'</div></div>'+
    '<div class="marks">'+mark('Yard',it,valOf(yc,it))+mark('Morning',it,valOf(cc,it))+'</div></div>';
}
function sheetHtml(job,t,mode,editing){
  var items=t.items, ticks=items.filter(isStd), fixed=items.filter(isFixed), counts=items.filter(function(i){return !isStd(i)&&!isFixed(i);});
  var st=mode==='yard'?t.y:t.c, cur=st.c, yc=t.y.c, cc=t.c.c;
  var h='<section class="list" aria-label="Load sheet"><div class="list-h"><h2 class="list-t">Load sheet</h2>'+(editing?'<span class="count" id="chk-count">'+st.checked+' of '+st.total+' checked</span>':'')+'</div>';
  if(editing&&st.total) h+='<div class="prog prog-flat" aria-hidden="true"><span id="chk-bar" style="width:'+pct(st.checked,st.total)+'%"></span></div>';
  if(!items.length) h+='<p class="pad muted">Nothing on the load sheet.'+(job.load==='empty'?' The van goes out empty.':'')+'</p>';
  var row=function(it){return editing?rowEdit(it,mode,cur,yc):rowRO(it,yc,cc);};
  if(editing){
    var todo=items.filter(function(it){return valOf(cur,it)==null;});
    var tc=todo.filter(function(it){return !isStd(it);}).concat(todo.filter(isStd));
    if(tc.length) h+='<div class="todo"><span class="eyebrow">Still to tick · tap one to find it</span><div class="chips">'+tc.slice(0,16).map(function(it){
      return '<button type="button" class="todo-chip'+(!isStd(it)?' hot':'')+'" data-act="jump" data-s="'+mode+'" data-id="'+esc(it.id)+'">'+esc(it.name)+(it.kind!=='tick'?' <b class="num">'+it.qty+'</b>':'')+'</button>';
    }).join('')+(tc.length>16?'<span class="hint">+'+(tc.length-16)+' more</span>':'')+'</div></div>';
    else if(items.length) h+='<div class="todo done-all">'+TICK+'Everything ticked</div>';
  }
  if(counts.length) h+='<div class="sub-h hot">Easily forgotten'+(editing?' · tick every one':'')+'</div>'+counts.map(row).join('');
  if(fixed.length){
    if(editing) h+='<div class="sub-h hot">Always on the van · check every one</div><div class="tgrid"><div class="chips">'+fixed.map(function(it){return tickChip(it,mode,cur,yc);}).join('')+'</div><p class="hint">Look at each one. Tap once if it’s on, tap again if it’s not.</p></div>';
    else h+='<div class="sub-h">Always on the van</div>'+fixed.map(row).join('');
  }
  if(ticks.length){
    if(editing){
      var anyOpen=ticks.some(function(it){return valOf(cur,it)==null;});
      h+='<div class="sub-h sub-act"><span>Tube, boards and fittings</span>'+(anyOpen?'<button type="button" class="mini" data-act="allon" data-s="'+mode+'">All on</button>':'')+'</div><div class="tgrid">';
      TICKS.forEach(function(g){var its=ticks.filter(function(it){return CAT[it.id]&&CAT[it.id].g===g.g;});if(its.length)h+='<div class="qgroup"><span class="eyebrow">'+g.g+'</span><div class="chips">'+its.map(function(it){return tickChip(it,mode,cur,yc);}).join('')+'</div></div>';});
      var odd=ticks.filter(function(it){return !CAT[it.id];});
      if(odd.length) h+='<div class="chips">'+odd.map(function(it){return tickChip(it,mode,cur,yc);}).join('')+'</div>';
      h+='<p class="hint">Tap once if it’s on. Tap again if it’s not on.</p></div>';
    }else h+='<div class="sub-h">Tube, boards and fittings</div>'+ticks.map(row).join('');
  }
  return h+'</section>';
}
function safetyHtml(c,editing){
  return '<section class="list" aria-label="Before you drive off"><div class="sub-h">Before you drive off</div>'+SAFETY.map(function(s){
    var on=!!(c.safety&&c.safety[s[0]]);
    if(!editing) return '<div class="item ro'+(on?' is-ok':'')+'"><div class="item-main"><div class="item-name">'+esc(s[1])+'</div></div><span class="item-st">'+(on?'✓ Done':'Not ticked')+'</span></div>';
    return '<div class="item'+(on?' is-ok':'')+'" id="safe-'+s[0]+'"><button type="button" class="tick" data-act="csafe" data-id="'+s[0]+'" aria-pressed="'+on+'" aria-label="'+esc(s[1])+'">'+TICK+'</button><div class="item-main"><div class="item-name">'+esc(s[1])+'</div></div></div>';
  }).join('')+'</section>';
}
function bannersHtml(job,t,o){
  var out=[];
  if(!o.done){
    var cl=jobClashes(job);
    if(cl.length&&o.boss) out.push(banner('short',esc(listNames(cl))+(cl.length>1?' are':' is')+' off on this day. Tap <b>Edit job</b> to change the crew.'));
    else if(myCrew()&&cl.indexOf(myCrew())>=0) out.push(banner('info','You’re booked off this day. '+BNc()+' needs to change the crew.'));
  }
  if(o.done){
    out.push(banner('ok','Signed off as done by '+esc(nameOf(job.doneBy))+(job.doneAt?' at '+esc(fmtWhen(job.doneAt)):'')+'.'));
  }else{
    var sl=t.c.confirmed?shortList(t.c):(t.y.confirmed?shortList(t.y):[]);
    if(sl.length) out.push(banner('short',(t.c.confirmed?'Morning check':'Yard')+' found '+plural(sl.length,'item')+' short:<ul>'+sl.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'));
    else if(t.c.confirmed) out.push(banner('ok','Morning check done by '+esc(nameOf(t.c.c.confirmedBy))+'. Everything is on the van.'));
  }
  if(!o.done&&o.mode){
    var base=stageStore(o.mode).get(job.__id);
    if(job.editedAt&&base&&base.updatedAt&&job.editedAt>base.updatedAt) out.push(banner('warn',''+BNc()+' changed this load at '+esc(fmtWhen(job.editedAt))+'. Go through the list again.'));
    if(o.mode==='crew'&&!t.y.confirmed) out.push(banner('info','The yard hasn’t confirmed this load yet. Check what’s actually on the van.'));
  }
  if(!o.done&&o.isCrew&&!o.isCH&&job.chargeHand) out.push(banner('info',esc(nameOf(job.chargeHand))+' is charge hand on this load and does the morning check.'));
  if(!o.writable&&(o.isCH||isYard())&&!o.done) out.push(banner('info',"You can see this load but can’t tick it off yet. Ask whoever set up the app to share it with you with edit access."));
  return out.join('');
}
function phaseHtml(job,t,o){
  var crew=o.mode==='crew'&&o.canC;
  if(!t.leftAt&&!t.finAt) return (crew&&t.c.confirmed)?banner('ok','Morning check done. Tap <b>Leaving the yard now</b> when you drive off, so '+BN()+' can see the time.'):'';
  var ld=t.leftAt?dayKey(new Date(t.leftAt)):'';
  var h='<section class="panel times-panel"><div class="times"><span>Left the yard</span><b>'+(t.leftAt?fmtClock(t.leftAt):'–')+'</b>'+(ld&&ld!==job.date?'<small>'+esc(fmtShort(ld))+'</small>':'')+(t.c.leftBy?'<small>'+esc(nameOf(t.c.leftBy))+'</small>':'')+'</div>'+
    '<div class="times"><span>Finished</span><b>'+(t.finAt?fmtClock(t.finAt):'–')+'</b>'+(t.c.finishedBy?'<small>'+esc(nameOf(t.c.finishedBy))+'</small>':'')+'</div>';
  if(crew&&!o.done){
    if(S.editLeft) h+='<div class="row-l span2"><label class="label" for="left-time">Left the yard at</label><input id="left-time" class="input input-date" type="time" data-lt="1" value="'+fmtClock(t.leftAt)+'"></div>';
    else if(t.leftAt||t.finAt) h+='<div class="row-l span2">'+(t.leftAt?'<button class="mini" type="button" data-act="editleft">Change the time</button>':'')+(t.finAt?'<button class="mini" type="button" data-act="unfinish">Not finished yet</button>':'')+'</div>';
  }
  return h+'</section>';
}
function photosHtml(job,t,o){
  var list=photoList(job.__id), canC=o.canC, boss=o.boss;
  if(!(list.length||(canC&&t.leftAt&&!o.done)||(boss&&t.leftAt))) return '';
  var canAdd=!!S.assets&&(canC||boss);
  var h='<section class="list" aria-label="Photos"><div class="list-h"><h2 class="list-t">Photos</h2><span class="count">'+plural(list.length,'photo')+'</span></div><div class="pad photos">';
  if(canC&&!t.finAt&&!o.done) h+='<p class="hint">When the job’s done, get every side, the ties, the base and the tag. They save to this job so they can be found later.</p>';
  if(list.length) h+='<div class="thumbs">'+list.map(function(p,i){return '<button type="button" class="thumb" data-act="lbopen" data-i="'+i+'" aria-label="Photo '+(i+1)+', '+esc(nameOf(p.by))+', '+esc(fmtWhen(p.at))+'"><img src="'+photoSrc(p.id)+'" alt="" loading="lazy" data-ph="1"></button>';}).join('')+'</div>';
  else h+='<p class="muted" style="margin:0">No photos yet.</p>';
  if(S.uploading) h+='<p class="warn-txt" role="status">Saving photo '+S.uploading.n+' of '+S.uploading.total+'… keep the app open.</p>';
  else if(canAdd) h+='<div class="photo-btns"><input class="vh" id="ph-cam" type="file" accept="image/*" capture="environment" data-photo="1"><label class="btn btn-primary" for="ph-cam">'+CAM+'Take photo</label><input class="vh" id="ph-lib" type="file" accept="image/*" multiple data-photo="1"><label class="btn" for="ph-lib">Choose from photos</label></div>';
  else if(canC||boss) h+='<p class="hint">Photos can’t be added from this login. Ask whoever set up the app to share it with you as an Editor.</p>';
  return h+'</div></section>';
}
function lbHtml(){
  if(S.lb.single) return '<div class="lb" role="dialog" aria-modal="true" aria-label="Photo"><div class="lb-top"><span>'+esc(S.lb.cap||'')+'</span><button type="button" class="mini" data-act="lbclose">Close</button></div><div class="lb-img"><img src="'+photoSrc(S.lb.single)+'" alt="Photo" data-ph="1"></div></div>';

function shrink(file){
  return new Promise(function(resolve){
    var url; try{url=URL.createObjectURL(file);}catch(_){resolve(file);return;}
    var img=new Image();
    img.onload=function(){
      try{
        var max=2000, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){URL.revokeObjectURL(url);resolve(b&&b.size?b:file);},'image/jpeg',0.82);
      }catch(_){URL.revokeObjectURL(url);resolve(file);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(file);};
    img.src=url;
  });
}
function photoErr(e){
  var c=e&&e.code;
  if(c==='too_large') return 'That photo is too big to save. Take it again with the Take photo button.';
  if(c==='unsupported_type') return 'That photo type can’t be saved. Use the Take photo button instead.';
  if(c==='quota_or_state') return 'The app’s photo storage is full. Tell whoever set up the app.';
  if(c==='rate_limited') return 'Too many photos at once. Wait a minute and try again.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed') return 'Photos can’t be added from this login. Ask to be shared the app as an Editor.';
  if(c==='invalid_argument'||c==='quota_exceeded'||c==='revoked') return errMsg(e);
  return 'Photo not saved. Check your signal and try again.';
}

function fStepper(kind,id,val,label){

  return '<div class="stepper" role="group" aria-label="How many '+l+'"><button type="button" data-act="'+kind+'-dec" data-id="'+e+'" aria-label="One less">−</button>'+
    '<input id="'+kind+'-'+e+'" data-'+kind+'="'+e+'" type="number" inputmode="numeric" min="0" value="'+esc(val||'')+'" placeholder="–" aria-label="How many '+l+'">'+
    '<button type="button" data-act="'+kind+'-inc" data-id="'+e+'" aria-label="One more">+</button></div>';
}
function fRow(f,x){
  if(CAT[x[0]].kind!=='tick') return cRow(x[0],x[1],f.counts[x[0]]);
  var on=!!f.ticks[x[0]];
  return '<div class="crow'+(on?' has':'')+'"><span class="crow-n">'+esc(x[1])+'</span><button type="button" class="fbox" data-act="f-tick" data-id="'+x[0]+'" aria-pressed="'+on+'" aria-label="'+esc(x[1])+(on?', needed':', not needed')+'">'+(on?TICK:'')+'</button></div>';
}
function cRow(id,name,val){return '<div class="crow'+(parseInt(val,10)>0?' has':'')+'"><span class="crow-n">'+esc(name)+'</span>'+fStepper('fc',id,val,name)+'</div>';}

    var warns=[];

  var kits=Array.from(S.kits.values()).sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));});

    }).join('')+'</div><button type="button" class="btn btn-ghost btn-left" data-act="k-manage">'+(f.kitManage?'Done removing':'Remove a saved sheet')+'</button></div>';
  }
  h+='<p class="hint">Tick the tube, boards and fittings going on. Put a number against the rest. Leave it blank if it’s not needed.</p>';
  h+='<p class="hint"><b>No need to add:</b> '+esc(FIXED.map(function(x){return x[1];}).join(', '))+'. They’re on every van and get checked every morning.</p>';
  TICKS.forEach(function(g){
    h+='<div class="qgroup"><span class="eyebrow">'+g.g+'</span><div class="chips">'+g.items.map(function(x){var on=!!f.ticks[x[0]];return '<button type="button" class="tchip" data-act="f-tick" data-id="'+x[0]+'" aria-pressed="'+on+'">'+(on?TICK:'')+esc(x[1])+'</button>';}).join('')+'</div></div>';

  h+='<div class="qgroup"><label class="eyebrow" for="f-custom">Something else</label><div class="row"><input id="f-custom" class="input" value="'+esc(f.custom)+'" placeholder="e.g. Loading bay" autocomplete="off"><button type="button" class="btn" data-act="f-add">Add</button></div></div>';
  if(f.kitSave) h+='<div class="row"><input id="k-name" class="input" data-f="kitName" value="'+esc(f.kitName)+'" placeholder="Name it, e.g. House front, 2 lifts" autocomplete="off" aria-label="Name for this load sheet"><button type="button" class="btn btn-primary" data-act="k-save">Save</button></div>';
  else h+='<button type="button" class="btn btn-left" data-act="k-savebtn">Save this load sheet for next time</button>';

  h+='<h2 class="form-h">Notes</h2>';
  h+='<div class="field"><label class="label" for="f-notes">Notes for the crew <span class="opt">(optional)</span></label><textarea id="f-notes" class="input" rows="3" data-f="notes" placeholder="Access, parking, who to ask for on site">'+esc(f.notes)+'</textarea></div>';
  if(f.err) h+='<div class="banner b-short" role="alert" id="f-err">'+esc(f.err)+'</div>';
  var chn=f.crew.indexOf(f.chargeHand)>=0?f.chargeHand:autoCH(f.crew), sb=[];
  sb.push('<b>'+esc(f.date?fmtDate(f.date):'No date')+'</b>');
  if(f.vehicle) sb.push(esc(String(f.vehicle).toUpperCase()));
  if(LOADMAP[f.load]) sb.push(esc(LOADMAP[f.load].label));
  sb.push(f.crew.length?(chn?esc(nameOf(chn))+(f.crew.length>1?' + '+(f.crew.length-1):''):plural(f.crew.length,'man')):'No crew yet');
  sb.push(plural(buildItems(f).length,'item'));
  h+='<div class="actions"><div class="send-sum">'+sb.join('<span aria-hidden="true">·</span>')+'</div><button type="button" class="btn btn-primary btn-block btn-big" data-act="save"'+(S.saving?' disabled':'')+'>'+(S.saving?'':IC.send)+(S.saving?'Sending…':(f.id?'Save changes':'Send to yard and crew'))+'</button><button type="button" class="btn btn-ghost" data-act="back">Cancel</button></div>';
  return h;
}

/* ---------- vehicles ---------- */
function fleet(){return Array.from(S.vans.values()).filter(function(v){return !v.removed&&v.reg;}).sort(function(a,b){return String(a.reg).localeCompare(String(b.reg));});}
function vanName(reg){var r=String(reg||'').trim().toUpperCase(),n='';S.vans.forEach(function(v){if(!v.removed&&String(v.reg||'').toUpperCase()===r&&v.name)n=v.name;});return n;}
async function addVan(){
  var r=document.getElementById('van-reg'), m=document.getElementById('van-name');
  var reg=(r?r.value:'').trim().toUpperCase().replace(/\s+/g,' ').slice(0,12), nm=(m?m.value:'').trim().slice(0,30);
  if(!reg){toast('Type the reg first');return;}
  if(fleet().some(function(v){return String(v.reg).toUpperCase()===reg;})){toast(reg+' is already on the list');return;}
  try{await S.db.collection('vehicles').add({reg:reg,name:nm,createdAt:Date.now(),createdBy:S.me});if(r)r.value='';if(m)m.value='';toast(reg+' added');}catch(e){toast(errMsg(e));}
  render(true);
}
function setCH(id){
  var f=S.form, old=f.chargeHand;
  if(id&&f.date&&offFor(id,f.date)){toast(nameOf(id)+' is off that day.');return;}
  if(old&&old!==id){var i=f.crew.indexOf(old);if(i>=0)f.crew.splice(i,1);}
  f.chargeHand=id||null; f.chExplicit=!!id;
  if(id&&f.crew.indexOf(id)<0) f.crew.unshift(id);
}
function addGang(id){
  var f=S.form; if(!id||f.crew.indexOf(id)>=0) return;
  if(f.date&&offFor(id,f.date)){toast(nameOf(id)+' is off that day.');return;}
  f.crew.push(id);
}

/* ---------- address: postcode list and type-ahead ---------- */
var OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
var STREET_T={motorway:0,trunk:1,primary:1,secondary:1,tertiary:1,unclassified:1,residential:1,living_street:1,road:1,pedestrian:1};
function normPc(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fmtPc(n){n=normPc(n);return n.length>3?n.slice(0,-3)+' '+n.slice(-3):n;}
function cleanArea(v){return v?String(v).replace(/,?\s*unparished area$/i,''):'';}
function getJSON(url,ms){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null, tm=setTimeout(function(){if(ctl)ctl.abort();},ms||12000);
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(tm);if(!r.ok){var e=new Error('http '+r.status);e.status=r.status;throw e;}return r.json();},function(e){clearTimeout(tm);throw e;});
}
async function overpass(q){var last;for(var i=0;i<OVERPASS.length;i++){try{return await getJSON(OVERPASS[i]+'?data='+encodeURIComponent(q),16000);}catch(e){last=e;}}throw last;}
async function pcFind(){
  var f=S.form; if(!f) return; var raw=normPc(f.pc);
  if(raw.length<5||raw.length>7){toast('Type the whole postcode, e.g. SS6 7AA');return;}
  f.pcRes={status:'busy',pc:fmtPc(raw)}; render(true);
  var res;
  try{
    var js=null;
    try{js=await getJSON('https://api.postcodes.io/postcodes/'+raw,10000);}catch(e){if(!(e&&e.status===404))throw e;}
    var p=js&&js.result;
    if(!p||p.latitude==null){res={status:'nf',pc:fmtPc(raw)};}
    else{
      var ov=null;
      try{ov=await overpass('[out:json][timeout:20];nwr["addr:housenumber"](around:180,'+p.latitude+','+p.longitude+');out center 400;way["highway"]["name"](around:130,'+p.latitude+','+p.longitude+');out tags;');}catch(e){ov=null;}
      res=buildPc(ov,p.postcode||fmtPc(raw),p);
    }
  }catch(e){res={status:'err',pc:fmtPc(raw)};}
  if(S.form!==f) return;
  f.pcRes=res; render();
  if(res.status==='nf'||res.status==='err'||(res.status==='ok'&&!res.list.length&&!res.streets.length)){var el=document.getElementById('f-address');if(el)el.focus();}
}
function buildPc(ov,pc,p){
  var np=normPc(pc), els=(ov&&ov.elements)||[], addrs=[], streets=[], towns={};
  els.forEach(function(e){var t=e.tags||{};
    if(t['addr:housenumber']){var c=t['addr:city']||t['addr:town']||t['addr:village'];if(c)towns[c]=(towns[c]||0)+1;addrs.push(Object.assign({_lat:e.lat!=null?e.lat:(e.center&&e.center.lat),_lon:e.lon!=null?e.lon:(e.center&&e.center.lon)},t));}
    else if(t.highway&&t.name&&STREET_T[t.highway]&&streets.indexOf(t.name)<0) streets.push(t.name);
  });
  var town=Object.keys(towns).sort(function(a,b){return towns[b]-towns[a];})[0]||cleanArea(p&&p.parish)||(p&&p.admin_district)||'';
  var exact=addrs.filter(function(t){return normPc(t['addr:postcode'])===np;}), exSt={};
  exact.forEach(function(t){var x=t['addr:street']||t['addr:place'];if(x)exSt[x]=1;});
  var pick=exact.concat(addrs.filter(function(t){return !t['addr:postcode']&&exSt[t['addr:street']||t['addr:place']];})), near=false;
  if(!pick.length){pick=addrs.filter(function(t){var tp=normPc(t['addr:postcode']);return !tp||tp.slice(0,-2)===np.slice(0,-2);});near=pick.length>0;}
  var seen={}, list=[];
  pick.forEach(function(t){
    var st=t['addr:street']||t['addr:place']||''; if(!st) return;
    var hn=t['addr:housename']||(t.name&&!/^\d/.test(t.name)?t.name:''), first=t['addr:housenumber']+' '+st, label=(hn&&hn!==st?hn+', ':'')+first;
    if(seen[label]) return; seen[label]=1;
    var tw=t['addr:city']||t['addr:town']||t['addr:village']||town, tpc=t['addr:postcode']?fmtPc(t['addr:postcode']):pc;
    list.push({label:label,full:label+', '+(tw?tw+' ':'')+tpc,st:st,n:parseInt(t['addr:housenumber'],10)||0,hn:String(t['addr:housenumber']),lat:t._lat==null?null:t._lat,lon:t._lon==null?null:t._lon});
  });
  list.sort(function(a,b){return (exSt[b.st]?1:0)-(exSt[a.st]?1:0)||a.st.localeCompare(b.st)||a.n-b.n||a.hn.localeCompare(b.hn);});
  streets.sort(function(a,b){return (exSt[b]?1:0)-(exSt[a]?1:0)||a.localeCompare(b);});
  return {status:'ok',pc:pc,list:list.slice(0,150),streets:streets.slice(0,8),town:town,near:near,ovFail:!ov};
}
function addrHtml(f){
  var r=f.pcRes||null, busy=!!r&&r.status==='busy', h='<div class="field"><label class="label" for="f-pc">Address</label>';
  h+='<div class="row pc-row"><input id="f-pc" class="input pc-in" data-f="pc" value="'+esc(f.pc||'')+'" placeholder="Postcode" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search" aria-label="Postcode"><button class="btn btn-primary" type="button" data-act="pcfind"'+(busy?' disabled':'')+'>'+(busy?'Finding…':'Find')+'</button></div>';
  if(r&&!r.collapsed&&!busy){
    var sb=function(){return '<div class="chips">'+r.streets.map(function(x,i){return '<button type="button" class="seg" data-act="pcstreet" data-i="'+i+'">'+esc(x)+'</button>';}).join('')+'</div>';};
    if(r.status==='ok'&&r.list.length){
      h+='<p class="hint">Tap the address'+(r.near?'. These are the houses near '+esc(r.pc)+'.':' in '+esc(r.pc)+'.')+'</p><div class="addr-list">'+r.list.map(function(a,i){return '<button type="button" class="addr-pick" data-act="pcpick" data-i="'+i+'">'+esc(a.label)+'</button>';}).join('')+'</div>';
      if(r.streets.length) h+='<p class="hint">Not there? Tap the road, then put the house number in front.</p>'+sb();
    }else if(r.status==='ok'&&r.streets.length) h+='<p class="hint">Found '+esc(r.pc)+' but not the house numbers. Tap the road, then put the number in front.</p>'+sb();
    else if(r.status==='ok') h+='<p class="hint">'+(r.ovFail?'Couldn’t get the houses for '+esc(r.pc)+' right now.':'Found '+esc(r.pc)+' but not the houses in it.')+' Start typing the address below.</p>';
    else if(r.status==='nf') h+='<p class="hint warn-txt">Can’t find '+esc(r.pc)+'. Check it, or start typing the address below.</p>';

    s+='<line class="pl-gap" x1="'+q[0][0]+'" y1="'+q[0][1]+'" x2="'+q[1][0]+'" y2="'+q[1][1]+'" vector-effect="non-scaling-stroke"/><text class="pl-t pl-gt" x="'+mx.toFixed(2)+'" y="'+(my-fs*0.6).toFixed(2)+'" font-size="'+fs.toFixed(2)+'" stroke-width="'+(fs*0.3).toFixed(2)+'" text-anchor="middle">'+g.d+'m</text>';});

function yearDate(v){var d=new Date(String(v).slice(0,10)+'T12:00:00');return isNaN(d)?String(v):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}

  if(sv.form==='mid'&&!sv.rear) f.push(['warn','Joined on both sides and nothing found behind. You may have to go through the house to get to the back.']);

  S.people.forEach(function(_,id){ids[id]=1;});
  S.jobs.forEach(function(j){(j.crew||[]).forEach(function(i){ids[i]=1;}); if(j.doneBy) ids[j.doneBy]=1;});
  [S.checks,S.ychecks].forEach(function(m){m.forEach(function(c){[c.confirmedBy,c.updatedBy,c.leftBy,c.finishedBy].forEach(function(i){if(i)ids[i]=1;});});});

  S.daysoff.forEach(function(r){[r.person,r.requestedBy,r.decidedBy,r.cancelledBy].forEach(function(i){if(i)ids[i]=1;});});

  else if(offP.length) f.err=listNames(offP)+(offP.length>1?' are':' is')+' off on '+fmtShort(f.date)+'. Take them off the crew to save.';

      await S.db.doc('jobs/'+id).set(body);
      if(changed){

async function sendOff(){
  var o=S.offForm, boss=isBoss(), me=myCrew(); if(!o||S.busy||!S.db||(!boss&&!me)) return; o.err='';
  var pid=boss?o.person:me, from=o.from, to=o.to&&o.to>=o.from?o.to:o.from, t=todayStr(0);
  if(boss&&!pid) o.err='Pick who the days off are for.';

  else if(o.to&&o.to<o.from) o.err='The last day off is before the first. Check the dates.';
  else{
    var hit=null;
    S.daysoff.forEach(function(r){if(!hit&&r.person===pid&&(r.status==='approved'||r.status==='pending')&&r.from<=to&&r.to>=from)hit=r;});
    if(hit) o.err=(pid===me?'You’ve':nameOf(pid)+' has')+' already got '+fmtRange(hit.from,hit.to)+' booked or asked for. Cancel that first to change it.';
  }
  if(o.err){render(true);return;}
  var n=noticeOf(from), now=Date.now(), auto=!boss&&n>=NOTICE_DAYS;
  var doc={person:pid,from:from,to:to,reason:o.reason||'',note:String(o.note||'').trim().slice(0,300),
    status:(boss||auto)?'approved':'pending',auto:auto,notice:n,requestedBy:S.me,requestedAt:now,bookedByBoss:boss,
    decidedBy:boss?S.me:null,decidedAt:boss?now:null,seen:boss?true:!auto,seenByPerson:!(boss&&pid!==me)};
  S.busy=true; render(true);
  try{
    await S.db.collection('daysoff').add(doc);
    S.offForm=blankOff();
    toast(boss?'Booked. It’s on the calendar.':(auto?'Booked. It’s on the calendar and '+BN()+' will see it.':'Sent. '+BNc()+' needs to OK it.'));
  }catch(e){o.err=errMsg(e);}
  S.busy=false; render(true);
}

async function boot(){
  render(true);
  var cl=window.claude;
  if(!cl||typeof cl.use!=='function'){S.phase='ready';S.standalone=true;S.got.jobs=S.got.people=S.got.crew=true;enterDemo(false);render(true);return;}
  var db=null,user=null,assets=null;
  try{var r=await Promise.all([cl.use('db'),cl.use('user'),cl.use('assets')]);db=r[0];user=r[1];assets=r[2];}catch(_){}
  S.user=user; S.assets=assets||null;
  if(user){
    try{var me=await user.me();S.me=me.id||null;S.owner=!!me.isOwner;}catch(_){}
    try{S.canData=await user.can('data.write');}catch(_){}
  }
  if(!db){S.phase='nodb';render(true);return;}
  S.db=db; S.phase='ready';
  subscribe(db,'real');
  render(true);
}

var COLS={jobs:['jobs',1],checks:['checks',0],yardchecks:['ychecks',0],jobphotos:['photos',0],extras:['extras',0],people:['people',0],crew:['crew',0],daysoff:['daysoff',1],kits:['kits',1],vehicles:['vans',1]};
function toMap(snap){var m=new Map();snap.docs.forEach(function(d){m.set(d.id,Object.assign({},d.data(),{__id:d.id}));});return m;}
function plain(snap){var m=new Map();snap.docs.forEach(function(d){m.set(d.id,d.data());});return m;}
function live(which){return (which==='demo')===!!S.demo;}
function subscribe(db,which){
  var fail=function(e){if(which==='real'&&e&&e.code==='revoked'){S.phase='nodb';render();}};
  Object.keys(COLS).forEach(function(col){
    var key=COLS[col][0], byId=COLS[col][1];
    db.collection(col).onSnapshot(function(snap){
      var m=byId?toMap(snap):plain(snap); STORE[which][key]=m;
      if(!live(which)) return;
      S[key]=m;
      if(col==='jobs')S.got.jobs=true; if(col==='people')S.got.people=true; if(col==='crew')S.got.crew=true;
      if(col==='jobs'||col==='people'||col==='daysoff'||col==='jobphotos') fetchNames();
      if(which==='demo'&&(col==='jobs'||col==='crew')) demoResync();
      render();
    },fail);
  });
  db.doc('settings/roles').onSnapshot(function(d){
    var v=d.exists?d.data():{}, b=Array.isArray(v.bosses)?v.bosses.slice():[];
    STORE[which].bosses=b;
    if(live(which)){S.bosses=b;S.got.roles=true;render();}
  },fail);
}
function applyStore(which){
  var st=STORE[which];
  Object.keys(COLS).forEach(function(col){var k=COLS[col][0];S[k]=st[k]||new Map();});
  S.bosses=st.bosses||[];
}

}

function demoJob(){return Array.from(S.jobs.values()).filter(function(x){return (x.crew||[]).length;}).sort(function(a,b){return ((a.status==='done'?1:0)-(b.status==='done'?1:0))||((b.createdAt||0)-(a.createdAt||0));})[0]||null;}
function demoCrewFor(r){
  if(r==='boss') return S.bosses[0]||'c_boss';
  if(r==='yard'){var y=null;S.crew.forEach(function(c,id){if(!y&&c&&c.yard&&!c.removed)y=id;});return y||'c_kev';}
  var j=demoJob(), ch=j?(j.chargeHand&&j.crew.indexOf(j.chargeHand)>=0?j.chargeHand:j.crew[0]):null;
  if(r==='ch') return ch||'c_ian';
  var g=j?j.crew.filter(function(x){return x!==ch;})[0]:null;
  return g||(ch==='c_owen'?'c_harry':'c_owen');
}
function demoWho(r){var n=demoFirst(demoCrewFor(r))||'they';return r==='boss'?n:(r==='yard'?'the yard ('+n+')':(r==='ch'?'the charge hand ('+n+')':n+' on the gang'));}
function demoBe(r){
  var cid=demoCrewFor(r), uid='du_'+cid;
  if(!S.people.has(uid)||S.people.get(uid).crewId!==cid){S.people.set(uid,{crewId:cid,__id:uid});try{S.demoDb.doc('people/'+uid).set({crewId:cid});}catch(_){}}
  var changed=S.me!==uid; S.me=uid; return changed;
}
function demoResync(){if(S.demo&&S.demoRole&&demoBe(S.demoRole))render();}
function makeDemoDb(seed,onChange){
  var data=JSON.parse(JSON.stringify(seed)), subs=[], ch=function(){if(onChange)onChange();};
  var copy=function(v){return v==null?v:JSON.parse(JSON.stringify(v));};
  var merge=function(t,s){Object.keys(s).forEach(function(k){var v=s[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))merge(t[k],v);else t[k]=v;});};
  var snapDoc=function(c,id){var v=data[c]&&data[c][id];return {id:id,exists:!!v,data:function(){return copy(v);}};};
  var emit=function(c){setTimeout(function(){subs.slice().forEach(function(s){if(s.col!==c)return;if(s.id)s.fn(snapDoc(c,s.id));else{var docs=Object.keys(data[c]||{}).map(function(id){return snapDoc(c,id);});s.fn({docs:docs,size:docs.length,empty:!docs.length});}});},0);};
  var newId=function(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
  var docRef=function(path){var p=path.split('/'),c=p[0],id=p[1];return {id:id,
    get:async function(){return snapDoc(c,id);},
    set:async function(v){(data[c]=data[c]||{})[id]=copy(v);emit(c);ch();},
    update:async function(v){if(!data[c]||!data[c][id]){var e=new Error('Not found');e.code='not_found';throw e;}merge(data[c][id],copy(v));emit(c);ch();},
    delete:async function(){if(data[c])delete data[c][id];emit(c);ch();},
    onSnapshot:function(fn){var s={col:c,id:id,fn:fn};subs.push(s);setTimeout(function(){fn(snapDoc(c,id));},0);return function(){var i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}};};
  return {dump:function(){return copy(data);},doc:docRef,collection:function(c){return {
    doc:function(id){return docRef(c+'/'+(id||newId()));},
    add:async function(v){var r=docRef(c+'/'+newId());await r.set(v);return r;},
    onSnapshot:function(fn){var s={col:c,fn:fn};subs.push(s);emit(c);return function(){var i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}};}};
}
function clearDrafts(){S.view=null;S.jobId=null;S.form=null;S.offForm=null;S.mode=null;S.xform=null;S.lb=null;S.editingName=false;S.renaming=null;S.readOnly=false;S.calDay=null;S.calMonth=null;window.scrollTo(0,0);}
function setDemoRole(r){flushAll();S.demoRole=r;demoBe(r);S.owner=false;clearDrafts();render(true);saveDemoSoon();}
function enterDemo(fresh){
  flushAll();
  if(!S.demo) S.realId={me:S.me,owner:S.owner,canData:S.canData,assets:S.assets,db:S.db};
  if(fresh||!S.demoDb){
    var saved=(!fresh&&S.standalone)?loadDemo():null;
    if(fresh&&S.standalone){try{localStorage.removeItem(DEMO_KEY);}catch(_){}}
    DEMO_SAVED=(saved&&saved.urls)||{}; Object.keys(DEMO_SAVED).forEach(function(k){DEMO_URLS[k]=DEMO_SAVED[k];});
    STORE.demo={};S.demoDb=makeDemoDb(saved?saved.data:demoSeed(),saveDemoSoon);subscribe(S.demoDb,'demo');
    if(saved&&saved.role&&!fresh) S.demoRole=saved.role;
  }
  S.demo=true; S.db=S.demoDb; S.assets=demoAssets; S.canData=true;
  applyStore('demo'); setDemoRole(S.demoRole&&!fresh?S.demoRole:'boss');
}
function exitDemo(){
  flushAll(); var r=S.realId||{};
  S.demo=false; S.me=r.me; S.owner=r.owner; S.canData=r.canData; S.assets=r.assets||null; S.db=r.db;
  applyStore('real'); clearDrafts(); render(true);
}
function demoPanel(){
  if(!S.demo) return '';
  var v=curView(), compact=v==='job'||v==='form';
  if(compact) return '<section class="demo-panel" aria-label="Demo"><div class="demo-tape" aria-hidden="true"></div><div class="demo-in"><div class="modes" role="group" aria-label="Show the app as">'+DEMO_ORDER.map(function(r){return '<button type="button" class="seg" data-act="demorole" data-v="'+r+'" aria-pressed="'+(S.demoRole===r)+'">'+DEMO_ROLES[r].label+'</button>';}).join('')+'</div></div></section>';
  return '<section class="demo-panel" aria-label="Demo"><div class="demo-tape" aria-hidden="true"></div><div class="demo-in">'+
    '<div class="demo-row"><span class="demo-tag">Demo</span><span class="hint">'+(S.standalone?'Practice mode. What you do stays on this phone until you tap Start again.':'Example jobs. Nothing here is saved.')+'</span></div>'+
    '<div class="modes" role="group" aria-label="Show the app as">'+DEMO_ORDER.map(function(r){return '<button type="button" class="seg" data-act="demorole" data-v="'+r+'" aria-pressed="'+(S.demoRole===r)+'">'+DEMO_ROLES[r].label+'</button>';}).join('')+'</div>'+
    '<p class="demo-hint">'+DEMO_HINTS[S.demoRole||'boss']+'</p>'+
    '<div class="demo-row"><button type="button" class="mini'+(S.confirmReset?' mini-danger':'')+'" data-act="demoreset">'+(S.confirmReset?'Tap again to wipe everything':'Start again from scratch')+'</button><button type="button" class="mini" data-act="demoexit">Exit demo</button></div></div></section>';
}
boot();
})();
