<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCS Load Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="Load Check">
<meta name="application-name" content="FCS Load Check">
<meta name="theme-color" content="#2E2A5A">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column, phone first. Navy bar on top, white cards on a cool grey ground, one green action fixed at the bottom. */
:root{
  --bg:#F3F4F8; --card:#FFFFFF; --ink:#17172B; --ink2:#575B70; --ink3:#868BA0; --line:#E2E4EC; --field:#FFFFFF;
  --bar:#2E2A5A; --brand:#2E2A5A; --brand2:#413C7A; --on-brand:#FFFFFF; --brand-soft:#ECEBF7; --brand-ink:#2E2A5A;
  --go:#2E8B2B; --on-go:#FFFFFF; --go-soft:#E5F4E3; --go-ink:#1F6B1D;
  --warn:#9A5B00; --warn-soft:#FFF2D9; --bad:#C0271F; --bad-soft:#FDE9E7; --on-bad:#FFFFFF;
  --plate:#F7C800; --plate-ink:#111111; --c-job:#2E2A5A; --c-insp:#0F766E; --c-off:#A21CAF; --c-wk:#C2410C; --on-mk:#FFFFFF; --av:#FFFFFF; --av-ink:#2E2A5A; --glass:rgba(255,255,255,.14);
  --photo-ink:#FFFFFF; --photo-mark:#7BFF6A; --photo-fill:rgba(123,255,106,.2); --photo-shade:rgba(12,12,28,.76); --photo-ground:#1B2230;
  --lb:#0A0A14; --scrim:rgba(10,10,25,.5); --toast:#17172B; --on-toast:#FFFFFF; --splash:#393564; --splash-ink:#8FD483; --lift:rgba(0,0,0,.14);
  --shadow:0 1px 2px rgba(23,23,43,.06),0 4px 14px rgba(23,23,43,.06);
  --r:14px; --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E1A; --card:#191929; --ink:#F2F2F7; --ink2:#B5B7C9; --ink3:#8789A0; --line:#2A2A42; --field:#12121F;
  --bar:#1F1D40; --brand:#514BB0; --brand2:#6F69D0; --on-brand:#FFFFFF; --brand-soft:#252447; --brand-ink:#CFCBF7;
  --go:#4FB847; --on-go:#0B1F0A; --go-soft:#16301A; --go-ink:#8BDD84;
  --warn:#F0BE55; --warn-soft:#33290F; --bad:#FF7B70; --bad-soft:#3A1917; --on-bad:#1F0907;
  --toast:#F2F2F7; --on-toast:#17172B; --lift:rgba(0,0,0,.5); --c-job:#9D97FA; --c-insp:#2DD4BF; --c-off:#E879F9; --c-wk:#FB923C; --on-mk:#12121F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0E1A; --card:#191929; --ink:#F2F2F7; --ink2:#B5B7C9; --ink3:#8789A0; --line:#2A2A42; --field:#12121F;
  --bar:#1F1D40; --brand:#514BB0; --brand2:#6F69D0; --on-brand:#FFFFFF; --brand-soft:#252447; --brand-ink:#CFCBF7;
  --go:#4FB847; --on-go:#0B1F0A; --go-soft:#16301A; --go-ink:#8BDD84;
  --warn:#F0BE55; --warn-soft:#33290F; --bad:#FF7B70; --bad-soft:#3A1917; --on-bad:#1F0907;
  --toast:#F2F2F7; --on-toast:#17172B; --lift:rgba(0,0,0,.5); --c-job:#9D97FA; --c-insp:#2DD4BF; --c-off:#E879F9; --c-wk:#FB923C; --on-mk:#12121F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:-400px;height:calc(400px + env(safe-area-inset-top,0px));z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,label,summary,select,.sat{touch-action:manipulation}
button,summary,.act,.btn,.lab,.pill,.tab{-webkit-user-select:none;user-select:none}
h1,h2,h3,p,dl{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

/* frame */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--on-brand)}
.bar-in{max-width:600px;margin:0 auto;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.bar-logo{width:36px;height:36px;border-radius:9px;flex:none;display:block}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.bar-t small{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t b{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-back{appearance:none;border:0;background:var(--glass);color:inherit;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.who{appearance:none;border:0;background:var(--glass);color:inherit;height:40px;padding:0 10px 0 5px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;flex:none;max-width:46%}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.plain{background:none;padding:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--av);color:var(--av-ink);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none;letter-spacing:.02em}
.coach{background:var(--plate);color:var(--plate-ink)}
.coach-in{max-width:600px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.coach-t{display:flex;flex-direction:column;line-height:1.3}
.coach-t small{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.coach-t b{font-size:1.04rem}
.coach-t span{font-size:.9rem}
.coach-b{display:flex;align-items:center;gap:14px}
.coach .btn{background:var(--plate-ink);color:var(--plate);min-height:40px}
.coach .link{color:var(--plate-ink)}
.coach.look .coach-in{gap:6px;padding-top:8px;padding-bottom:6px}
.coach-r{display:flex;flex-wrap:wrap;align-items:center;gap:2px 20px}
.coach.look .coach-b{gap:20px}
.coach.look .coach-b .link{padding:9px 0}
.coach-w{display:flex;flex-wrap:wrap;gap:6px}
.coach-c{min-height:38px;padding:0 13px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:var(--plate-ink);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.coach-c[aria-pressed="true"]{background:var(--plate-ink);border-color:var(--plate-ink);color:var(--plate)}
.upd{appearance:none;border:0;display:block;width:100%;background:var(--go);color:var(--on-go);font-weight:700;padding:11px 16px;text-align:center}
main{max-width:600px;margin:0 auto;padding-top:18px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:pagein .2s ease both}
main.has-foot{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:flex;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{appearance:none;border:0;background:none;flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:.72rem;font-weight:600;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:36px;height:3px;margin-left:-18px;border-radius:0 0 3px 3px;background:var(--go)}
.badge{position:absolute;top:8px;left:50%;margin-left:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:.68rem;font-weight:700;display:grid;place-items:center}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot-in{max-width:568px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:.84rem;color:var(--ink2);text-align:center}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sheetin{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* type */
.h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--ink2);font-size:.95rem}
.lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.small{font-size:.86rem}

/* cards and rows */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px}
.li:first-child{border-top:0}
button.li{appearance:none;border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left}
.li-t{flex:1;min-width:0;display:flex;flex-direction:column}
.li-t b{font-weight:600}
.li-t small{color:var(--ink2);font-size:.84rem}
.empty{text-align:center;padding:34px 20px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty svg{width:40px;height:40px;color:var(--ink3);margin-bottom:4px}
.empty b{color:var(--ink);font-size:1.05rem}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;min-height:52px;padding:0 18px;font-weight:700;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--brand);color:var(--on-brand);width:100%;transition:transform .08s ease,opacity .15s ease;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;flex:none}
.btn.go{background:var(--go);color:var(--on-go)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:.92rem;padding:0 14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.btns.fit{flex-wrap:wrap}
.btns.fit .btn{flex:1 1 auto;white-space:nowrap}
.card-h > .btn{flex:none;white-space:nowrap}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.bad{color:var(--bad)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.acts.one{grid-template-columns:minmax(0,1fr)}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:64px;padding:8px 4px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:.82rem;text-decoration:none;text-align:center;transition:transform .08s ease}
.act:active{transform:scale(.97)}
.act svg{width:22px;height:22px}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap;flex:none}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-toload{background:var(--warn-soft);color:var(--warn)}
.p-loaded{background:var(--brand-soft);color:var(--brand-ink)}
.p-checked{background:var(--go-soft);color:var(--go-ink)}
.p-out{background:var(--brand);color:var(--on-brand)}
.p-done{background:var(--go);color:var(--on-go)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-weight:700;font-size:.86rem;letter-spacing:.06em;padding:3px 8px;border-radius:5px;line-height:1.2;white-space:nowrap}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:7px;background:var(--bg);color:var(--ink2);font-size:.78rem;font-weight:600}

/* job cards */
.job{appearance:none;border:0;text-align:left;width:100%;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .08s ease}
.job:active{transform:scale(.992)}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job-a{font-weight:700;font-size:1.05rem;line-height:1.3;letter-spacing:-.01em}
.job-m{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;color:var(--ink2);font-size:.9rem}
.job-s{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--ink2)}
.job-s b{font-weight:600;color:var(--ink)}
.job-s .bad{color:var(--bad);font-weight:600}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s ease}
.steps i.on{background:var(--go)}
.steps i.bad{background:var(--bad)}
.need{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--warn);text-align:left}
.need.bad{border-left-color:var(--bad)}
.need.pay{border-left-color:var(--go)}
.need.insp{border-left-color:var(--c-insp)}
.need.wk{border-left-color:var(--c-wk)}
.wk-r{display:flex;align-items:center;gap:10px;justify-content:space-between}
.wk-r .btn{flex:none}
button.need{appearance:none;border-top:0;border-right:0;border-bottom:0;width:100%}
.need b{font-weight:700}
.run{display:flex;flex-direction:column;gap:8px;padding:2px 0 2px 12px;border-left:3px solid var(--brand2)}
.run-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.run-h b{font-weight:700}
.run-add{margin-left:auto;padding:4px 0}
.ty,.seq{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:.74rem;font-weight:700;white-space:nowrap}
.ty.erect{background:var(--go-soft);color:var(--go-ink)}
.ty.alter{background:var(--warn-soft);color:var(--warn)}
.ty.strike{background:var(--bad-soft);color:var(--bad)}
.seq{background:var(--brand-soft);color:var(--brand-ink)}
.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seq-n{margin-left:auto;display:flex;gap:6px}
.seq-b{appearance:none;border:0;background:var(--bg);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink);padding:0}
.seq-b svg{width:16px;height:16px}
.seq-b[disabled]{opacity:.35;pointer-events:none}
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--ink3);pointer-events:none}
.srch .in{padding-left:44px}

/* job page */
.hero-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.hero-a{font-size:1.35rem;font-weight:700;line-height:1.25;letter-spacing:-.015em;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;font-size:.95rem;align-items:baseline}
.kv dt{color:var(--ink3);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kv dd{margin:0}
.kv dd small{display:block;color:var(--ink2);font-size:.84rem}
.track{display:flex;flex-direction:column;gap:0}
.tr{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tr:last-child{padding-bottom:0}
.tr::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tr:last-child::before{display:none}
.tr-d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;color:transparent;z-index:1;transition:background .2s ease,border-color .2s ease}
.tr-d svg{width:14px;height:14px}
.tr.on .tr-d{background:var(--go);border-color:var(--go);color:var(--on-go)}
.tr.bad .tr-d{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.tr.on::before{background:var(--go)}
.tr-t{display:flex;flex-direction:column;line-height:1.3;padding-top:1px;min-width:0;flex:1}
.tr-t b{font-weight:600}
.tr-t small{color:var(--ink2);font-size:.86rem}
.tr-t .miss{color:var(--bad);font-weight:600}
.tr-big{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.note{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem;overflow-wrap:anywhere}
.note b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:3px}
.note.know{background:var(--warn-soft)}
.note.know b{color:var(--warn)}
.note.bad{background:var(--bad-soft)}
.note.bad b{color:var(--bad)}
.size{display:flex;flex-direction:column;gap:2px;background:var(--go-soft);border-radius:12px;padding:11px 14px}
.size b{font-weight:700;color:var(--go-ink)}
.size span{font-size:.86rem;color:var(--ink2)}

/* aerial picture */
.sat{position:relative;height:0;padding-top:75%;overflow:hidden;background:var(--photo-ground);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card:not(.flush) > .sat{border-radius:12px}
.sat.tap{cursor:crosshair}
.sat-t{position:absolute;display:block;max-width:none;pointer-events:none}
.sat svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sat-b{fill:rgba(255,255,255,.08);stroke:var(--photo-ink);stroke-opacity:.8;stroke-width:1.2;stroke-linejoin:round}
.sat-sel{fill:var(--photo-fill);stroke:var(--photo-mark);stroke-width:3;stroke-linejoin:round}
.sat-lb{fill:var(--photo-shade)}
.sat-lt{fill:var(--photo-ink);font:700 11px var(--f)}
.sat-n{fill:var(--photo-ink);font:700 10px var(--f);paint-order:stroke;stroke:var(--photo-shade);stroke-width:3px}
.sat-pr{fill:none;stroke:var(--photo-ink);stroke-width:2.5}
.sat-pd{fill:var(--photo-mark);stroke:var(--photo-shade);stroke-width:1.5}
.sat-c{position:absolute;left:7px;bottom:5px;font-size:.6rem;color:var(--photo-ink);opacity:.9;text-shadow:0 1px 2px var(--photo-shade);pointer-events:none}
.sat-m{position:absolute;right:8px;bottom:8px;background:var(--photo-shade);color:var(--photo-ink);font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:8px;pointer-events:none}
.sat-z{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.sat-z button{appearance:none;border:0;width:38px;height:38px;border-radius:10px;background:var(--photo-shade);color:var(--photo-ink);font-size:1.35rem;font-weight:600;line-height:1;display:grid;place-items:center;padding:0}
.sat-z button[disabled]{opacity:.4;pointer-events:none}

/* load sheet */
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.sh-h b.t{font-size:1.08rem}
.sh-g{padding:10px 16px 6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
.sh-g:first-of-type{border-top:0}
.ck{appearance:none;border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:11px 16px;min-height:54px;border-top:1px solid var(--line)}
.sh-g + .ck{border-top:0}
.ck-b{width:28px;height:28px;border-radius:9px;border:2px solid var(--ink3);flex:none;display:grid;place-items:center;color:transparent;transition:background .15s ease,border-color .15s ease}
.ck-b svg{width:17px;height:17px}
.ck-n{flex:1;min-width:0;font-weight:500}
.ck-n small{display:block;font-size:.82rem;font-weight:400;color:var(--ink2);line-height:1.3}
.ck-q{font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:3px 9px;font-size:.95rem}
.ck.ok .ck-b{background:var(--go);border-color:var(--go);color:var(--on-go)}
.ck.no .ck-b{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.ck.no .ck-n{color:var(--bad)}
.ck-s{font-size:.74rem;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.ck.ro{pointer-events:none}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--go);border-radius:3px;transition:width .25s ease}
.tip{font-size:.84rem;color:var(--ink2);padding:0 16px 12px}

/* on site: extra work and photos */
.xr{display:flex;flex-direction:column;gap:8px;padding:13px 16px;border-top:1px solid var(--line)}
.xr-t{font-weight:600;overflow-wrap:anywhere}
.xr-m{font-size:.84rem;color:var(--ink2)}
.xr-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 16px 16px}
.gal.in-row{padding:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.th{appearance:none;border:0;padding:0;background:var(--bg);border-radius:10px;overflow:hidden;position:relative;height:0;padding-top:100%;display:block;width:100%}
.th img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.lbx{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;background:var(--lb);color:var(--photo-ink);display:flex;flex-direction:column;animation:fadein .18s ease both}
.lbx-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-weight:600}
.lbx-x{appearance:none;border:0;background:var(--glass);color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.lbx-x svg{width:20px;height:20px}
.lbx-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
.lbx-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;display:block}
.lbx-bot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.lbx-cap{font-size:.9rem;opacity:.85;text-align:center}
.lbx .btn{background:var(--glass);color:var(--photo-ink);box-shadow:none}

/* forms */
.fld{display:flex;flex-direction:column;gap:7px}
.fld > label,.fld > .fl{font-size:.9rem;font-weight:600}
.in{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);padding:0 14px;font-size:1rem}
textarea.in{padding:12px 14px;min-height:84px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.in:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
.in.pc{text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.in.pc::placeholder{text-transform:none;font-weight:400;letter-spacing:0}
.rowf{display:flex;gap:10px}
.rowf .in{flex:1;min-width:0}
.rowf .btn{width:auto;flex:none;min-height:50px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;flex:1;min-height:42px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:.95rem;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--lift)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip .x{opacity:.6;font-size:1.1rem;line-height:1}
.hint{font-size:.86rem;color:var(--ink2)}
.err{font-size:.9rem;color:var(--bad);font-weight:600}
.addr-list{border:1.5px solid var(--line);border-radius:12px;max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--field)}
.addr-list button{appearance:none;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:12px 14px;min-height:48px;font-weight:500}
.addr-list button:first-child{border-top:0}
.addr-list button:active{background:var(--brand-soft)}
.grp{border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.chips.mx{padding:2px 16px 16px}
.chips.mx + .grp,.ld + .grp{border-top:1px solid var(--line)}
.ld{padding:2px 16px 14px;display:flex;flex-direction:column;gap:12px}
.grp > summary,.fold > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:600;cursor:pointer;min-height:54px}
.grp > summary::-webkit-details-marker,.fold > summary::-webkit-details-marker{display:none}
.grp > summary::after,.fold > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin-right:4px;flex:none;transition:transform .15s ease}
.grp[open] > summary::after,.fold[open] > summary::after{transform:rotate(-135deg)}
.fold > summary > span{flex:1;min-width:0;display:flex;flex-direction:column}
.fold > summary small{font-weight:400;color:var(--ink2);font-size:.84rem}
.fold[open] > summary{border-bottom:1px solid var(--line)}
.grp-n{margin-left:auto;background:var(--brand);color:var(--on-brand);border-radius:999px;min-width:24px;height:24px;padding:0 8px;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.st{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:52px}
.st-n{flex:1;min-width:0;font-weight:500}
.st-c{display:flex;align-items:center;gap:6px}
.st-c button{appearance:none;border:1.5px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:11px;font-size:1.25rem;font-weight:600;line-height:1;display:grid;place-items:center;padding:0}
.st-c input{width:52px;height:40px;text-align:center;border:1.5px solid var(--line);border-radius:11px;background:var(--field);font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0}
.st-c input::-webkit-outer-spin-button,.st-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.st.has .st-c input{border-color:var(--brand2);background:var(--brand-soft)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-size:1.08rem;font-weight:700}
.cal-nav{appearance:none;border:0;background:var(--bg);width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.cal-nav svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-d{font-size:.68rem;font-weight:700;color:var(--ink3);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.day{appearance:none;border:0;background:none;min-height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:5px 0 3px;font-weight:600;font-size:.95rem;color:var(--ink);min-width:0}
.day.out{color:var(--ink3);opacity:.45}
.mks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:46px}
.mk{min-width:19px;height:17px;padding:0 5px;border-radius:9px;font-size:.66rem;font-weight:700;display:grid;place-items:center;line-height:1;color:var(--on-mk)}
.mk.jobs{background:var(--c-job)}
.mk.jobs.fin{background:var(--go);color:var(--on-go)}
.mk.insp{background:var(--c-insp);border-radius:3px}
.mk.off{background:var(--c-off)}
.mk.wk{background:var(--c-wk);border-radius:3px}
.mk.bad{background:var(--bad);color:var(--on-bad)}
.mk.plan{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.mk.insp.plan{color:var(--c-insp)}
.mk.off.plan{color:var(--c-off)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:38px;padding:0 13px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.key[aria-pressed="true"]{border-color:var(--brand2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand2)}
.kd{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.kd.jobs{background:var(--c-job);width:16px;border-radius:6px}
.kd.insp{background:var(--c-insp);border-radius:3px}
.kd.off{background:var(--c-off)}
.kd.wk{background:var(--c-wk);border-radius:3px}
.sh-g .kd{margin-right:7px;vertical-align:-1px}
.kd.bad{background:var(--bad);border-radius:4px}
.kd.fin{background:var(--go);width:16px;border-radius:6px}
.kd.plan{background:none;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.cal-k{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:10px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink2)}
.cal-k span{display:inline-flex;align-items:center;gap:6px}
.sh-g + .li{border-top:0}
.day.today{background:var(--brand-soft);color:var(--brand-ink)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brand2)}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.day .dot{font-size:.56rem;font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;background:var(--go);color:var(--on-go)}
.day .dot.pend{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.day .jn{min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:.68rem;font-weight:700;display:grid;place-items:center;line-height:1}
.day .jn.ok{background:var(--go);color:var(--on-go)}
.day .jn.bad{background:var(--bad);color:var(--on-bad)}
.who-row .av{background:var(--brand);color:var(--on-brand)}
.dayx{padding:12px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--ink2)}
.dayx b{color:var(--ink);font-weight:600}
.av.soft{background:var(--brand-soft);color:var(--brand-ink)}

/* sheets and toast */
.scrim{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s ease both}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px var(--lift);animation:sheetin .22s ease both}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet > .btn.go:last-child{position:sticky;bottom:0;flex:none;box-shadow:0 0 0 12px var(--card),0 44px 0 12px var(--card)}   /* the main button of a long sheet stays in view */
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h b{font-size:1.15rem;font-weight:700}
.pick{appearance:none;border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 4px;min-height:56px;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.pick .av{width:38px;height:38px;font-size:.82rem;background:var(--brand-soft);color:var(--brand-ink)}
.pick[aria-pressed="true"] .av{background:var(--brand);color:var(--on-brand)}
.pick-t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.pick-t b{font-weight:600}
.pick-t small{color:var(--ink2);font-size:.84rem}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);z-index:80;background:var(--toast);color:var(--on-toast);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.94rem;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;box-shadow:0 8px 24px var(--lift);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.low{top:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#splash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:var(--splash);display:grid;place-items:center;transition:opacity .35s ease,visibility 0s linear .35s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:150px;height:150px;display:block}
#splash div{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--photo-ink);font-family:var(--f)}
#splash b{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
#splash small{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--splash-ink)}
.at{display:flex;flex-direction:column;gap:6px}
.at p{padding:8px 12px;border-radius:9px;font-size:.88rem;display:flex;flex-direction:column}
.at p span{color:var(--ink2);overflow-wrap:anywhere}
.at .y{background:var(--go-soft)}
.at .n{background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* the guide */
.gd + .gd{border-top:1px solid var(--line)}
.gd ol,.gd ul{margin:0;padding:12px 18px 16px 40px;display:flex;flex-direction:column;gap:9px;font-size:.96rem}
.gd li::marker{color:var(--ink3);font-weight:700}
.gd-h{font-size:1.3rem}

/* alerts */
.al{align-items:flex-start}
.al-d{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--c-job)}
.al-d.load{background:var(--plate)}
.al-d.time{background:var(--go)}
.al-d.x{background:var(--warn)}
.al-d.wk{background:var(--c-wk)}
.al-d.insp{background:var(--c-insp)}
.al-d.off{background:var(--c-off)}
.al.new{background:var(--brand-soft)}
.al-f{text-align:center;padding:0 12px}
.al .li-t small.al-t{color:var(--ink3);font-size:.76rem;margin-top:2px}
.hint > svg{width:15px;height:15px;vertical-align:-2px;margin-right:2px}

/* week planner: men down the side, days across the top */
.plan{overflow-x:auto}
.pl-r{display:grid;grid-template-columns:132px repeat(7,minmax(116px,1fr));border-top:1px solid var(--line);min-width:960px}
.pl-r:first-child{border-top:0}
.pl-n{padding:10px 12px;display:flex;align-items:center;gap:9px;min-width:0;background:var(--card);position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.pl-nm{min-width:0;display:flex;flex-direction:column;letter-spacing:0;text-transform:none;font-weight:400}
.pl-nm b{font-weight:600;font-size:.95rem;color:var(--ink);line-height:1.2}
.pl-nm small{color:var(--ink2);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-d{padding:9px 6px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.pl-d b{font-weight:700}
.pl-d small{font-size:.74rem;color:var(--ink2)}
.pl-d.today{background:var(--brand-soft)}
.pl-d.today b{color:var(--brand-ink)}
.pl-c{border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:5px;min-height:58px;min-width:0}
.pl-c.we,.pl-d.we{background:var(--bg)}
.pl-c.today{background:var(--brand-soft)}
.pl-c.off{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,var(--card) 6px,var(--card) 12px)}
.pl-c.past{opacity:.62}
.pl-c.over{box-shadow:inset 0 0 0 2px var(--go);background:var(--go-soft)}
.dragging .pl-c[data-drop]{box-shadow:inset 0 0 0 1px var(--line)}
.dragging .pl-c[data-drop].over{box-shadow:inset 0 0 0 2px var(--go)}
.pl-x{font-size:.76rem;color:var(--ink2);padding:1px 3px}
.pl-pl{display:flex;flex-wrap:wrap;gap:4px}
.pl-pl .plate,.pj .plate{font-size:.68rem;padding:2px 5px;letter-spacing:.04em}
.pl-a{appearance:none;border:1.5px dashed transparent;background:none;border-radius:8px;min-height:20px;flex:1 0 20px;max-height:46px;display:grid;place-items:center;color:var(--ink3);opacity:.45;transition:opacity .12s ease,border-color .12s ease;margin-top:auto;padding:0}
.pl-a svg{width:15px;height:15px}
.pl-c:hover .pl-a,.pl-a:focus-visible{opacity:1;border-color:var(--ink3)}
.dragging .pl-a{visibility:hidden}
@media (hover:none){.pl-a{opacity:.8;border-color:var(--line)}}
.pj{background:var(--card);border-radius:9px;box-shadow:var(--shadow);padding:6px 8px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--brand2);cursor:pointer;min-width:0;-webkit-user-select:none;user-select:none}
.pj[draggable="true"]{cursor:grab}
.pj.erect{border-left-color:var(--go)}
.pj.alter{border-left-color:var(--warn)}
.pj.strike{border-left-color:var(--bad)}
.pj.done{opacity:.72}
.pj-a{font-size:.84rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.pj-m{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;font-size:.73rem;color:var(--ink2);white-space:nowrap}
.pj-s{font-style:normal;font-weight:700;font-size:.7rem}
.pj-s.toload{color:var(--warn)}
.pj-s.checked,.pj-s.out,.pj-s.done{color:var(--go-ink)}
.pj-s.bad{color:var(--bad)}
.kd.erect{background:var(--go);border-radius:3px}
.kd.alter{background:var(--warn);border-radius:3px}
.kd.strike{background:var(--bad);border-radius:3px}
.pl-k{border-top:0;padding-top:0}
.calv{background:var(--card);box-shadow:var(--shadow)}
.calv button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none}

/* columns: on a phone the wrappers vanish and everything stacks in one column, as before */
.col{display:contents}
.nav.sub,.wide{display:none}

/* laptop: the tabs become a side menu, and a page with two halves sits in two columns */
@media (min-width:1000px){
  .bar-in,.coach-in{max-width:none;padding-left:24px;padding-right:24px}
  .nav,.nav.sub{display:block;top:var(--bar-h,60px);right:auto;width:216px;border-top:0;border-right:1px solid var(--line);padding:14px 10px}
  .nav-in{max-width:none;margin:0;flex-direction:column;gap:4px;padding:0}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;font-size:.98rem;text-align:left}
  .tab[aria-current="page"]{background:var(--brand-soft)}
  .tab[aria-current="page"]::before{display:none}
  .tab .badge{position:static;margin-left:auto}
  main{max-width:760px;margin-left:calc(216px + max(0px,(100vw - 216px - 760px)/2));margin-right:0;padding:26px 28px 72px}
  main.two,main.side{max-width:1180px;margin-left:calc(216px + max(0px,(100vw - 216px - 1180px)/2));display:grid;gap:20px;align-items:start}
  main.full{max-width:1560px;margin-left:calc(216px + max(0px,(100vw - 216px - 1560px)/2))}
  main.full .calv{align-self:flex-start;min-width:340px}
  main.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  main.side{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto 1fr}
  main.two > .col,main.side > .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  main.side > .ca{grid-column:1;grid-row:1}
  main.side > .cb{grid-column:1;grid-row:2}
  main.side > .cs{grid-column:2;grid-row:1 / span 2}
  .wide{display:block}
  main.has-foot{padding-bottom:132px}
  .foot{left:216px}
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:520px;border-radius:20px;max-height:86vh;padding-top:18px}
  .sheet::before{display:none}
}
</style>

function LocalDb(seed,changed,sync){

  function snap(c){var o=data[c]||{};return {docs:Object.keys(o).map(function(id){var v=cp(o[id]);return {id:id,data:function(){return v;}};})};}

  function merge(a,b){Object.keys(b).forEach(function(k){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k];});}
  function doc(path){var p=path.split('/'),c=p[0],id=p[1];return {id:id,
    set:async function(v){(data[c]=data[c]||{})[id]=cp(v);emit(c);},
    update:async function(v){data[c]=data[c]||{};data[c][id]=data[c][id]||{};merge(data[c][id],cp(v));emit(c);},
    delete:async function(){if(data[c])delete data[c][id];emit(c);}};}
  return {dump:function(){return cp(data);},doc:doc,collection:function(c){return {
    onSnapshot:function(cb){subs.push({c:c,cb:cb});if(sync)cb(snap(c));else setTimeout(function(){cb(snap(c));},0);return function(){};},
    add:async function(v){var id=uid('n');await doc(c+'/'+id).set(v);return {id:id};}};}};
}

  if(c===4020) return 'The address service has run out of lookups.';
  if(c===4021) return 'The address service has hit its daily limit.';

  var p=f.prop, m=f.map, ring=ringOf(p.ring), spot={lat:f.lat,lon:f.lon,address:addr};
  var h='<section class="card"><div class="card-h"><span class="lab">The property</span>'+(f.recAt?'<span class="tag">On file since '+esc(fshort(dstr(new Date(f.recAt))))+'</span>':'')+'</div>';
  if(canSat()&&f.lat!=null){
    if(S.satFail) h+='<p class="hint">The picture from above won’t load just now. Check your signal. The buttons below still work.</p>';
    else h+=satHtml({lat:f.lat,lon:f.lon,z:f.z,ring:ring,ax:p.ax,w:p.w,d:p.d,blds:m&&m.status==='ok'?m.blds:null,pick:true,pin:f.exact});
  }
  if(ring&&p.w) h+='<div class="size"><b>'+esc(sizeText(p))+'</b><span>'+esc(sizeSub(p))+'</span>'+(highText(p)?'<span>'+esc(highText(p))+'</span>':'')+'</div><div class="card-h"><span class="hint">'+srcText(p)+(p.src==='os'?' © Crown copyright and database rights '+new Date().getFullYear()+' OS.':'')+(canSat()&&!S.satFail?' Tap another house to change it.':'')+'</span><button type="button" class="link small" data-a="sizerm">Remove</button></div>';
  else if(canSat()&&f.lat!=null&&!S.satFail) h+='<p class="hint">'+(m&&m.status==='busy'?'Finding the house outlines…':(m&&m.status==='ok'&&m.blds.length?'Tap the house on the picture to mark it and measure it.':(f.exact?'House marked. There’s no outline on the map here to measure.':'Tap the house on the picture to mark it.')))+'</p>';
  if(osKey()&&m&&m.status==='ok'&&m.src!=='os') h+='<p class="hint">Ordnance Survey didn’t answer'+(m.osErr?' ('+esc(m.osErr)+')':'')+', so the outlines here are from the public map.</p>';
  h+=actsHtml(spot,false);
  h+='<div class="fld"><span class="fl">Type of house</span><div class="chips">'+TYPES.map(function(t){return '<button type="button" class="chip" data-a="ptype" data-v="'+t+'" aria-pressed="'+(p.type===t)+'">'+t+'</button>';}).join('')+'</div></div>';
  h+='<div class="fld"><span class="fl">Storeys</span><div class="seg">'+STOREYS.map(function(t){return '<button type="button" data-a="pstoreys" data-v="'+t+'" aria-pressed="'+(p.storeys===t)+'">'+t+'</button>';}).join('')+'</div></div>';
  h+='<div class="fld"><label for="f-pnote">Good to know before they arrive</label><input id="f-pnote" class="in" data-p="note" value="'+esc(p.note)+'" placeholder="e.g. Side gate on the left. Conservatory at the back." autocomplete="off"></div>';
  return h+'<p class="hint">This is kept on file for the address, so it’s there next time.</p></section>';
}

/* ---------- jobs list ---------- */
function pillOf(j){
  var st=statusOf(j), m=missingOf(j).length;
  if(st==='done') return '<span class="pill p-done">Finished</span>';
  if(st==='out') return '<span class="pill p-out">Left '+clock(j.left.at)+'</span>';
  if(m) return '<span class="pill p-bad"><i></i>'+m+' missing</span>';
  return st==='checked'?'<span class="pill p-checked"><i></i>Checked</span>':(st==='loaded'?'<span class="pill p-loaded"><i></i>Loaded</span>':'<span class="pill p-toload"><i></i>To load</span>');
}
function crewLine(j){var ids=(j.crew||[]).slice().sort(function(a,b){return (b===j.ch)-(a===j.ch);});return ids.map(firstOf).join(', ');}
function kindTag(j){return j.kind&&KINDNAME[j.kind]?'<span class="ty '+j.kind+'">'+KINDNAME[j.kind]+'</span>':'';}
function jobCard(j,pos){
  pos=pos||runPos(j);
  var y=j.yard&&j.yard.at, c=j.chk&&j.chk.at, l=j.left&&j.left.at, d=j.done&&j.done.at, ex=extrasOf(j.id).length, ph=photosOf(j.id,'finish').length, m=missingOf(j), bits=[];
  if(l) bits.push('<span>Left <b>'+clock(j.left.at)+'</b></span>');
  if(d) bits.push('<span>Finished <b>'+clock(j.done.at)+'</b></span>');
  if(m.length&&l) bits.push('<span class="bad">'+m.length+' missing</span>');
  if(ex) bits.push('<span>'+plural(ex,'extra')+'</span>');
  if(ph) bits.push('<span>'+plural(ph,'photo')+'</span>');
  return '<button class="job" data-a="open" data-id="'+esc(j.id)+'"><div class="job-top"><span class="job-a">'+esc(j.address)+'</span>'+pillOf(j)+'</div>'+
    '<div class="job-m">'+(j.vehicle?'<span class="plate">'+esc(j.vehicle)+'</span>':'')+kindTag(j)+(pos.n>1?'<span class="seq">'+(pos.i+1)+' of '+pos.n+'</span>':'')+'<span>'+esc(LOADNAME[j.load]||'')+'</span><span>'+esc(crewLine(j))+'</span></div>'+
    (bits.length?'<div class="job-s">'+bits.join('')+'</div>':'')+
    '<div class="steps" aria-hidden="true"><i class="on"></i><i class="'+(y?((j.yard.missing||[]).length?'bad':'on'):'')+'"></i><i class="'+(c?((j.chk.missing||[]).length?'bad':'on'):'')+'"></i><i class="'+(l?'on':'')+'"></i><i class="'+(d?'on':'')+'"></i></div></button>';
}
function offAsk(o){return '<div class="need"><div><b>'+esc(nameOf(o.person))+'</b> wants '+esc(frange(o.from,o.to))+' off</div><span class="small muted">'+esc(o.reason||'Time off')+(o.note?' · '+esc(o.note):'')+'. '+(o.why==='job'?'Already on a job then.':'Less than a week’s notice.')+'</span><div class="btns"><button class="btn go sm" data-a="offyes" data-id="'+esc(o.id)+'">Approve</button><button class="btn line sm" data-a="offno" data-id="'+esc(o.id)+'">Say no</button></div></div>';}

  var h='';

  unsafeScafs().forEach(function(s){var l=lastInsp(s);h+='<div class="need bad"><div><b>Not safe to use:</b> '+esc(s.address)+'</div><span class="small muted">'+esc(l.found||'Defects found')+' · '+esc(firstOf(l.by))+', '+esc(ftime(l.at))+'. Inspect it again once it’s put right.</span>'+btns(s)+'</div>';});

function wkRow(w){

function jobListHtml(){

    if(!hits.length) return '<div class="card empty">'+IC.search+'<b>Nothing found</b><span>Try part of the road name or the postcode.</span></div>';

  }else{
    var days=[]; up.forEach(function(j){if(!days.length||days[days.length-1].d!==j.date)days.push({d:j.date,l:[]});days[days.length-1].l.push(j);});
    days.forEach(function(g){
      var n=g.l.length, out=g.l.filter(function(j){return j.left&&j.left.at;}).length, lo=g.l.filter(function(j){return j.yard&&j.yard.at;}).length, sum='';
      if((boss||yard)&&n>1) sum=g.d===t0?out+' of '+n+' left the yard':lo+' of '+n+' loaded';

/* ---------- one job ---------- */

  var p=j.prop||{}, gang=(j.crew||[]).filter(function(x){return x!==j.ch;}), v=fleet().filter(function(x){return String(x.reg).toUpperCase()===String(j.vehicle).toUpperCase();})[0];

function trackHtml(j){
  var y=j.yard&&j.yard.at?j.yard:null, c=j.chk&&j.chk.at?j.chk:null, l=j.left&&j.left.at?j.left:null, d=j.done&&j.done.at?j.done:null, me=myCrew(), boss=isBoss(), id=esc(j.id);

  var undo=function(k,x){return k===last&&x&&(boss||x.by===me)?' <button class="link small" data-a="undo" data-s="'+k+'" data-id="'+id+'">Undo</button>':'';};
  var who=function(x){return esc(nameOf(x.by))+', '+esc(ftime(x.at));};

    row(l?'on':'','Left the yard',l?'<span class="tr-big">'+clock(l.at)+'</span><small>'+esc(nameOf(l.by))+(dstr(new Date(l.at))!==today(0)?', '+esc(fshort(dstr(new Date(l.at)))):'')+(l.typed?' · time typed in':'')+(canSite(j)?' <button class="link small" data-a="timeopen" data-id="'+id+'">Change time</button>':'')+undo('left',l)+'</small>':'<small>Not left yet</small>')+
    row(d?'on':'','Job finished',d?'<small>'+who(d)+(ph?' · '+plural(ph,'photo'):'')+undo('done',d)+'</small>':'<small>Not finished yet</small>')+'</div>';

/* ---------- calendar: one grid, a colour key, and everything on the day you tap ---------- */
var CATS=[['all','All'],['jobs','Jobs'],['insp','Inspections'],['off','Time off'],['wk','Weekend work']];
function calData(from,to){ // what falls on each day, by kind
  var me=myCrew(), boss=isBoss(), J={}, O={}, I={}, W={};
  visJobs().forEach(function(j){(J[j.date]=J[j.date]||[]).push(j);});
  offList().filter(function(o){return o.status==='approved'||boss||o.person===me;}).forEach(function(o){var d=o.from<from?from:o.from,n=0;while(d<=o.to&&d<=to&&n<80){(O[d]=O[d]||[]).push(o);d=addDays(d,1);n++;}});
  myScafs().forEach(function(s){var bad=isUnsafe(s);inspDays(s,to).forEach(function(x){if(x.d>=from)(I[x.d]=I[x.d]||[]).push({s:s,late:x.late,plan:x.plan,bad:bad&&!x.plan});});});
  wkOpenDays().forEach(function(w){W[w.date]=w;});
  return {J:J,O:O,I:I,W:W};
}

/* ---------- alerts: who gets told what.
   Each alert is saved for one person and shows under their Alerts tab. They are written the moment something happens,
   so once the phones share storage the same alerts can be pushed to each phone. ---------- */
function andList(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function bossIds(){return S.bosses.filter(function(b){return S.crew.has(b)&&!S.crew.get(b).removed;});}
function yardIds(){return crewList().filter(function(c){return c.yard;}).map(function(c){return c.id;});}
function siteIds(){return crewList().filter(function(c){return S.bosses.indexOf(c.id)<0;}).map(function(c){return c.id;});}   // everyone but the boss
function vehOf(j){return String(j.vehicle||'').toUpperCase();}
function toAll(ids,a){return ids.map(function(id){return Object.assign({to:id},a);});}
function toBosses(a){return toAll(bossIds(),a);}
function tell(list){ // never tells the person doing it, and never says the same thing twice
  var me=myCrew(), now=Date.now(), seen={}, out=[];
  (list||[]).forEach(function(a){
    if(!a||!a.to||a.to===me||!S.crew.has(a.to)||S.crew.get(a.to).removed) return;
    var k=a.to+'|'+a.t+'|'+a.m; if(seen[k]) return; seen[k]=1; out.push(a);
  });
  out.forEach(function(a,i){S.db.doc('alerts/'+uid('a')).set(Object.assign({at:now+i,by:me||'',read:false},a)).catch(function(){});});
  if(out.length){pruneAlerts();notifyLocal(out);}
  return out;
}
function toldWords(out){var ids=[];(out||[]).forEach(function(a){if(ids.indexOf(a.to)<0)ids.push(a.to);});return andList(ids.map(firstOf));}
function pruneAlerts(){ // keep the store small: read alerts over a month old go, and so does anything beyond the newest 400
  var all=Array.from(S.alerts.values()), cut=Date.now()-31*864e5, old=all.filter(function(a){return a.read&&a.at<cut;});
  if(all.length>400) old=old.concat(all.sort(function(a,b){return (b.at||0)-(a.at||0);}).slice(400));
  old.slice(0,40).forEach(function(a){S.db.doc('alerts/'+a.id).delete().catch(function(){});});
}
function jobAlerts(old,nw){ // a job put on (no old), changed, or taken off (no nw): who needs telling, and what
  var out=[], yard=yardIds(), when=function(j){return fshort(j.date);};
  var chMsg=function(j){var g=(j.crew||[]).filter(function(x){return x!==j.ch;}).map(firstOf);return when(j)+': '+j.address+'. Lorry '+vehOf(j)+(g.length?', with '+andList(g):'')+'.';};
  var gangMsg=function(j){return when(j)+': '+j.address+'. '+firstOf(j.ch)+' is charge hand, lorry '+vehOf(j)+'.';};
  var loadMsg=function(j){var e=exOf(j),on=[],n=0;LOADX.forEach(function(g){g[1].forEach(function(x){if(e[x[0]]>0)on.push(x[1].charAt(0).toLowerCase()+x[1].slice(1)+' × '+e[x[0]]);});});Object.keys(e).forEach(function(k){if(!LOADID[k])n++;});
    var misc=n?plural(n,'miscellaneous item'):'', says=j.load==='empty'?(on.length||n?'Empty apart from '+andList(on.concat(n?[misc]:[])):'Empty'):(LOADNAME[j.load]||'Load')+(on.length?' with '+andList(on):'')+(n?(on.length?', and ':' and ')+misc:'');
    return vehOf(j)+' for '+when(j)+': '+j.address+'. '+says+'.';};
  var sig=loadSig;
  if(!old&&nw){
    out.push({to:nw.ch,k:'job',t:'You’re charge hand',m:chMsg(nw),job:nw.id});
    (nw.crew||[]).forEach(function(c){if(c!==nw.ch)out.push({to:c,k:'job',t:'You’re on a job',m:gangMsg(nw),job:nw.id});});
    out=out.concat(toAll(yard,{k:'load',t:'New load',m:loadMsg(nw),job:nw.id}));
  }else if(old&&!nw){
    if(!(old.done&&old.done.at)){
      (old.crew||[]).forEach(function(c){out.push({to:c,k:'job',t:'Job cancelled',m:when(old)+': '+old.address+'.'});});
      if(!(old.left&&old.left.at)) out=out.concat(toAll(yard,{k:'load',t:'Load cancelled',m:vehOf(old)+' for '+when(old)+': '+old.address+'.'}));
    }
  }else if(old&&nw){
    var oc=old.crew||[], nc=nw.crew||[], ch=[];
    if(old.date!==nw.date) ch.push('now on '+when(nw)+' (was '+when(old)+')');
    if(vehOf(old)!==vehOf(nw)) ch.push('lorry is now '+vehOf(nw));
    if(old.address!==nw.address) ch.push('address is now '+nw.address);
    if((old.kind||'')!==(nw.kind||'')&&KINDNAME[nw.kind]) ch.push('now '+(nw.kind==='strike'?'a strike':(nw.kind==='alter'?'an alter':'an erect')));
    nc.forEach(function(c){
      var was=oc.indexOf(c)>=0, isCh=c===nw.ch, wasCh=c===old.ch, base=ch;
      if(isCh&&sig(old)!==sig(nw)) ch=base.concat(['the load sheet has changed']);   // only the charge hand needs to know the load changed
      if(!was) out.push(isCh?{to:c,k:'job',t:'You’re charge hand',m:chMsg(nw),job:nw.id}:{to:c,k:'job',t:'You’re on a job',m:gangMsg(nw),job:nw.id});
      else if(isCh&&!wasCh) out.push({to:c,k:'job',t:'You’re now charge hand',m:chMsg(nw),job:nw.id});
      else if(ch.length) out.push({to:c,k:'job',t:'Job changed',m:old.address+': '+ch.join(', ')+'.'+(nw.ch!==old.ch?' '+firstOf(nw.ch)+' is charge hand now.':''),job:nw.id});
      else if(nw.ch!==old.ch) out.push({to:c,k:'job',t:'Charge hand changed',m:when(nw)+': '+nw.address+'. '+firstOf(nw.ch)+' is charge hand now.',job:nw.id});
      ch=base;
    });
    oc.forEach(function(c){if(nc.indexOf(c)<0)out.push({to:c,k:'job',t:'You’re off a job',m:when(old)+': '+old.address+'.'});});
    if(!(nw.left&&nw.left.at)&&(old.date!==nw.date||vehOf(old)!==vehOf(nw)||sig(old)!==sig(nw)))
      out=out.concat(toAll(yard,{k:'load',t:'Load changed',m:loadMsg(nw)+(old.yard&&old.yard.at&&!(nw.yard&&nw.yard.at)?' It needs loading again.':''),job:nw.id}));
  }
  return out;
}
function loadedAlerts(j,miss){ // the yard has confirmed a load
  var m=vehOf(j)+' for '+fshort(j.date)+': '+j.address+(miss.length?'. Missing: '+miss.map(itemName).join(', '):'')+'.', a={k:'load',t:miss.length?'Loaded with items missing':'Lorry loaded',m:m,job:j.id};
  return [Object.assign({to:j.ch},a)].concat(toBosses(a));
}
function checkAlerts(j,miss){ // the charge hand's morning check only raises an alert when something is missing
  if(!miss.length) return [];
  var a={k:'load',t:'Items missing at the morning check',m:j.address+', '+vehOf(j)+': '+miss.map(itemName).join(', ')+'.',job:j.id};
  return toBosses(a).concat(toAll(yardIds(),a));

document.addEventListener('dragstart',function(e){var c=e.target&&e.target.closest?e.target.closest('[data-job]'):null;if(!c)return;S.drag=c.dataset.job;try{e.dataTransfer.setData('text/plain',S.drag);e.dataTransfer.effectAllowed='move';}catch(_){ }document.body.classList.add('dragging');});
document.addEventListener('dragover',function(e){if(!S.drag)return;var c=e.target.closest?e.target.closest('[data-drop]'):null;if(!c)return;e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(_){ }if(S.over!==c){if(S.over)S.over.classList.remove('over');S.over=c;c.classList.add('over');}});
document.addEventListener('dragleave',function(e){var c=e.target.closest?e.target.closest('[data-drop]'):null;if(c&&S.over===c&&!c.contains(e.relatedTarget)){c.classList.remove('over');S.over=null;}});
document.addEventListener('drop',function(e){if(!S.drag)return;var c=e.target.closest?e.target.closest('[data-drop]'):null;if(!c)return;e.preventDefault();var id=S.drag,pd=c.dataset.drop.split('|');endDrag();moveJob(id,pd[0],pd[1]);});
document.addEventListener('dragend',function(){endDrag();if(S.deferred)render();});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.a){e.preventDefault();e.target.click();}});
var wasWide=window.innerWidth>=1000;
window.addEventListener('resize',function(){var w=window.innerWidth>=1000;if(w!==wasWide){wasWide=w;S.nav=true;render();}});
boot();
})();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
